const AUDIOMETER_HEADSET_MAPPING={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
const FIXED_LOCATIONS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터','미선택'];
const IGNORE_TEXT=["특이사항없음","특이사항 없음","이상없음","이상 없음"];
window.G={user:null,all:[],mode:'equip',currentYear:2026,currentMonth:1};

window.doLogin=function(){
const id=document.getElementById('loginId').value.trim();
const name=document.getElementById('loginName').value.trim();
const pw=document.getElementById('loginPw').value.trim();
if(!id||!name||!pw){alert('모두 입력하세요');return}
window.G.user={id:id,name:name,team:'5팀'};
localStorage.setItem('equipUser',JSON.stringify(window.G.user));
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
document.getElementById('userInfo').textContent=window.G.user.name;
window.load();
};

window.doLogout=function(){window.G.user=null;localStorage.removeItem('equipUser');document.getElementById('mainScreen').style.display='none';document.getElementById('loginScreen').style.display='flex'};

window.load=async function(){
window.G.all=[];
document.getElementById('status').innerText='로딩중...';
for(const [name,gid] of Object.entries(SHEETS)){
try{
const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+gid;
const res=await fetch(url,{cache:'no-store'});
const csv=await res.text();
const parsed=Papa.parse(csv.trim(),{header:true,skipEmptyLines:true});
parsed.data.forEach(row=>{
const assetNum=row['자산번호']||row['자산 번호']||'';
if(assetNum&&assetNum.trim()){
window.G.all.push({...row,_equip:name});
}
});
}catch(e){console.error(name,e)}
}
document.getElementById('status').innerText=window.G.all.length+'개 장비';
window.show();
};

function isRealIssue(text){
if(!text||!text.trim())return false;
const clean=text.replace(/\s/g,"").toLowerCase();
for(const ig of IGNORE_TEXT){
const cleanIgnore=ig.replace(/\s/g,"").toLowerCase();
if(clean===cleanIgnore||clean.includes(cleanIgnore))return false;
}
return true;
}

function parseCurrentLocation(row){
const val=row['현재위치']||row['현재 위치']||'';
if(!val||!val.trim())return{location:"미선택",date:null};
const str=val.toString().trim();
const dateMatch=str.match(/\((\d{1,2})\/(\d{1,2})\)/);
const date=dateMatch?dateMatch[1].padStart(2,'0')+'/'+dateMatch[2].padStart(2,'0'):null;
const cleanStr=str.replace(/\(.*?\)/g,'').trim();
let location="미선택";
if(cleanStr.includes('아산1'))location='아산1';
else if(cleanStr.includes('평택'))location='평택';
else if(cleanStr.includes('수원'))location='수원';
else if(cleanStr.includes('사무실'))location='사무실';
else if(cleanStr.includes('센터'))location='센터';
else if(cleanStr.includes('의공실'))location='의공실';
else{
const match=cleanStr.match(/(?:^|[^\d])([1-6])(?:팀|[^\d]|$)/);
if(match)location=match[1];
}
return{location,date};
}

function getDetailByDate(row,targetDate){
if(!targetDate)return null;
const dateKeys=Object.keys(row).filter(k=>k.match(/^\d{1,2}[\/\-]\d{1,2}$/));
for(const key of dateKeys){
const normalized=key.trim().replace('-','/').split('/').map(p=>p.padStart(2,'0')).join('/');
if(normalized===targetDate&&row[key]&&row[key].trim()){
return row[key].trim();
}
}
return null;
}

window.setMode=function(m){
window.G.mode=m;
document.getElementById('tab-equip').classList.toggle('active',m==='equip');
document.getElementById('tab-location').classList.toggle('active',m==='location');
document.getElementById('tab-date').classList.toggle('active',m==='date');
window.show();
};

window.show=function(){
const b=document.getElementById('searchBox');

if(window.G.mode==='equip'){

Object.keys(SHEETS).forEach(name=>{

});

}else{
window.showCalendar();
}
};

window.updateLocations=function(){
const eq=document.getElementById('es').value;
if(!eq){
document.getElementById('lb').style.display='none';
document.getElementById('results').innerHTML='';
return;
}
let totalEquipCount=0;
const locationCounts={};
FIXED_LOCATIONS.forEach(loc=>{
const count=window.G.all.filter(r=>r._equip===eq&&parseCurrentLocation(r).location===loc).length;
locationCounts[loc]=count;
totalEquipCount+=count;
});
document.getElementById('ls').innerHTML='<option value="">장소 선택</option><option value="전체">전체 ('+totalEquipCount+'개)</option>'+FIXED_LOCATIONS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('');
document.getElementById('lb').style.display='block';
document.getElementById('results').innerHTML='';
};

window.displayResults=function(){
const eq=document.getElementById('es').value;
const loc=document.getElementById('ls').value;
if(!loc){
document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center;color:#999;">장소를 선택해주세요</p>';
return;
}
let found;
if(loc==='전체'){
found=window.G.all.filter(r=>r._equip===eq);
}else{
found=window.G.all.filter(r=>r._equip===eq&&parseCurrentLocation(r).location===loc);

if(found.length===0){
document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center;color:#999;">해당 장소에 장비가 없습니다</p>';
return;
}
let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAllEquipment(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAllEquipment(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.showBulkModal()">수령/반납</button></div>';
html+=found.map(r=>{
const data=parseCurrentLocation(r);
const locName=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;
const assetNum=r['자산번호']||r['자산 번호']||'';
const detail=data.date?getDetailByDate(r,data.date):null;
const hasIssue=detail&&isRealIssue(detail);
const cardClass=hasIssue?'card issue':'card';
const noteClass=hasIssue?'card-note':'card-note normal';
let modelName=r['모델']||'';
let serialNum=r['제조번호']||r['제조 번호']||'';
if(r._equip==='폐활량'&&LUNG_ASSET_MAPPING[assetNum]){
modelName=LUNG_ASSET_MAPPING[assetNum].model;
serialNum=LUNG_ASSET_MAPPING[assetNum].sn;
}
const modelInfo=(modelName||serialNum)?' (모델: '+modelName+', S/N: '+serialNum+')':'';
const headsetInfo=(r._equip==='청력기'&&AUDIOMETER_HEADSET_MAPPING[assetNum])?' (헤드셋: '+AUDIOMETER_HEADSET_MAPPING[assetNum]+')':'';
const equipData=JSON.stringify({
'자산번호':assetNum,
'_equip':r._equip
}).replace(/'/g,'&apos;');
return '<div class="'+cardClass+'"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div style="flex:1"><div class="card-title">'+locName+' / '+r._equip+' / '+assetNum+modelInfo+headsetInfo+'</div>'+(detail?'<div class="'+noteClass+'">'+detail+'</div>':'')+'</div></div>';
}).join('');
document.getElementById('results').innerHTML=html;
};

window.displayLocationResults=function(){
const loc=document.getElementById('locationSelect').value;
if(!loc){
document.getElementById('results').innerHTML='';
return;
}
let found=window.G.all.filter(r=>parseCurrentLocation(r).location===loc);
if(found.length===0){
document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center;color:#999;">해당 장소에 장비가 없습니다</p>';
return;
}
let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAllEquipment(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAllEquipment(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.showBulkModal()">수령/반납</button></div>';
html+=found.map(r=>{
const data=parseCurrentLocation(r);
const locName=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;
const assetNum=r['자산번호']||r['자산 번호']||'';
const detail=data.date?getDetailByDate(r,data.date):null;
const hasIssue=detail&&isRealIssue(detail);
const cardClass=hasIssue?'card issue':'card';
const noteClass=hasIssue?'card-note':'card-note normal';
let modelName=r['모델']||'';
let serialNum=r['제조번호']||r['제조 번호']||'';
if(r._equip==='폐활량'&&LUNG_ASSET_MAPPING[assetNum]){
modelName=LUNG_ASSET_MAPPING[assetNum].model;
serialNum=LUNG_ASSET_MAPPING[assetNum].sn;
}
const modelInfo=(modelName||serialNum)?' (모델: '+modelName+', S/N: '+serialNum+')':'';
const headsetInfo=(r._equip==='청력기'&&AUDIOMETER_HEADSET_MAPPING[assetNum])?' (헤드셋: '+AUDIOMETER_HEADSET_MAPPING[assetNum]+')':'';
const equipData=JSON.stringify({
'자산번호':assetNum,
'_equip':r._equip
}).replace(/'/g,'&apos;');
return '<div class="'+cardClass+'"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div style="flex:1"><div class="card-title">'+locName+' / '+r._equip+' / '+assetNum+modelInfo+headsetInfo+'</div>'+(detail?'<div class="'+noteClass+'">'+detail+'</div>':'')+'</div></div>';
}).join('');
document.getElementById('results').innerHTML=html;
};

window.selectAllEquipment=function(checked){
document.querySelectorAll('.equipment-checkbox').forEach(cb=>cb.checked=checked);
};

window.showBulkModal=function(){
const checked=document.querySelectorAll('.equipment-checkbox:checked');
if(checked.length===0){alert('선택된 장비가 없습니다');return}
document.getElementById('bulkTeam').value=window.G.user.team;
document.getElementById('bulkManager').value=window.G.user.name;
document.getElementById('bulkModal').classList.add('active');
};

window.toggleReturn=function(){
const r=document.getElementById('bulkType').value==='반납';
document.getElementById('returnGroup').classList.toggle('hidden',!r);
if(!r)document.getElementById('customGroup').classList.add('hidden');
};

window.toggleCustom=function(){
const c=document.getElementById('returnReason').value==='기타';
document.getElementById('customGroup').classList.toggle('hidden',!c);
};

window.closeModal=function(id){
document.getElementById(id).classList.remove('active');
};

window.submitBulk=async function(){
const checked=document.querySelectorAll('.equipment-checkbox:checked');
if(checked.length===0){alert('선택된 장비가 없습니다');return}
const type=document.getElementById('bulkType').value;
const team=document.getElementById('bulkTeam').value;
const mgr=document.getElementById('bulkManager').value.trim();
const memo=document.getElementById('bulkMemo').value.trim();
const date=document.getElementById('bulkDate').value;
let reason='';
if(type==='반납'){
reason=document.getElementById('returnReason').value;
if(reason==='기타')reason=document.getElementById('customReason').value.trim();
if(!reason){alert('반납사유 입력');return}
}
if(!team||!mgr||!memo||!date){alert('모두 입력');return}
document.getElementById('loading').classList.add('active');
try{
for(const cb of checked){
const equipData=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));
const url=API+'?equipment='+encodeURIComponent(equipData._equip)+'&assetNo='+encodeURIComponent(equipData.자산번호)+'&team='+encodeURIComponent(team)+'&status='+encodeURIComponent(type)+'&manager='+encodeURIComponent(mgr)+'&memo='+encodeURIComponent(memo)+'&returnReason='+encodeURIComponent(reason)+'&date='+date;
await fetch(url);
}
alert('등록완료');
window.closeModal('bulkModal');
await window.load();
}catch(e){
alert('실패:'+e.message);
}finally{
document.getElementById('loading').classList.remove('active');
}
};

window.showCalendar=function(){
const b=document.getElementById('searchBox');
const dateEquipments={};
window.G.all.forEach(r=>{
const data=parseCurrentLocation(r);
if(data.date){
const detail=getDetailByDate(r,data.date);
if(detail&&isRealIssue(detail)){
if(!dateEquipments[data.date]){
dateEquipments[data.date]=new Set();
}
dateEquipments[data.date].add(r._equip);
}
}
});
const firstDay=new Date(window.G.currentYear,window.G.currentMonth-1,1).getDay();
const lastDate=new Date(window.G.currentYear,window.G.currentMonth,0).getDate();
let html='<div class="month-nav"><button onclick="window.moveMonth(-1)">◀</button><b>'+window.G.currentYear+'년 '+window.G.currentMonth+'월</b><button onclick="window.moveMonth(1)">▶</button></div><div class="calendar">';
['일','월','화','수','목','금','토'].forEach(d=>{html+='<div class="cal-header">'+d+'</div>'});
for(let i=0;i<firstDay;i++)html+='<div></div>';
for(let d=1;d<=lastDate;d++){
const dateStr=String(window.G.currentMonth).padStart(2,'0')+'/'+String(d).padStart(2,'0');
const equipSet=dateEquipments[dateStr];
const equipList=equipSet?Array.from(equipSet):[];
const hasIssue=equipList.length>0;
let dayContent=d;
if(hasIssue){
dayContent+='<div style="font-size:10px;margin-top:4px;line-height:1.3;">';
equipList.forEach(eq=>{
dayContent+='<div style="font-weight:bold;">'+eq+'</div>';
});
dayContent+='</div>';
}
html+='<div class="cal-day'+(hasIssue?' issue':'')+'" onclick="window.selectDate(\''+dateStr+'\',this)">'+dayContent+'</div>';
}
html+='</div><div id="dateRes"></div>';
b.innerHTML=html;
};

window.moveMonth=function(direction){
window.G.currentMonth+=direction;
if(window.G.currentMonth>12){window.G.currentMonth=1;window.G.currentYear++}
else if(window.G.currentMonth<1){window.G.currentMonth=12;window.G.currentYear--}
window.showCalendar();
};

window.selectDate=function(dateStr,element){
document.querySelectorAll('.cal-day').forEach(x=>x.classList.remove('selected'));
element.classList.add('selected');
const found=window.G.all.filter(r=>{
const data=parseCurrentLocation(r);
if(data.date!==dateStr)return false;
const detail=getDetailByDate(r,data.date);
return detail&&isRealIssue(detail);
});
if(found.length===0){
document.getElementById('dateRes').innerHTML='<p style="padding:20px;text-align:center;">특이사항 없음</p>';
return;
}
document.getElementById('dateRes').innerHTML=found.map(r=>{
const data=parseCurrentLocation(r);
const locName=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;
const assetNum=r['자산번호']||r['자산 번호']||'';
const detail=getDetailByDate(r,data.date);
return '<div class="card issue"><div class="card-title">'+locName+' / '+r._equip+' / '+assetNum+'</div><div class="card-note">'+detail+'</div></div>';
}).join('');
};

window.showEdit=function(){
document.getElementById('editId').value=window.G.user.id;
document.getElementById('editName').value=window.G.user.name;
document.getElementById('editTeam').value=window.G.user.team;
document.getElementById('editModal').classList.add('active');
};

window.saveEdit=function(){
window.G.user.team=document.getElementById('editTeam').value;
localStorage.setItem('equipUser',JSON.stringify(window.G.user));
document.getElementById('userInfo').textContent=window.G.user.name;
alert('수정완료');
window.closeModal('editModal');
};

document.getElementById('bulkDate').valueAsDate=new Date();
const saved=localStorage.getItem('equipUser');
if(saved){
window.G.user=JSON.parse(saved);
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
document.getElementById('userInfo').textContent=window.G.user.name;
window.load();
}
</script>
</body>
</html>
