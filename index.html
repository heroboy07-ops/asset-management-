async function doRegister(){const name=document.getElementById('regName').value;const empId=document.getElementById('regEmpId').value;const pass=document.getElementById('regPass').value;const team=document.getElementById('regTeam').value;if(!name||!empId||!pass||!team){alert('모든 항목을 입력하세요');return}try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'register',user:{name,empId,pass,team}})});const result=await res.json();if(result.success){alert(result.message||'가입 완료!');if(result.user){currentUser=result.user;currentUser.password=pass;localStorage.setItem('currentLogin',JSON.stringify(currentUser));document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='block';if(String(empId)==='218062'){document.getElementById('tab-admin').style.display='block';document.getElementById('adminBtn').style.display='block'}document.getElementById('statusText').innerText='로딩 중...';show();load(false)}else{backToLogin()}}else{alert(result.error||'가입 실패')}}catch(e){alert('서버 오류: '+e.message)}}

async function updateProfile(){const newPass=document.getElementById('newPass').value;const newTeam=document.getElementById('newTeam').value;if(!newTeam){alert('팀을 입력하세요');return}try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'updateProfile',empId:currentUser.empId,newPass:newPass,newTeam:newTeam})});const result=await res.json();if(result.success){alert('수정 완료');currentUser.team=newTeam;if(newPass&&newPass.trim()!==''){currentUser.password=newPass}localStorage.setItem('currentLogin',JSON.stringify(currentUser));closeModal();document.getElementById('statusText').innerText=allData.length+'개 장비 ('+currentUser.name+' - '+currentUser.team+'팀)'}else{alert('오류: '+result.error)}}catch(e){alert('서버 오류: '+e.message)}}

async function load(forceRefresh){const now=Date.now();if(!forceRefresh&&dataCache&&(now-cacheTime)<1800000){allData=dataCache;document.getElementById('statusText').innerText=allData.length+'개 장비'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show();return}if(forceRefresh){localStorage.removeItem('equipCache');dataCache=null;cacheTime=0}showLoading(true);try{const res=await fetch(API+'?action=generateAll&t='+now);const data=await res.json();if(data.equipment){allData=data.equipment;dataCache=data.equipment;cacheTime=now;localStorage.setItem('equipCache',JSON.stringify({data:allData,time:now}));document.getElementById('statusText').innerText=allData.length+'개 장비'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show()}}catch(e){const cache=localStorage.getItem('equipCache');if(cache){const parsed=JSON.parse(cache);allData=parsed.data;dataCache=parsed.data;document.getElementById('statusText').innerText=allData.length+'개 장비 (캐시)'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show()}else{alert('로딩 실패: '+e.message)}}finally{showLoading(false)}}
function parseCurrentLocation(row){const val=row.location||'';if(!val||!val.trim())return{location:"미선택",date:null};const str=val.toString().trim();const dateMatch=str.match(/\((\d{1,2})\/(\d{1,2})\)/);const date=dateMatch?dateMatch[1].padStart(2,'0')+'/'+dateMatch[2].padStart(2,'0'):null;const cleanStr=str.replace(/\(.*?\)/g,'').trim();let location="미선택";if(cleanStr.includes('아산1'))location='아산1';else if(cleanStr.includes('화성'))location='화성';else if(cleanStr.includes('평택'))location='평택';else if(cleanStr.includes('수원'))location='수원';else if(cleanStr.includes('사무실'))location='사무실';else if(cleanStr.includes('센터'))location='센터';else if(cleanStr.includes('의공실'))location='의공실';else if(cleanStr.includes('1팀')||cleanStr.trim()==='1')location='화성';else{const match=cleanStr.match(/(?:^|[^\d])([2-6])(?:팀|[^\d]|$)/);if(match)location=match[1];else if(cleanStr.trim()!=='')location=cleanStr.trim()}return{location,date}}
function isRealIssue(text){if(!text||!text.trim())return false;const clean=text.replace(/\s/g,"").toLowerCase();if(clean.match(/wt\d+/)||clean.match(/nt\d+/)||clean.match(/dm\d+/))return false;for(const ig of IGNORE_TEXT){const cleanIgnore=ig.replace(/\s/g,"").toLowerCase();if(clean===cleanIgnore||clean.includes(cleanIgnore))return false}return true}

async function submitAction(action){const name=document.getElementById('actionName').value;let team=document.getElementById('actionTeam').value;if(!name||!team){alert('이름과 팀을 입력하세요');return}if(team==='1')team='화성';const hasMemo=document.querySelector('input[name="memo"]:checked').value==='있음';let memo='특이사항 없음';if(hasMemo){const memoInput=document.getElementById('memoText').value.trim();if(!memoInput){alert('특이사항을 입력하세요');return}memo=memoInput}let newLocation=team;const teamLabel=/^[2-6]$/.test(team)?team+'팀':team;let cellValue=teamLabel+' '+action+' ('+name+' - '+memo+')';if(action==='반납'){const reason=document.getElementById('returnReason').value;if(!reason){alert('반납사유를 선택하세요');return}const reasonText=reason==='기타'?document.getElementById('returnReasonEtc').value:reason;if(reason==='의공실'){newLocation='의공실'}else{newLocation='사무실'}cellValue=teamLabel+' 반납 (반납사유-'+reasonText+'/'+name+' - '+memo+')';}else if(action==='수령예정'){const dest=document.getElementById('destTeam').value;if(!dest){alert('목적지를 선택하세요');return}newLocation=dest==='1'?'화성':dest;cellValue=teamLabel+' 수령예정 ('+name+' - '+memo+')';}else if(action==='보유'){cellValue=teamLabel+' 보유 ('+name+' - '+memo+')';}const locationLabel=/^[2-6]$/.test(newLocation)?newLocation+'팀':newLocation;const entries=Array.from(selectedEquipments.values()).map(e=>({category:e.category,assetNo:e.assetNo,newLocation:locationLabel+' ('+(new Date().getMonth()+1).toString().padStart(2,'0')+'/'+(new Date().getDate()).toString().padStart(2,'0')+')',cellValue:cellValue}));showLoading(true);try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'update',entries:entries})});const result=await res.json();showLoading(false);if(result.success){closeActionModal();selectedEquipments.clear();updatePreview();alert('등록 완료');load(true)}else{alert('등록 실패: '+result.error)}}catch(e){showLoading(false);alert('등록 실패: '+e.message)}}
function showEmailModal(){if(selectedEquipments.size===0){alert('장비를 선택하세요');return}selectedSender=currentUser?currentUser.name:null;const names=Object.keys(EMAILS);let equipList='<div style="margin-bottom:15px;padding:15px;background:#fff;border:2px solid #0984e3;border-radius:8px;max-height:200px;overflow-y:auto"><div style="font-weight:bold;margin-bottom:10px;color:#0984e3">선택된 장비 ('+selectedEquipments.size+'개)</div>';selectedEquipments.forEach((item,asset)=>{equipList+='<div style="padding:5px;border-bottom:1px solid #eee;font-size:14px">• '+item.category+' - '+item.assetNo+'</div>'});equipList+='</div>';let html='';if(selectedSender&&EMAILS[selectedSender]){html+='<div style="margin-bottom:15px;padding:10px;background:#e8f5e9;border-radius:8px;color:#27ae60;font-weight:bold">📤 보내는 사람: '+selectedSender+'</div>'}html+=equipList+'<div style="margin-bottom:20px;font-size:18px;font-weight:bold">받는 사람 선택</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="sendEmail(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html;document.getElementById('emailModal').style.display='block'}
function selectSender(senderName){selectedSender=senderName;const names=Object.keys(EMAILS);let equipList='<div style="margin-bottom:15px;padding:15px;background:#fff;border:2px solid #0984e3;border-radius:8px;max-height:200px;overflow-y:auto"><div style="font-weight:bold;margin-bottom:10px;color:#0984e3">선택된 장비 ('+selectedEquipments.size+'개)</div>';selectedEquipments.forEach((item,asset)=>{equipList+='<div style="padding:5px;border-bottom:1px solid #eee;font-size:14px">• '+item.category+' - '+item.assetNo+'</div>'});equipList+='</div>';let html='<div style="margin-bottom:15px;padding:10px;background:#e8f5e9;border-radius:8px;color:#27ae60;font-weight:bold">📤 보내는 사람: '+selectedSender+'</div>'+equipList+'<div style="margin-bottom:20px;font-size:18px;font-weight:bold">받는 사람 선택</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="sendEmail(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html}
async function sendEmail(recipientName){if(!selectedSender||selectedEquipments.size===0)return;document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:40px">📧</div><div style="margin-top:20px;font-size:18px;font-weight:bold">메일 전송 중...</div></div>';try{const selectedArray=Array.from(selectedEquipments.values());const numberedEquip=selectedArray.map((item,index)=>{let equipData={'순번':index+1,'기기명':item.name,'모델':'','S/N':''};if(item.category==='폐활량'&&LUNG[item.assetNo]){equipData['모델']=LUNG[item.assetNo].model;equipData['S/N']=LUNG[item.assetNo].sn}else{equipData['모델']=item.model||'';equipData['S/N']=item.serial||''}return equipData});const ws=XLSX.utils.json_to_sheet(numberedEquip);ws['!cols']=[{wch:8},{wch:40},{wch:25},{wch:28}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'장비목록');const wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});const fileName='장비목록_'+selectedEquipments.size+'개_'+new Date().toISOString().slice(0,10)+'.xlsx';await fetch(MAIL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:EMAILS[recipientName],sender:EMAILS[selectedSender],senderName:selectedSender,locationName:currentLoc||currentCat||'장비',excelBase64:wbout,fileName:fileName})});selectedEquipments.clear();updatePreview();if(mode==='equip'){showEquipList()}else if(mode==='location'){showLocationList()}document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">📨</div><div style="margin-top:20px;font-size:18px;font-weight:bold;color:#00b894">메일 전송 완료!</div><div style="margin-top:10px;color:#636e72">'+selectedSender+' → '+recipientName+'</div><button class="recipient-btn" onclick="closeModal()" style="margin-top:20px">닫기</button></div>'}catch(e){document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">❌</div><div style="margi function showCalendar(){const b=document.getElementById('searchBox');const dateEquipments={};allData.forEach(r=>{if(r.dateDetails){Object.entries(r.dateDetails).forEach(([date,detail])=>{if(detail&&detail.trim()!==''){const parts=detail.split('/').map(p=>p.trim());const lastPart=parts[parts.length-1];const clean=lastPart.replace(/\s/g,'').toLowerCase();const hasIssue=clean!=='특이사항없음'&&clean!=='이상없음'&&!clean.includes('특이사항없음')&&!clean.includes('이상없음');if(hasIssue){if(!dateEquipments[date]){dateEquipments[date]=new Set()}dateEquipments[date].add(r.category)}}})}});const firstDay=new Date(currentYear,currentMonth-1,1).getDay();const lastDate=new Date(currentYear,currentMonth,0).getDate();let html='<div class="box"><div class="month-nav"><button onclick="moveMonth(-1)">◀</button><b>'+currentYear+'년 '+currentMonth+'월</b><button onclick="moveMonth(1)">▶</button></div><div class="calendar">';['일','월','화','수','목','금','토'].forEach(d=>{html+='<div class="cal-header">'+d+'</div>'});for(let i=0;i<firstDay;i++)html+='<div></div>';for(let d=1;d<=lastDate;d++){const dateStr=String(currentMonth).padStart(2,'0')+'/'+String(d).padStart(2,'0');const equipSet=dateEquipments[dateStr];const equipList=equipSet?Array.from(equipSet):[];const hasIssue=equipList.length>0;let dayContent=d;if(hasIssue){dayContent+='<div style="font-size:10px;margin-top:4px;line-height:1.3;">';equipList.forEach(eq=>{const color=COLORS[eq]||'#2d3436';dayContent+='<div style="color:'+color+';font-weight:bold">'+eq+'</div>'});dayContent+='</div>'}html+='<div class="cal-day'+(hasIssue?' issue':'')+'" onclick="selectDate(\''+dateStr+'\',this)">'+dayContent+'</div>'}html+='</div><div id="dateRes"></div></div>';b.innerHTML=html}
function moveMonth(direction){currentMonth+=direction;if(currentMonth>12){currentMonth=1;currentYear++}else if(currentMonth<1){currentMonth=12;currentYear--}showCalendar()}
function selectDate(dateStr,element){document.querySelectorAll('.cal-day').forEach(x=>x.classList.remove('selected'));element.classList.add('selected');const found=allData.filter(r=>{if(!r.dateDetails||!r.dateDetails[dateStr])return false;const detail=r.dateDetails[dateStr];if(!detail||!detail.trim())return false;const parts=detail.split('/').map(p=>p.trim());const lastPart=parts[parts.length-1];const clean=lastPart.replace(/\s/g,'').toLowerCase();return clean!=='특이사항없음'&&clean!=='이상없음'&&!clean.includes('특이사항없음')&&!clean.includes('이상없음')});if(found.length===0){document.getElementById('dateRes').innerHTML='<p style="padding:20px;text-align:center">특이사항 없음</p>';return}document.getElementById('dateRes').innerHTML='<div style="margin-top:15px">'+found.map(r=>{let detail=r.dateDetails[dateStr]||'';const parts=detail.split('/').map(p=>p.trim());detail=replaceTeamName(parts.join(' / '));const color=COLORS[r.category]||'#2d3436';return '<div class="card-container" style="display:block;border-left:5px solid '+color+'"><div class="card-title" style="color:'+color+';font-weight:bold">'+r.category+' ('+dateStr+') / '+r.assetNo+'</div><div class="card-divider"></div><div class="card-memo" style="color:#e74c3c;font-weight:bold">'+detail+'</div></div>'}).join('')+'</div>'}
async function showAdminPanel(){document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title" style="background:#e74c3c">회원 관리</div><button onclick="loadUsers()" style="margin:10px;padding:10px 20px;background:#0984e3;color:white;border:none;border-radius:5px;cursor:pointer">새로고침</button></div>';document.getElementById('results').innerHTML='<p style="text-align:center;padding:20px">로딩 중...</p>';loadUsers()}
async function loadUsers(){try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'getUsers'})});const result=await res.json();if(result.success){const users=result.users;let html='<div style="padding:20px">';if(users.length===0){html+='<p style="text-align:center">등록된 사용자가 없습니다</p>'}else{const pending=users.filter(u=>u.status==='대기');const approved=users.filter(u=>u.status==='승인');if(pending.length>0){html+='<h3 style="color:#e74c3c;margin-bottom:15px">승인 대기 ('+pending.length+'명)</h3>';pending.forEach(u=>{html+='<div style="background:#fff3cd;padding:15px;margin-bottom:10px;border-radius:8px;border-left:4px solid #ffc107"><div style="font-weight:bold;font-size:16px">'+u.name+' (사번: '+u.empId+')</div><div style="color:#666;margin:5px 0">팀: '+u.team+'</div><div style="margin-top:10px"><button onclick="approveUserAction(\''+u.empId+'\')" style="padding:8px 15px;background:#27ae60;color:white;border:none;border-radius:5px;cursor:pointer;margin-right:5px">승인</button><button onclick="rejectUserAction(\''+u.empId+'\')" style="padding:8px 15px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer">거부</button></div></div>'})}if(approved.length>0){html+='<h3 style="color:#27ae60;margin:20px 0 15px 0">승인된 사용자 ('+approved.length+'명)</h3>';approved.forEach(u=>{html+='<div style="background:#d4edda;padding:15px;margin-bottom:10px;border-radius:8px;border-left:4px solid #28a745"><div style="font-weight:bold;font-size:16px">'+u.name+' (사번: '+u.empId+')</div><div style="color:#666;margin:5px 0">팀: '+u.team+'</div><div style="margin-top:10px"><button onclick="deleteUserAction(\''+u.empId+'\',\''+u.name+'\')" style="padding:8px 15px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer">삭제</button></div></div>'})}}html+='</div>';document.getElementById('results').innerHTML=html}else{document.getElementById('results').innerHTML='<p style="text-align:center;padding:20px;color:#e74c3c">오류: '+result.error+'</p>'}}catch(e){document.getElementById('results').innerHTML='<p style="text-align:center;padding:20px;color:#e74c3c">서버 오류: '+e.message+'</p>'}}
async function approveUserAction(empId){if(!confirm('승인하시겠습니까?'))return;try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'approveUser',empId:empId})});const result=await res.json();if(result.success){alert('승인 완료');loadUsers()}else{alert('오류: '+result.error)}}catch(e){alert('서버 오류: '+e.message)}}
async function rejectUserAction(empId){if(!confirm('거부하시겠습니까? 사용자 정보가 삭제됩니다.'))return;try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'rejectUser',empId:empId})});const result=await res.json();if(result.success){alert('거부 완료');loadUsers()}else{alert('오류: '+result.error)}}catch(e){alert('서버 오류: '+e.message)}}
async function deleteUserAction(empId,name){if(!confirm(name+' 사용자를 삭제하시겠습니까?'))return;try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'deleteUser',empId:empId})});const result=await res.json();if(result.success){alert('삭제 완료');loadUsers()}else{alert('오류: '+result.error)}}catch(e){alert('서버 오류: '+e.message)}}
window.onload=async function(){const savedLogin=localStorage.getItem('currentLogin');if(savedLogin){try{const saved=JSON.parse(savedLogin);currentUser=saved;document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='block';if(String(currentUser.empId)==='218062'){document.getElementById('tab-admin').style.display='block';document.getElementById('adminBtn').style.display='block'}const cache=localStorage.getItem('equipCache');if(cache){const parsed=JSON.parse(cache);const now=Date.now();if((now-parsed.time)<1800000){allData=parsed.data;dataCache=parsed.data;cacheTime=parsed.time;document.getElementById('statusText').innerText=allData.length+'개 장비 ('+currentUser.name+' - '+currentUser.team+'팀)';show();load(false);return}}load(false)}catch(e){document.getElementById('loginScreen').style.display='block'}}else{document.getElementById('loginScreen').style.display='block'}};
</script>
