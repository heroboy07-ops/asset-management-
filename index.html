        .login-box .link-btn { background: transparent; color: #667eea; text-decoration: underline; }
        .hidden { display: none !important; }
        .main-screen { display: none; min-height: 100vh; padding-bottom: 70px; }
        .main-screen.active { display: block; }
        .header { background: #667eea; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; }
        .header-right { display: flex; gap: 10px; }
        .header button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .btn-logout { background: #dc3545; }
        .search-bar { padding: 15px; background: white; }
        .search-bar input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        .category-tabs { display: flex; overflow-x: auto; background: white; padding: 10px; gap: 10px; }
        .category-tab { padding: 10px 20px; background: #f5f5f5; border: none; border-radius: 20px; white-space: nowrap; font-size: 14px; cursor: pointer; }
        .category-tab.active { background: #667eea; color: white; font-weight: bold; }
        .equipment-list { padding: 15px; }
        .equipment-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; }
        .equipment-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .equipment-info { font-size: 14px; color: #666; margin-bottom: 3px; }
        .equipment-location { display: inline-block; padding: 4px 12px; background: #667eea; color: white; border-radius: 12px; font-size: 12px; margin-top: 8px; }

        .modal-content { background: white; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; }

        .modal-close { font-size: 28px; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        .form-group textarea { min-height: 80px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #667eea; color: white; }

function renderCategoryTabs() {
    const container = document.getElementById('categoryTabs');
    container.innerHTML = '<button class="category-tab active" onclick="selectCategory(\'\')">전체</button>';
    
    CATEGORIES.forEach(cat => {
        const count = allEquipment.filter(e => e.category === cat).length;
        if (count > 0) {
            container.innerHTML += `<button class="category-tab" onclick="selectCategory('${cat}')">${cat} (${count})</button>`;
        }
    });
}

function selectCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    filterEquipment();
}

function filterEquipment() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    filteredEquipment = allEquipment.filter(item => {
        const matchCat = !currentCategory || item.category === currentCategory;
        const matchSearch = !search || 
            item.name.toLowerCase().includes(search) ||
            item.assetNo.toLowerCase().includes(search) ||
            (item.serial && item.serial.toLowerCase().includes(search));
        return matchCat && matchSearch;
    });
    
    renderEquipmentList();
}

function renderEquipmentList() {
    const container = document.getElementById('equipmentList');
    
    if (filteredEquipment.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">검색 결과 없음</div>';
        return;
    }
    
    container.innerHTML = filteredEquipment.map(item => `
        <div class="equipment-item" onclick='showDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
            <div class="equipment-name">${item.name}</div>
            <div class="equipment-info">자산번호: ${item.assetNo}</div>
            ${item.serial ? `<div class="equipment-info">시리얼: ${item.serial}</div>` : ''}
            ${item.notebookModel ? `<div class="equipment-info">노트북: ${item.notebookModel} (${item.notebookSerial})</div>` : ''}
            ${item.headsetModel ? `<div class="equipment-info">헤드셋: ${item.headsetModel} (${item.headsetSerial})</div>` : ''}
            <span class="equipment-location">${item.location}</span>
        </div>
    `).join('');
}

function showDetail(item) {
    selectedEquipment = item;
    
    const html = `
        <div class="detail-item"><div class="detail-label">장비명</div><div class="detail-value">${item.name}</div></div>
        <div class="detail-item"><div class="detail-label">자산번호</div><div class="detail-value">${item.assetNo}</div></div>
        ${item.serial ? `<div class="detail-item"><div class="detail-label">시리얼</div><div class="detail-value">${item.serial}</div></div>` : ''}
        <div class="detail-item"><div class="detail-label">카테고리</div><div class="detail-value">${item.category}</div></div>
        <div class="detail-item"><div class="detail-label">현재위치</div><div class="detail-value">${item.location}</div></div>
        ${item.notebookModel ? `<div class="detail-item"><div class="detail-label">노트북모델</div><div class="detail-value">${item.notebookModel}</div></div><div class="detail-item"><div class="detail-label">노트북시리얼</div><div class="detail-value">${item.notebookSerial}</div></div>` : ''}
        ${item.headsetModel ? `<div class="detail-item"><div class="detail-label">헤드셋모델</div><div class="detail-value">${item.headsetModel}</div></div><div class="detail-item"><div class="detail-label">헤드셋시리얼</div><div class="detail-value">${item.headsetSerial}</div></div>` : ''}
    `;
    
    document.getElementById('equipmentDetail').innerHTML = html;
    document.getElementById('actionTeam').value = currentUser.team;
    document.getElementById('managerName').value = currentUser.name;
    document.getElementById('equipmentModal').classList.add('active');
}

function closeModal() {
    document.getElementById('equipmentModal').classList.remove('active');
}

function toggleReturn() {
    const isReturn = document.getElementById('actionType').value === '반납';
    document.getElementById('returnReasonGroup').style.display = isReturn ? 'block' : 'none';
}

async function submitAction() {
    if (!selectedEquipment) return;
    
    const type = document.getElementById('actionType').value;
    const team = document.getElementById('actionTeam').value;
    const reason = document.getElementById('returnReason').value.trim();
    const manager = document.getElementById('managerName').value.trim();
    const memo = document.getElementById('actionMemo').value.trim();
    const date = document.getElementById('actionDate').value;
    
    if (!team || !manager || !memo || !date) {
        alert('모든 항목을 입력하세요.');
        return;
    }
    
    if (type === '반납' && !reason) {
        alert('반납 사유를 입력하세요.');
        return;
    }
    
    document.getElementById('loading').classList.add('active');
    
    try {
        const url = `${API_URL}?equipment=${encodeURIComponent(selectedEquipment.category)}&assetNo=${encodeURIComponent(selectedEquipment.assetNo)}&team=${encodeURIComponent(team)}&status=${encodeURIComponent(type)}&manager=${encodeURIComponent(manager)}&memo=${encodeURIComponent(memo)}&returnReason=${encodeURIComponent(reason)}&date=${date}`;
        
        const response = await fetch(url);
        const result = await response.json();
        
        if (result.success) {
            // 로컬 데이터 업데이트
            const idx = allEquipment.findIndex(e => e.assetNo === selectedEquipment.assetNo);
            if (idx !== -1) {
                if (type === '수령' || type === '보유' || type === '수령예정') {
                    allEquipment[idx].location = team;
                } else if (type === '반납') {
                    allEquipment[idx].location = '사무실';
                }
            }
            
            alert('등록 완료!');
            closeModal();
            filterEquipment();
        } else {
            alert('등록 실패: ' + (result.error || '알 수 없는 오류'));
        }
    } catch (error) {
        alert('오류: ' + error.message);
    } finally {
        document.getElementById('loading').classList.remove('active');
    }
}
    </script>
</body>
</html>
