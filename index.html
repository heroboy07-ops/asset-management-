<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>사용자 정보 수정</title>
<style>
body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#d63031;padding:20px}
.box{background:white;border-radius:16px;padding:30px;max-width:400px;width:100%}
h1{font-size:24px;text-align:center;margin-bottom:30px;color:#d63031}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:14px}
button{width:100%;padding:14px;background:#d63031;color:white;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>👤 사용자 정보 수정</h1>
<input type="text" id="userId" placeholder="사번" value="218062">
<input type="text" id="userName" placeholder="이름" value="안성진">
<input type="text" id="userTeam" placeholder="팀" value="1팀">
<button onclick="fix()">수정</button>
</div>
<script>
function fix(){
const id=document.getElementById('userId').value.trim();
const name=document.getElementById('userName').value.trim();
const team=document.getElementById('userTeam').value.trim();
if(!id||!name||!team){alert('모두 입력');return;}
const users=JSON.parse(localStorage.getItem('users')||'[]');
const u=users.find(x=>x.employeeId===id);
if(u){
u.name=name;
u.team=team;
localStorage.setItem('users',JSON.stringify(users));
alert('✅ 수정 완료!\n이름: '+name+'\n팀: '+team);
}else{
alert('❌ 사번 없음!');
}
}
</script>
</body>
</html>
