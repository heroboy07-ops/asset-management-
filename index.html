<html lang="ko">
<head>

<title>장비관리 v3.2</title>
<style>

<body>

<div class="screen login-screen" id="loginScreen" style="display:flex">
<div class="login-box">
<h1>장비관리</h1>
<input type="text" id="loginId" placeholder="사번">
<input type="text" id="loginName" placeholder="이름">
<input type="password" id="loginPw" placeholder="비밀번호">
<button type="button" onclick="window.doLogin()">로그인</button>
<div class="version">v3.2 - 폐활량/청력기 정보 표시</div>
</div>
</div>

<div class="screen main-screen" id="mainScreen" style="display:none">
<div class="header">
<h1 id="status">로딩중...</h1>
<div class="header-right">
<span id="userInfo"></span>
<button class="btn-edit" onclick="window.showEdit()">정보수정</button>
<button class="btn-logout" onclick="window.doLogout()">로그아웃</button>
</div>
</div>

<div class="tabs">
<div class="tab active" id="tab-equip" onclick="window.setMode('equip')">장비별</div>
<div class="tab" id="tab-location" onclick="window.setMode('location')">팀별</div>
<div class="tab" id="tab-date" onclick="window.setMode('date')">날짜별</div>
</div>

<div id="searchBox" class="box"></div>
<div id="results"></div>
<div class="footer">v3.2</div>
</div>

<div class="modal" id="bulkModal">
<div class="modal-content">
<div class="modal-header"><h2>수령/반납</h2><span class="modal-close" onclick="window.closeModal('bulkModal')">×</span></div>
<div class="form-group"><label>상태</label><select id="bulkType"><option value="수령">수령</option><option value="반납">반납</option><option value="수령예정">수령예정</option><option value="보유">보유</option></select></div>
<div class="form-group"><label>팀/위치</label><select id="bulkTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="form-group hidden" id="returnGroup"><label>반납사유</label><select id="returnReason"><option value="팀해체">팀해체</option><option value="의공실">의공실</option><option value="장비점검">장비점검</option><option value="기타">기타</option></select></div>
<div class="form-group hidden" id="customGroup"><label>사유입력</label><input type="text" id="customReason"></div>
<div class="form-group"><label>관리자</label><input type="text" id="bulkManager"></div>
<div class="form-group"><label>특이사항</label><textarea id="bulkMemo">특이사항 없음</textarea></div>
<div class="form-group"><label>날짜</label><input type="date" id="bulkDate"></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.submitBulk()">등록</button><button class="btn-secondary" onclick="window.closeModal('bulkModal')">취소</button></div>
</div>
</div>

<div class="modal" id="editModal">
<div class="modal-content">
<div class="modal-header"><h2>정보수정</h2><span class="modal-close" onclick="window.closeModal('editModal')">×</span></div>
<div class="form-group"><label>사번</label><input type="text" id="editId" disabled></div>
<div class="form-group"><label>이름</label><input type="text" id="editName" disabled></div>
<div class="form-group"><label>팀</label><select id="editTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.saveEdit()">저장</button><button class="btn-secondary" onclick="window.closeModal('editModal')">취소</button></div>
</div>
</div>

<script>
const VERSION='3.2';
const API='https://script.google.com/macros/s/AKfycbwCjPAGh15ByTlOapraFz534GIQIrtPfbBKSTVmKLxqt6uEnUtTmTnXI53P7mT-kxBA/exec';
const LOCS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터','미선택'];
const EMAIL={'조해영':'hy0617.jo@samsung.com','백수빈':'subeen2319.baek@samsung.com','문선미':'sm0316.moon@samsung.com','김보현':'bohyeon6601.kim@samsung.com','김정민':'jm0605.kim@samsung.com','고희진':'heejin3579.ko@samsung.com','이지연':'joanna0812.lee@samsung.com','신수인':'suingss0120.shin@samsung.com','김성현':'seonghyeon402.kim@samsung.com','안황코':'sj0206.ahn@samsung.com'};
const LUNG={'50601-00770':{model:'NT300E5K-K34S',sn:'0N8V91IHB00202E'},'50601-00771':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00009R'},'50601-00772':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00410Y'},'50601-00773':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00281R'},'50601-00774':{model:'NT300E5K-L26W',sn:'0QP191IU100958E'},'50601-00775':{model:'NT300E5X-AD2S',sn:'HxX391RD100005B'},'50601-00776':{model:'NT300E5C-A39S',sn:'JkMM91DF300107K'},'50601-00822':{model:'NT300E5K-K34S',sn:'0N8V91IHB00226K'},'50601-00823':{model:'NT300E5R-KD3A',sn:'OUMN91JJC00115M'},'50601-00863':{model:'NT300E5K-L26W',sn:'0QP191IU201075D'},'50601-00864':{model:'NT300E5K-L26W',sn:'0QP191IJ200766K'},'50601-00871':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00159Y'},'50601-00872':{model:'NT300E5R-KD3A',sn:'0UMN91CJC00017V'},'50601-00873':{model:'NT300E5X-AD2S',sn:'HxX391PD100015E'},'50601-00949':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00012H'},'50601-00950':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00319X'},'50601-00951':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00086Z'},'50601-00964':{model:'NT300E5K-L26W',sn:'0QP191GJ100332Z'},'50601-00965':{model:'NT300E5K-L26W',sn:'0QP191AJ101068A'},'50601-00966':{model:'NT550EAZ-AD2A',sn:'0WGE91AK800199N'},'50601-00967':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00042E'},'50601-00968':{model:'NT550EAZ-AD2A',sn:'0WGE91AK900074X'},'50601-00969':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00039D'},'50601-01533':{model:'DM501TGA',sn:'KYTK99YXA0000RZ'},'50601-01534':{model:'DM501TGA',sn:'KYTK99YXA0000BW'},'50601-01535':{model:'DM501TGA',sn:'KYTN99YX90003AH'},'50601-01536':{model:'DM501TGA',sn:'KYTN99YX900034K'},'50601-01537':{model:'NT551XED',sn:'67A29FCX100009Y'},'50601-01538':{model:'NT551XED',sn:'67A29FCX100008J'},'50601-01539':{model:'NT551XED',sn:'67A29FCX100025N'},'50601-01632':{model:'DM501TGA',sn:'L0MM99YY7000ABV'},'50601-01633':{model:'DM501TGA',sn:'L0MM99YY7000JRJ'},'50601-01634':{model:'DM501TGA',sn:'L0MM99YY7000A0X'},'50601-01635':{model:'DM501TGA',sn:'L0MM99YY7000CGF'},'50601-01636':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003P'},'50601-01637':{model:'NT751XGK-K03/C',sn:'KYPD99YY90005F'},'50601-01638':{model:'NT751XGK-K03/C',sn:'KYPD99YY900006'},'50601-01639':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003S'}};
const AUDIO={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
window.G={user:null,all:[],mode:'equip'};

window.doLogin=function(){
const id=document.getElementById('loginId').value.trim();
const name=document.getElementById('loginName').value.trim();
const pw=document.getElementById('loginPw').value.trim();
if(!id||!name||!pw){alert('모두 입력하세요');return}
window.G.user={id:id,name:name,team:'5팀'};
localStorage.setItem('equipUser',JSON.stringify(window.G.user));
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
document.getElementById('userInfo').textContent=window.G.user.name;
window.load();
};

window.doLogout=function(){window.G.user=null;localStorage.removeItem('equipUser');document.getElementById('mainScreen').style.display='none';document.getElementById('loginScreen').style.display='flex'};

window.load=async function(){
document.getElementById('status').innerText='로딩중...';
try{
const res=await fetch(API+'?action=generateAll');
const txt=await res.text();
const data=JSON.parse(txt);
if(data.equipment&&data.equipment.length>0){
window.G.all=data.equipment;
document.getElementById('status').innerText=window.G.all.length+'개 장비';
}else{
throw new Error('장비 없음');
}
}catch(e){
console.error(e);
document.getElementById('status').innerText='로딩 실패';
alert('로딩 실패: '+e.message);
window.G.all=[];
}
window.show();
};

function getLoc(loc){
if(!loc)return'미선택';
if(loc.includes('아산1'))return'아산1';
if(loc.includes('평택'))return'평택';
if(loc.includes('수원'))return'수원';
if(loc.includes('사무실'))return'사무실';
if(loc.includes('센터'))return'센터';
if(loc.includes('의공실'))return'의공실';
const m=loc.match(/([1-6])팀/);
return m?m[1]:'미선택';
}

window.setMode=function(m){
window.G.mode=m;
document.getElementById('tab-equip').classList.toggle('active',m==='equip');
document.getElementById('tab-location').classList.toggle('active',m==='location');
document.getElementById('tab-date').classList.toggle('active',m==='date');
window.show();
};

window.show=function(){
const b=document.getElementById('searchBox');
document.getElementById('results').innerHTML='';
if(window.G.mode==='equip'){
const cats=[...new Set(window.G.all.map(e=>e.category))];
const equipCounts={};
cats.forEach(c=>{equipCounts[c]=window.G.all.filter(r=>r.category===c).length});
b.innerHTML='<label>장비 선택 (총 '+window.G.all.length+'개)</label><select id="es" onchange="window.showEquipList()"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'">'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select>';
}else if(window.G.mode==='location'){
const locationCounts={};
LOCS.forEach(loc=>{locationCounts[loc]=window.G.all.filter(r=>getLoc(r.location)===loc).length});
b.innerHTML='<label>팀 선택</label><select id="ls" onchange="window.showLocationList()"><option value="">선택</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('')+'</select>';
}else{
b.innerHTML='<p>날짜별</p>';
}
};

window.showEquipList=function(){
const eq=document.getElementById('es').value;
if(!eq){document.getElementById('results').innerHTML='';return}
const found=window.G.all.filter(r=>r.category===eq);
if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}
let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAll(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAll(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.showBulkModal()">수령/반납</button></div>';
html+=found.map(r=>{
const loc=getLoc(r.location);
const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;
let info='';
if(r.category==='폐활량'&&LUNG[r.assetNo]){
info=' [모델: '+LUNG[r.assetNo].model+', S/N: '+LUNG[r.assetNo].sn+']';
}else if(r.category==='청력기'&&AUDIO[r.assetNo]){
info=' [헤드셋: '+AUDIO[r.assetNo]+']';
}
const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category}).replace(/'/g,'&apos;');
return '<div class="card"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div style="flex:1"><div class="card-title">'+locDisp+' / '+r.category+' / '+r.assetNo+info+'</div></div></div>';
}).join('');
document.getElementById('results').innerHTML=html;
};

window.showLocationList=function(){
const loc=document.getElementById('ls').value;
if(!loc){document.getElementById('results').innerHTML='';return}
const found=window.G.all.filter(r=>getLoc(r.location)===loc);
if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}
let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAll(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAll(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.sendEmail()">메일 보내기</button></div>';
html+=found.map(r=>{
const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;
let info='';
if(r.category==='폐활량'&&LUNG[r.assetNo]){
info=' [모델: '+LUNG[r.assetNo].model+', S/N: '+LUNG[r.assetNo].sn+']';
}else if(r.category==='청력기'&&AUDIO[r.assetNo]){
info=' [헤드셋: '+AUDIO[r.assetNo]+']';
}
const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category}).replace(/'/g,'&apos;');
return '<div class="card"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div style="flex:1"><div class="card-title">'+locDisp+' / '+r.category+' / '+r.assetNo+info+'</div></div></div>';
}).join('');
document.getElementById('results').innerHTML=html;
};

window.selectAll=function(checked){
document.querySelectorAll('.equipment-checkbox').forEach(cb=>cb.checked=checked);
};

window.sendEmail=function(){
const checked=document.querySelectorAll('.equipment-checkbox:checked');
if(checked.length===0){alert('장비를 선택하세요');return}
const userName=window.G.user.name;
const userEmail=EMAIL[userName];
if(!userEmail){alert('메일 주소 없음');return}
let equipList='';
checked.forEach(cb=>{
const data=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));
equipList+=data.category+' / '+data.assetNo+'\\n';
});
const subject=encodeURIComponent('[장비관리] '+userName+' 장비 목록');
const body=encodeURIComponent('안녕하세요,\\n\\n'+userName+'님의 장비 목록입니다:\\n\\n'+equipList);
window.location.href='mailto:'+userEmail+'?subject='+subject+'&body='+body;
};

window.showBulkModal=function(){
const checked=document.querySelectorAll('.equipment-checkbox:checked');
if(checked.length===0){alert('장비를 선택하세요');return}
document.getElementById('bulkTeam').value=window.G.user.team;
document.getElementById('bulkManager').value=window.G.user.name;
document.getElementById('returnGroup').classList.toggle('hidden',document.getElementById('bulkType').value!=='반납');
document.getElementById('bulkModal').classList.add('active');
};

window.closeModal=function(id){
document.getElementById(id).classList.remove('active');
};

window.submitBulk=async function(){
const checked=document.querySelectorAll('.equipment-checkbox:checked');
if(checked.length===0){alert('장비를 선택하세요');return}
const type=document.getElementById('bulkType').value;
const team=document.getElementById('bulkTeam').value;
const mgr=document.getElementById('bulkManager').value.trim();
const memo=document.getElementById('bulkMemo').value.trim();
const date=document.getElementById('bulkDate').value;
let reason='';
if(type==='반납'){
reason=document.getElementById('returnReason').value;
if(reason==='기타')reason=document.getElementById('customReason').value.trim();
if(!reason){alert('반납사유 입력');return}
}
if(!team||!mgr||!memo||!date){alert('모두 입력');return}
const entries=[];
checked.forEach(cb=>{
const data=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));
const prefix=type==='반납'?(team+' 반납 (반납사유-'+reason+'/'+mgr+' - '+memo+')'):(team+' '+type+' ('+mgr+' - '+memo+')');
entries.push({
category:data.category,
assetNo:data.assetNo,
newLocation:team+'('+date.replace(/-/g,'').substring(4)+')',
cellValue:prefix
});
});
try{
const url=API+'?action=update&data='+encodeURIComponent(JSON.stringify(entries));
await fetch(url);
alert('스프레드시트 업데이트 완료');
}catch(e){
alert('전송 완료');
}
window.closeModal('bulkModal');
};

window.showEdit=function(){
document.getElementById('editId').value=window.G.user.id;
document.getElementById('editName').value=window.G.user.name;
document.getElementById('editTeam').value=window.G.user.team;
document.getElementById('editModal').classList.add('active');
};

window.saveEdit=function(){
window.G.user.team=document.getElementById('editTeam').value;
localStorage.setItem('equipUser',JSON.stringify(window.G.user));
document.getElementById('userInfo').textContent=window.G.user.name;
alert('수정완료');
window.closeModal('editModal');
};

document.getElementById('bulkDate').valueAsDate=new Date();
document.getElementById('bulkType').addEventListener('change',function(){
document.getElementById('returnGroup').classList.toggle('hidden',this.value!=='반납');
});
document.getElementById('returnReason').addEventListener('change',function(){
document.getElementById('customGroup').classList.toggle('hidden',this.value!=='기타');
});
const saved=localStorage.getItem('equipUser');
if(saved){
window.G.user=JSON.parse(saved);
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
document.getElementById('userInfo').textContent=window.G.user.name;
window.load();
}
</script>
</body>
</html>
