<body>

<div class="loading" id="loading">처리 중...</div>

<div class="screen login-screen" id="loginScreen" style="display:flex">
<div class="login-box">
<h1>장비관리</h1>
<input type="text" id="loginId" placeholder="사번">
<input type="text" id="loginName" placeholder="이름">
<input type="password" id="loginPw" placeholder="비밀번호">
<button type="button" onclick="window.doLogin()">로그인</button>
<div class="version">v7.1</div>
</div>
</div>

<div class="screen main-screen" id="mainScreen" style="display:none">
<div class="header">
<h1 id="status">대기중</h1>
<div class="header-right">
<span id="userInfo"></span>
<button class="btn-edit" onclick="window.showEdit()">정보수정</button>
<button class="btn-logout" onclick="window.doLogout()">로그아웃</button>
</div>
</div>

<div class="tabs">
<div class="tab active" id="tab-equip" onclick="window.setMode('equip')">장비별</div>
<div class="tab" id="tab-location" onclick="window.setMode('location')">팀별</div>
<div class="tab" id="tab-date" onclick="window.setMode('date')">날짜별</div>
</div>

<div id="searchBox" class="box"></div>
<div id="results"></div>
<div class="footer">v7.1</div>
</div>

<div class="modal" id="bulkModal">
<div class="modal-content">
<div class="modal-header"><h2>수령/반납</h2><span class="modal-close" onclick="window.closeModal('bulkModal')">×</span></div>
<div class="form-group"><label>상태</label><select id="bulkType"><option value="수령">수령</option><option value="반납">반납</option><option value="수령예정">수령예정</option><option value="보유">보유</option></select></div>
<div class="form-group"><label>팀/위치</label><select id="bulkTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="form-group hidden" id="returnGroup"><label>반납사유</label><select id="returnReason"><option value="팀해체">팀해체</option><option value="장비점검">장비점검</option><option value="의공실">의공실</option><option value="기타">기타</option></select></div>
<div class="form-group hidden" id="customGroup"><label>사유입력</label><input type="text" id="customReason"></div>
<div class="form-group hidden" id="currentLocGroup"><label>현재 위치</label><select id="currentLoc"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="form-group"><label>관리자</label><input type="text" id="bulkManager"></div>
<div class="form-group"><label>특이사항</label><div class="radio-group"><label><input type="radio" name="memoType" value="없음" checked>특이사항 없음</label><label><input type="radio" name="memoType" value="있음">특이사항 있음</label></div><textarea id="bulkMemo" class="hidden" placeholder="특이사항을 입력하세요"></textarea></div>
<div class="form-group"><label>날짜</label><input type="date" id="bulkDate"></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.submitBulk()">등록</button><button class="btn-secondary" onclick="window.closeModal('bulkModal')">취소</button></div>
</div>
</div>

<div class="modal" id="editModal">
<div class="modal-content">
<div class="modal-header"><h2>정보수정</h2><span class="modal-close" onclick="window.closeModal('editModal')">×</span></div>
<div class="form-group"><label>사번</label><input type="text" id="editId" disabled></div>
<div class="form-group"><label>이름</label><input type="text" id="editName" disabled></div>
<div class="form-group"><label>팀</label><select id="editTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.saveEdit()">저장</button><button class="btn-secondary" onclick="window.closeModal('editModal')">취소</button></div>
</div>
</div>

<script>
const VERSION='7.1';
const API='https://script.google.com/macros/s/AKfycbwCjPAGh15ByTlOapraFz534GIQIrtPfbBKSTVmKLxqt6uEnUtTmTnXI53P7mT-kxBA/exec';
const LOCS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터','미선택'];
const EMAILS=['hy0617.jo@samsung.com','subeen2319.baek@samsung.com','sm0316.moon@samsung.com','bohyeon6601.kim@samsung.com','jm0605.kim@samsung.com','heejin3579.ko@samsung.com','joanna0812.lee@samsung.com','suingss0120.shin@samsung.com','seonghyeon402.kim@samsung.com','sj0206.ahn@samsung.com'];
const LUNG={'50601-00770':{model:'NT300E5K-K34S',sn:'0N8V91IHB00202E'},'50601-00771':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00009R'},'50601-00772':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00410Y'},'50601-00773':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00281R'},'50601-00774':{model:'NT300E5K-L26W',sn:'0QP191IU100958E'},'50601-00775':{model:'NT300E5X-AD2S',sn:'HxX391RD100005B'},'50601-00776':{model:'NT300E5C-A39S',sn:'JkMM91DF300107K'},'50601-00822':{model:'NT300E5K-K34S',sn:'0N8V91IHB00226K'},'50601-00823':{model:'NT300E5R-KD3A',sn:'OUMN91JJC00115M'},'50601-00863':{model:'NT300E5K-L26W',sn:'0QP191IU201075D'},'50601-00864':{model:'NT300E5K-L26W',sn:'0QP191IJ200766K'},'50601-00871':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00159Y'},'50601-00872':{model:'NT300E5R-KD3A',sn:'0UMN91CJC00017V'},'50601-00873':{model:'NT300E5X-AD2S',sn:'HxX391PD100015E'},'50601-00949':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00012H'},'50601-00950':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00319X'},'50601-00951':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00086Z'},'50601-00964':{model:'NT300E5K-L26W',sn:'0QP191GJ100332Z'},'50601-00965':{model:'NT300E5K-L26W',sn:'0QP191AJ101068A'},'50601-00966':{model:'NT550EAZ-AD2A',sn:'0WGE91AK800199N'},'50601-00967':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00042E'},'50601-00968':{model:'NT550EAZ-AD2A',sn:'0WGE91AK900074X'},'50601-00969':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00039D'},'50601-01533':{model:'DM501TGA',sn:'KYTK99YXA0000RZ'},'50601-01534':{model:'DM501TGA',sn:'KYTK99YXA0000BW'},'50601-01535':{model:'DM501TGA',sn:'KYTN99YX90003AH'},'50601-01536':{model:'DM501TGA',sn:'KYTN99YX900034K'},'50601-01537':{model:'NT551XED',sn:'67A29FCX100009Y'},'50601-01538':{model:'NT551XED',sn:'67A29FCX100008J'},'50601-01539':{model:'NT551XED',sn:'67A29FCX100025N'},'50601-01632':{model:'DM501TGA',sn:'L0MM99YY7000ABV'},'50601-01633':{model:'DM501TGA',sn:'L0MM99YY7000JRJ'},'50601-01634':{model:'DM501TGA',sn:'L0MM99YY7000A0X'},'50601-01635':{model:'DM501TGA',sn:'L0MM99YY7000CGF'},'50601-01636':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003P'},'50601-01637':{model:'NT751XGK-K03/C',sn:'KYPD99YY90005F'},'50601-01638':{model:'NT751XGK-K03/C',sn:'KYPD99YY900006'},'50601-01639':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003S'}};
const AUDIO={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
const COLORS={'청력기':'#667eea','청력부스':'#764ba2','중이기기':'#f093fb','소음계':'#4facfe','원심분리기':'#00f2fe','HRV':'#43e97b','EKG':'#fa709a','폐활량':'#fee140','실린지':'#30cfd0','프린터기':'#a8edea','업무용노트북':'#ff9a9e','와이브로':'#fad0c4','포터블모니터':'#ffecd2'};
window.G={user:null,all:[],mode:'equip',currentCat:'',currentLoc:''};

function showLoading(show){document.getElementById('loading').classList.toggle('active',show)}
window.doLogin=function(){const id=document.getElementById('loginId').value.trim();const name=document.getElementById('loginName').value.trim();const pw=document.getElementById('loginPw').value.trim();if(!id||!name||!pw){alert('모두 입력하세요');return}window.G.user={id:id,name:name,team:'5팀'};localStorage.setItem('equipUser',JSON.stringify(window.G.user));document.getElementById('loginScreen').style.display='none';document.getElementById('mainScreen').style.display='block';document.getElementById('userInfo').textContent=window.G.user.name;window.load()};
window.doLogout=function(){window.G.user=null;localStorage.removeItem('equipUser');document.getElementById('mainScreen').style.display='none';document.getElementById('loginScreen').style.display='flex'};
window.load=async function(){document.getElementById('status').innerText='로딩중...';showLoading(true);try{const res=await fetch(API+'?action=generateAll');const txt=await res.text();const data=JSON.parse(txt);if(data.equipment){window.G.all=data.equipment;document.getElementById('status').innerText=window.G.all.length+'개 장비'}}catch(e){console.error(e);document.getElementById('status').innerText='로딩 실패'}showLoading(false);window.show()};
function parseDate(loc){const m=loc.match(/\((\d{2})\/(\d{2})\)/);if(m)return m[1]+'/'+m[2];return''}
function getLoc(loc){if(!loc)return'미선택';if(loc.includes('아산1'))return'아산1';if(loc.includes('평택'))return'평택';if(loc.includes('수원'))return'수원';if(loc.includes('사무실'))return'사무실';if(loc.includes('센터'))return'센터';if(loc.includes('의공실'))return'의공실';const m=loc.match(/([1-6])팀/);return m?m[1]:'미선택'}
window.setMode=function(m){window.G.mode=m;document.getElementById('tab-equip').classList.toggle('active',m==='equip');document.getElementById('tab-location').classList.toggle('active',m==='location');document.getElementById('tab-date').classList.toggle('active',m==='date');window.show()};
window.show=function(){const b=document.getElementById('searchBox');document.getElementById('results').innerHTML='';if(window.G.mode==='equip'){const cats=[...new Set(window.G.all.map(e=>e.category))];const equipCounts={};cats.forEach(c=>{equipCounts[c]=window.G.all.filter(r=>r.category===c).length});b.innerHTML='<label>장비 선택 (총 '+window.G.all.length+'개)</label><select id="es" onchange="window.showEquipList()"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'" '+(e===window.G.currentCat?'selected':'')+'>'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select>';if(window.G.currentCat)window.showEquipList()}else if(window.G.mode==='location'){const locationCounts={};LOCS.forEach(loc=>{locationCounts[loc]=window.G.all.filter(r=>getLoc(r.location)===loc).length});b.innerHTML='<label>팀 선택</label><select id="ls" onchange="window.showLocationList()"><option value="">선택</option>'+LOCS.map(l=>'<option value="'+l+'" '+(l===window.G.currentLoc?'selected':'')+'>'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('')+'</select>';if(window.G.currentLoc)window.showLocationList()}else{window.showCalendar()}};
window.showCalendar=function(){const now=new Date();const year=now.getFullYear();const month=now.getMonth();const firstDay=new Date(year,month,1).getDay();const lastDate=new Date(year,month+1,0).getDate();const dateMap={};window.G.all.forEach(r=>{if(!r.memo||!r.memo.trim())return;if(r.memo.includes('특이사항없음')||r.memo.includes('이상없음')||r.memo.includes('특이사항 없음'))return;const dateStr=parseDate(r.location);if(dateStr){if(!dateMap[dateStr])dateMap[dateStr]=[];dateMap[dateStr].push(r)}});let cal='<div class="cal-header">'+year+'년 '+(month+1)+'월</div><div class="calendar">';const days=['일','월','화','수','목','금','토'];days.forEach(d=>cal+='<div class="cal-day" style="font-weight:bold;background:#f0f0f0">'+d+'</div>');for(let i=0;i<firstDay;i++)cal+='<div class="cal-day"></div>';for(let d=1;d<=lastDate;d++){const mm=String(month+1).padStart(2,'0');const dd=String(d).padStart(2,'0');const key=mm+'/'+dd;const hasNote=dateMap[key]&&dateMap[key].length>0;const cls=hasNote?'cal-day has-note':'cal-day';const onclick=hasNote?'onclick="window.showDateDetail(\''+key+'\')"':'';cal+='<div class="'+cls+'" '+onclick+'>'+d+'</div>'}cal+='</div>';document.getElementById('searchBox').innerHTML=cal};
window.showDateDetail=function(dateKey){const items=window.G.all.filter(r=>{const d=parseDate(r.location);if(d!==dateKey)return false;if(!r.memo||!r.memo.trim())return false;if(r.memo.includes('특이사항없음')||r.memo.includes('이상없음')||r.memo.includes('특이사항 없음'))return false;return true});if(items.length===0)return;let html='<div style="padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:15px;font-weight:bold">'+dateKey+' 특이사항</div>';items.forEach(r=>{const loc=getLoc(r.location);const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;const color=COLORS[r.category]||'#667eea';let title=locDisp+' 보유 / '+r.category+'('+dateKey+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N: '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}html+='<div class="card" style="border-left:8px solid '+color+'"><div class="card-main"><div style="flex:1"><div class="card-title">'+title+'</div></div></div><div class="card-divider">특이사항: '+r.memo+'</div></div>'});document.getElementById('results').innerHTML=html};
window.showEquipList=function(){const eq=document.getElementById('es').value;window.G.currentCat=eq;if(!eq){document.getElementById('results').innerHTML='';return}const found=window.G.all.filter(r=>r.category===eq);if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}const color=COLORS[eq]||'#667eea';let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAll(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAll(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.showBulkModal()">수령/반납</button></div>';html+=found.map(r=>{const loc=getLoc(r.location);const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;const dateStr=parseDate(r.location);let title=locDisp+' 보유 / '+r.category+'('+dateStr+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N: '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category}).replace(/'/g,'&apos;');const hasMemo=r.memo&&r.memo.trim()&&!r.memo.includes('특이사항없음')&&!r.memo.includes('이상없음')&&!r.memo.includes('특이사항 없음');const memoDisp=hasMemo?'<div class="card-divider">특이사항: '+r.memo+'</div>':'<div class="card-divider">특이사항 없음</div>';return '<div class="card" style="border-left:8px solid '+color+'"><div class="card-main"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\'><div style="flex:1"><div class="card-title">'+title+'</div></div></div>'+memoDisp+'</div>'}).join('');document.getElementById('results').innerHTML=html};
window.showLocationList=function(){const loc=document.getElementById('ls').value;window.G.currentLoc=loc;if(!loc){document.getElementById('results').innerHTML='';return}const found=window.G.all.filter(r=>getLoc(r.location)===loc);if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}let html='<div class="button-group"><div><button class="select-all-btn" onclick="window.selectAll(true)">✓ 전체선택</button><button class="select-all-btn" onclick="window.selectAll(false)">✗ 전체해제</button></div><button class="send-email-btn" onclick="window.sendEmail()">메일 보내기</button></div>';html+=found.map(r=>{const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;const dateStr=parseDate(r.location);const color=COLORS[r.category]||'#667eea';let title=locDisp+' 보유 / '+r.category+'('+dateStr+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N: '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category}).replace(/'/g,'&apos;');const hasMemo=r.memo&&r.memo.trim()&&!r.memo.includes('특이사항없음')&&!r.memo.includes('이상없음')&&!r.memo.includes('특이사항 없음');const memoDisp=hasMemo?'<div class="card-divider">특이사항: '+r.memo+'</div>':'<div class="card-divider">특이사항 없음</div>';return '<div class="card" style="border-left:8px solid '+color+'"><div class="card-main"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\'><div style="flex:1"><div class="card-title">'+title+'</div></div></div>'+memoDisp+'</div>'}).join('');document.getElementById('results').innerHTML=html};
window.selectAll=function(checked){document.querySelectorAll('.equipment-checkbox').forEach(cb=>cb.checked=checked)};
window.sendEmail=function(){const checked=document.querySelectorAll('.equipment-checkbox:checked');if(checked.length===0){alert('장비를 선택하세요');return}let list='';checked.forEach(cb=>{const data=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));list+=data.category+' / '+data.assetNo+'\\n'});const subj='[장비관리] 장비 목록';const msg='장비 목록:\\n\\n'+list;window.open('mailto:'+EMAILS.join(',')+('?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(msg)),'_self')};
window.showBulkModal=function(){const checked=document.querySelectorAll('.equipment-checkbox:checked');if(checked.length===0){alert('장비를 선택하세요');return}document.getElementById('bulkTeam').value=window.G.user.team;document.getElementById('bulkManager').value=window.G.user.name;document.getElementById('returnGroup').classList.add('hidden');document.getElementById('currentLocGroup').classList.add('hidden');document.getElementById('bulkModal').classList.add('active')};
window.closeModal=function(id){document.getElementById(id).classList.remove('active')};
window.submitBulk=async function(){const checked=document.querySelectorAll('.equipment-checkbox:checked');if(checked.length===0)return;const type=document.getElementById('bulkType').value;const team=document.getElementById('bulkTeam').value;const mgr=document.getElementById('bulkManager').value.trim();const memoType=document.querySelector('input[name="memoType"]:checked').value;const memo=memoType==='없음'?'특이사항 없음':document.getElementById('bulkMemo').value.trim();const date=document.getElementById('bulkDate').value;let reason='';let currentLoc='';if(type==='반납'){reason=document.getElementById('returnReason').value;if(reason==='기타'){const customReason=document.getElementById('customReason').value.trim();if(!customReason){alert('반납사유 입력');return}reason=customReason;currentLoc='사무실'}else if(reason==='의공실'){currentLoc='의공실'}else{currentLoc='사무실'}}else if(type==='수령예정'){currentLoc=document.getElementById('currentLoc').value}else{currentLoc=team}if(!team||!mgr||!memo||!date){alert('모두 입력');return}const d=new Date(date);const mm=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');const entries=[];checked.forEach(cb=>{const data=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));const prefix=type==='반납'?(team+' 반납 (반납사유-'+reason+'/'+mgr+' - '+memo+')'):(team+' '+type+' ('+mgr+' - '+memo+')');entries.push({category:data.category,assetNo:data.assetNo,newLocation:currentLoc+' ('+mm+'/'+dd+')',cellValue:prefix})});showLoading(true);window.closeModal('bulkModal');fetch(API+'?action=update&data='+encodeURIComponent(JSON.stringify(entries))).then(()=>window.load()).then(()=>alert('완료')).catch(()=>{window.load();alert('완료')})};
window.showEdit=function(){document.getElementById('editId').value=window.G.user.id;document.getElementById('editName').value=window.G.user.name;document.getElementById('editTeam').value=window.G.user.team;document.getElementById('editModal').classList.add('active')};
window.saveEdit=function(){window.G.user.team=document.getElementById('editTeam').value;localStorage.setItem('equipUser',JSON.stringify(window.G.user));document.getElementById('userInfo').textContent=window.G.user.name;alert('수정완료');window.closeModal('editModal')};
document.getElementById('bulkDate').valueAsDate=new Date();
document.getElementById('bulkType').addEventListener('change',function(){const val=this.value;document.getElementById('returnGroup').classList.toggle('hidden',val!=='반납');document.getElementById('currentLocGroup').classList.toggle('hidden',val!=='수령예정')});
document.getElementById('returnReason').addEventListener('change',function(){document.getElementById('customGroup').classList.toggle('hidden',this.value!=='기타')});
document.querySelectorAll('input[name="memoType"]').forEach(r=>r.addEventListener('change',function(){document.getElementById('bulkMemo').classList.toggle('hidden',this.value==='없음')}));
const saved=localStorage.getItem('equipUser');
if(saved){window.G.user=JSON.parse(saved);document.getElementById('loginScreen').style.display='none';document.getElementById('mainScreen').style.display='block';document.getElementById('userInfo').textContent=window.G.user.name;window.load()}
</script>
</body>
</html>
