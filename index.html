function $(id){return document.getElementById(id)}
function doLogin(){const id=$('loginId').value.trim();const pw=$('loginPw').value.trim();if(!id||!pw){alert('입력하세요');return}G.user={id:id,name:id,team:'1팀'};localStorage.setItem('equipUser',JSON.stringify(G.user));$('loginScreen').classList.remove('active');$('mainScreen').classList.add('active');$('userInfo').textContent=G.user.name;load()}
function goRegister(){$('loginScreen').classList.remove('active');$('registerScreen').classList.add('active')}
function goLogin(){$('registerScreen').classList.remove('active');$('loginScreen').classList.add('active')}
function doRegister(){const id=$('regId').value.trim();const name=$('regName').value.trim();const pw=$('regPw').value.trim();const conf=$('regPwConf').value.trim();const team=$('regTeam').value;if(!id||!name||!pw||!conf||!team){alert('모두 입력');return}if(pw!==conf){alert('비번 불일치');return}alert('가입신청 완료');goLogin()}
function doLogout(){G.user=null;localStorage.removeItem('equipUser');$('mainScreen').classList.remove('active');$('loginScreen').classList.add('active')}
function load(){G.all=[...EQ];G.filt=[...G.all];renderCat();renderList()}
function renderCat(){const c=$('categoryTabs');c.innerHTML='';const all=document.createElement('button');all.className='category-tab active';all.textContent='전체';all.onclick=()=>selectCat('');c.appendChild(all);CAT.forEach(ca=>{const cnt=G.all.filter(e=>e.category===ca).length;if(cnt>0){const btn=document.createElement('button');btn.className='category-tab';btn.textContent=ca+'('+cnt+')';btn.onclick=()=>selectCat(ca);c.appendChild(btn)}})}
function selectCat(c){G.cat=c;document.querySelectorAll('.category-tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');filter()}
function filter(){const s=$('searchInput').value.toLowerCase();G.filt=G.all.filter(i=>{const mc=!G.cat||i.category===G.cat;const ms=!s||i.name.toLowerCase().includes(s)||i.assetNo.toLowerCase().includes(s);return mc&&ms});renderList()}
function renderList(){const l=$('equipmentList');if(G.filt.length===0){l.innerHTML='<div style="text-align:center;padding:40px;color:#999">없음</div>';return}l.innerHTML=G.filt.map(i=>{let h='<div class="equipment-item">';h+='<input type="checkbox" class="equipment-checkbox" data-id="'+i.id+'" '+(G.sel.includes(i.id)?'checked':'')+' onchange="toggleSel('+i.id+')">';h+='<div class="equipment-name">'+i.name+'</div>';h+='<div class="equipment-info">자산: '+i.assetNo+'</div>';if(i.serial)h+='<div class="equipment-info">시리얼: '+i.serial+'</div>';if(i.notebookModel)h+='<div class="equipment-info">노트북: '+i.notebookModel+' ('+i.notebookSerial+')</div>';if(i.headsetModel)h+='<div class="equipment-info">헤드셋: '+i.headsetModel+' ('+i.headsetSerial+')</div>';h+='<span class="equipment-location">'+i.location+'</span>';h+='<button class="email-btn" onclick="emailSelected(['+i.id+'])">이메일</button>';h+='</div>';return h}).join('')}
function toggleSelectAll(){const checked=$('selectAllCheckbox').checked;if(checked){G.sel=G.filt.map(i=>i.id)}else{G.sel=[]}$('selectedCount').textContent=G.sel.length;$('actionBar').classList.toggle('active',G.sel.length>0);renderList()}
function toggleSel(id){const idx=G.sel.indexOf(id);if(idx>-1)G.sel.splice(idx,1);else G.sel.push(id);$('selectedCount').textContent=G.sel.length;$('actionBar').classList.toggle('active',G.sel.length>0);$('selectAllCheckbox').checked=G.sel.length===G.filt.length}
function switchView(v){if(v==='equipment'){$('equipmentView').classList.remove('hidden');$('teamView').classList.add('hidden');$('equipTab').classList.add('active');$('teamTab').classList.remove('active');$('navEquip').classList.add('active');$('navTeam').classList.remove('active')}else{$('equipmentView').classList.add('hidden');$('teamView').classList.remove('hidden');$('equipTab').classList.remove('active');$('teamTab').classList.add('active');$('navEquip').classList.remove('active');$('navTeam').classList.add('active');filterTeam()}}
function filterTeam(){const t=$('teamFilter').value;const tl=$('teamList');const data=t?G.all.filter(e=>e.location===t):G.all;if(data.length===0){tl.innerHTML='<div style="text-align:center;padding:40px;color:#999">없음</div>';return}tl.innerHTML=data.map(i=>'<div class="equipment-item"><div class="equipment-name">'+i.name+'</div><div class="equipment-info">자산: '+i.assetNo+'</div><span class="equipment-location">'+i.location+'</span></div>').join('')}
function showBulk(){if(G.sel.length===0){alert('선택없음');return}$('bulkTeam').value=G.user.team;$('bulkManager').value=G.user.name;$('bulkModal').classList.add('active')}
function toggleReturn(){const r=$('bulkType').value==='반납';$('returnGroup').classList.toggle('hidden',!r);if(!r)$('customGroup').classList.add('hidden')}
function toggleCustom(){const c=$('returnReason').value==='기타';$('customGroup').classList.toggle('hidden',!c)}
function closeModal(id){$(id).classList.remove('active')}
async function submitBulk(){if(G.sel.length===0){alert('선택없음');return}const type=$('bulkType').value;const team=$('bulkTeam').value;const mgr=$('bulkManager').value.trim();const memo=$('bulkMemo').value.trim();const date=$('bulkDate').value;let reason='';if(type==='반납'){reason=$('returnReason').value;if(reason==='기타')reason=$('customReason').value.trim();if(!reason){alert('반납사유 입력');return}}if(!team||!mgr||!memo||!date){alert('모두 입력');return}$('loading').classList.add('active');try{for(const id of G.sel){const eq=G.all.find(e=>e.id===id);if(!eq)continue;const url=API+'?equipment='+encodeURIComponent(eq.category)+'&assetNo='+encodeURIComponent(eq.assetNo)+'&team='+encodeURIComponent(team)+'&status='+encodeURIComponent(type)+'&manager='+encodeURIComponent(mgr)+'&memo='+encodeURIComponent(memo)+'&returnReason='+encodeURIComponent(reason)+'&date='+date;await fetch(url);const idx=G.all.findIndex(e=>e.id===id);if(idx>-1){if(type==='수령'||type==='보유'||type==='수령예정')G.all[idx].location=team;else if(type==='반납')G.all[idx].location='사무실'}}alert('등록완료');G.sel=[];$('selectedCount').textContent='0';$('selectAllCheckbox').checked=false;$('actionBar').classList.remove('active');closeModal('bulkModal');filter()}catch(e){alert('실패:'+e.message)}finally{$('loading').classList.remove('active')}}
function emailSelected(ids){if(!ids||ids.length===0){alert('선택없음');return}const items=ids.map(id=>G.all.find(e=>e.id===id)).filter(e=>e);let body='선택 장비 목록:\n\n';items.forEach(eq=>{body+='---\n';body+='장비명: '+eq.name+'\n';body+='자산번호: '+eq.assetNo+'\n';body+='시리얼: '+eq.serial+'\n';body+='카테고리: '+eq.category+'\n';body+='위치: '+eq.location+'\n';if(eq.notebookModel)body+='노트북: '+eq.notebookModel+' ('+eq.notebookSerial+')\n';if(eq.headsetModel)body+='헤드셋: '+eq.headsetModel+' ('+eq.headsetSerial+')\n';body+='\n'});$('emailBody').value=body;$('emailSubject').value='장비 정보 ('+items.length+'개)';$('emailModal').classList.add('active')}
function emailTeam(){const t=$('teamFilter').value;if(!t){alert('팀 선택');return}const items=G.all.filter(e=>e.location===t);if(items.length===0){alert('장비없음');return}let body=t+' 장비 목록:\n\n';items.forEach(eq=>{body+='---\n';body+='장비명: '+eq.name+'\n';body+='자산번호: '+eq.assetNo+'\n';body+='위치: '+eq.location+'\n';body+='\n'});$('emailBody').value=body;$('emailSubject').value=t+' 장비 목록';$('emailModal').classList.add('active')}
function sendEmail(){const from=$('emailFrom').value.trim();const to=$('emailTo').value.trim();const subj=$('emailSubject').value.trim();const body=$('emailBody').value.trim();if(!to||!subj||!body){alert('모두 입력');return}const mailto='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);window.location.href=mailto;closeModal('emailModal')}
function showEdit(){$('editId').value=G.user.id;$('editName').value=G.user.name;$('editTeam').value=G.user.team;$('editPw').value='';$('editModal').classList.add('active')}
function saveEdit(){G.user.team=$('editTeam').value;localStorage.setItem('equipUser',JSON.stringify(G.user));$('userInfo').textContent=G.user.name;alert('수정완료');closeModal('editModal')}
document.getElementById('bulkDate').valueAsDate=new Date();
const fromSel=$('emailFrom');const toSel=$('emailTo');Object.keys(EMAILS).forEach(name=>{const o1=document.createElement('option');o1.value=EMAILS[name];o1.textContent=name+' ('+EMAILS[name]+')';fromSel.appendChild(o1);const o2=document.createElement('option');o2.value=EMAILS[name];o2.textContent=name+' ('+EMAILS[name]+')';toSel.appendChild(o2)});
const saved=localStorage.getItem('equipUser');
if(saved){G.user=JSON.parse(saved);$('loginScreen').classList.remove('active');$('mainScreen').classList.add('active');$('userInfo').textContent=G.user.name;load()}
