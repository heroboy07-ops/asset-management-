<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>장비관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:10px}.header{background:#667eea;color:#fff;padding:15px;text-align:center;font-weight:bold;border-radius:10px;margin-bottom:10px;font-size:14px}.tabs{display:flex;gap:5px;margin-bottom:15px}.tab{flex:1;padding:12px;background:#fff;border:2px solid #ddd;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;font-size:13px}.tab.active{background:#667eea;color:#fff;border-color:#667eea}.box{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.box-title{font-weight:bold;margin-bottom:10px;font-size:14px;color:#333}select{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:10px}.btn-group{display:flex;gap:10px;margin-bottom:15px}.select-btn{flex:1;padding:12px;background:#0984e3;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}.select-btn.deselect{background:#6c757d}.send-btn{width:100%;padding:15px;background:#00b894;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-bottom:15px}.card-container{display:flex;align-items:flex-start;margin-bottom:10px}.equipment-checkbox{width:24px;height:24px;margin-right:10px;margin-top:15px;cursor:pointer;flex-shrink:0}.card{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);flex:1}.card-title{font-weight:bold;font-size:15px;color:#333;line-height:1.6;margin-bottom:10px}.card-divider{border-top:2px solid #e0e0e0;margin:10px 0;padding-top:10px}.card-memo{font-size:14px;color:#666}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5)}.modal-content{background:#fff;margin:10% auto;padding:30px;border-radius:12px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}.modal-close{float:right;font-size:28px;font-weight:bold;color:#aaa;cursor:pointer}.recipient-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#f8f9fa;border:2px solid #dfe6e9;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}.recipient-btn:hover{background:#667eea;color:#fff;border-color:#667eea}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 40px;border-radius:10px;z-index:9999;display:none}.loading.active{display:block}
</style>
</head>
<body>

<div class="loading" id="loading">처리 중...</div>

<div class="header" id="status">로딩 중...</div>
<div class="tabs">
<div class="tab active" id="tab-equip" onclick="setMode('equip')">장비별</div>
<div class="tab" id="tab-location" onclick="setMode('location')">팀별</div>
<div class="tab" id="tab-date" onclick="setMode('date')">날짜별</div>
</div>
<div id="searchBox"></div>
<div id="results"></div>

<div id="emailModal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<span class="modal-close" onclick="closeModal()">&times;</span>
<div id="modalContent"></div>
</div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbwCjPAGh15ByTlOapraFz534GIQIrtPfbBKSTVmKLxqt6uEnUtTmTnXI53P7mT-kxBA/exec';
const MAIL_API='https://script.google.com/macros/s/AKfycbzNrE3s08iOZndyR7estzZOMw_vd5BHz6zqwd0ogki5m00C6dOxRiySD4VgIy2Io3AQ/exec';
const LOCS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터','미선택'];
const EMAILS={'조해영':'hy0617.jo@samsung.com','백수빈':'subeen2319.baek@samsung.com','문선미':'sm0316.moon@samsung.com','김보현':'bohyeon6601.kim@samsung.com','김정민':'jm0605.kim@samsung.com','고희진':'heejin3579.ko@samsung.com','이지연':'joanna0812.lee@samsung.com','신수인':'suingss0120.shin@samsung.com','김성현':'seonghyeon402.kim@samsung.com','안황코':'sj0206.ahn@samsung.com'};
const LUNG={'50601-00770':{model:'NT300E5K-K34S',sn:'0N8V91IHB00202E'},'50601-00771':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00009R'},'50601-00772':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00410Y'},'50601-00773':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00281R'},'50601-00774':{model:'NT300E5K-L26W',sn:'0QP191IU100958E'},'50601-00775':{model:'NT300E5X-AD2S',sn:'HxX391RD100005B'},'50601-00776':{model:'NT300E5C-A39S',sn:'JkMM91DF300107K'},'50601-00822':{model:'NT300E5K-K34S',sn:'0N8V91IHB00226K'},'50601-00823':{model:'NT300E5R-KD3A',sn:'OUMN91JJC00115M'},'50601-00863':{model:'NT300E5K-L26W',sn:'0QP191IU201075D'},'50601-00864':{model:'NT300E5K-L26W',sn:'0QP191IJ200766K'},'50601-00871':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00159Y'},'50601-00872':{model:'NT300E5R-KD3A',sn:'0UMN91CJC00017V'},'50601-00873':{model:'NT300E5X-AD2S',sn:'HxX391PD100015E'},'50601-00949':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00012H'},'50601-00950':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00319X'},'50601-00951':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00086Z'},'50601-00964':{model:'NT300E5K-L26W',sn:'0QP191GJ100332Z'},'50601-00965':{model:'NT300E5K-L26W',sn:'0QP191AJ101068A'},'50601-00966':{model:'NT550EAZ-AD2A',sn:'0WGE91AK800199N'},'50601-00967':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00042E'},'50601-00968':{model:'NT550EAZ-AD2A',sn:'0WGE91AK900074X'},'50601-00969':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00039D'},'50601-01533':{model:'DM501TGA',sn:'KYTK99YXA0000RZ'},'50601-01534':{model:'DM501TGA',sn:'KYTK99YXA0000BW'},'50601-01535':{model:'DM501TGA',sn:'KYTN99YX90003AH'},'50601-01536':{model:'DM501TGA',sn:'KYTN99YX900034K'},'50601-01537':{model:'NT551XED',sn:'67A29FCX100009Y'},'50601-01538':{model:'NT551XED',sn:'67A29FCX100008J'},'50601-01539':{model:'NT551XED',sn:'67A29FCX100025N'},'50601-01632':{model:'DM501TGA',sn:'L0MM99YY7000ABV'},'50601-01633':{model:'DM501TGA',sn:'L0MM99YY7000JRJ'},'50601-01634':{model:'DM501TGA',sn:'L0MM99YY7000A0X'},'50601-01635':{model:'DM501TGA',sn:'L0MM99YY7000CGF'},'50601-01636':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003P'},'50601-01637':{model:'NT751XGK-K03/C',sn:'KYPD99YY90005F'},'50601-01638':{model:'NT751XGK-K03/C',sn:'KYPD99YY900006'},'50601-01639':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003S'}};
const AUDIO={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
const COLORS={'청력기':'#667eea','청력부스':'#764ba2','중이기기':'#f093fb','소음계':'#4facfe','원심분리기':'#00f2fe','HRV':'#43e97b','EKG':'#fa709a','폐활량':'#fee140','실린지':'#30cfd0','프린터기':'#a8edea','업무용노트북':'#ff9a9e','와이브로':'#fad0c4','포터블모니터':'#ffecd2'};
let allData=[],mode='equip',currentCat='',currentLoc='',selectedSender=null;

function showLoading(s){document.getElementById('loading').classList.toggle('active',s)}
async function load(){showLoading(true);try{const res=await fetch(API+'?action=generateAll');const data=await res.json();if(data.equipment){allData=data.equipment;document.getElementById('status').innerText=allData.length+'개 장비'}}catch(e){console.error(e)}showLoading(false);show()}
function parseDate(loc){const m=loc.match(/\((\d{2})\/(\d{2})\)/);if(m)return m[1]+'/'+m[2];return''}
function getLoc(loc){if(!loc)return'미선택';if(loc.includes('아산1'))return'아산1';if(loc.includes('평택'))return'평택';if(loc.includes('수원'))return'수원';if(loc.includes('사무실'))return'사무실';if(loc.includes('센터'))return'센터';if(loc.includes('의공실'))return'의공실';const m=loc.match(/([1-6])팀/);return m?m[1]:'미선택'}
function setMode(m){mode=m;document.getElementById('tab-equip').classList.toggle('active',m==='equip');document.getElementById('tab-location').classList.toggle('active',m==='location');document.getElementById('tab-date').classList.toggle('active',m==='date');show()}
function show(){document.getElementById('searchBox').innerHTML='';document.getElementById('results').innerHTML='';if(mode==='equip'){const cats=[...new Set(allData.map(e=>e.category))];const equipCounts={};cats.forEach(c=>{equipCounts[c]=allData.filter(r=>r.category===c).length});document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title">장비 선택</div><select id="es" onchange="updateLocs()"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'">'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select></div><div id="locBox" style="display:none"><div class="box"><div class="box-title">장소 컬터</div><select id="ls" onchange="showEquipList()"><option value="">선택</option></select></div></div>'}else if(mode==='location'){const locationCounts={};LOCS.forEach(loc=>{locationCounts[loc]=allData.filter(r=>getLoc(r.location)===loc).length});document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title">장소 선택</div><select id="ls" onchange="showLocationList()"><option value="">선택</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('')+'</select></div>'}else{document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title">날짜별</div><p style="padding:20px;text-align:center">준비 중</p></div>'}}
function updateLocs(){const eq=document.getElementById('es').value;if(!eq){document.getElementById('locBox').style.display='none';document.getElementById('results').innerHTML='';return}currentCat=eq;const locationCounts={};LOCS.forEach(loc=>{locationCounts[loc]=allData.filter(r=>r.category===eq&&getLoc(r.location)===loc).length});document.getElementById('ls').innerHTML='<option value="">선택</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('');document.getElementById('locBox').style.display='block';document.getElementById('results').innerHTML=''}
function showEquipList(){const eq=document.getElementById('es').value;const loc=document.getElementById('ls').value;if(!eq||!loc){document.getElementById('results').innerHTML='';return}currentLoc=loc;const found=allData.filter(r=>r.category===eq&&getLoc(r.location)===loc);if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div><button class="send-btn" onclick="showEmailModal()">메일 보내기</button>';html+=found.map(r=>{const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;const dateStr=parseDate(r.location);let title=locDisp+' 보유 / '+r.category+'('+dateStr+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');const hasMemo=r.memo&&r.memo.trim()&&!r.memo.includes('특이사항없음')&&!r.memo.includes('이상없음')&&!r.memo.includes('특이사항 없음');const memoDisp=dateStr+' 김보현 - '+(hasMemo?r.memo:'특이사항 없음');return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div class="card"><div class="card-title">'+title+'</div><div class="card-divider"></div><div class="card-memo">'+memoDisp+'</div></div></div>'}).join('');document.getElementById('results').innerHTML=html}
function showLocationList(){const loc=document.getElementById('ls').value;if(!loc){document.getElementById('results').innerHTML='';return}currentLoc=loc;const found=allData.filter(r=>getLoc(r.location)===loc);if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div><button class="send-btn" onclick="showEmailModal()">메일 보내기</button>';html+=found.map(r=>{const locDisp=/^[1-6]$/.test(loc)?loc+'팀':loc;const dateStr=parseDate(r.location);let title=locDisp+' 보유 / '+r.category+'('+dateStr+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');const hasMemo=r.memo&&r.memo.trim()&&!r.memo.includes('특이사항없음')&&!r.memo.includes('이상없음')&&!r.memo.includes('특이사항 없음');const memoDisp=dateStr+' 김보현 - '+(hasMemo?r.memo:'특이사항 없음');return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' checked><div class="card"><div class="card-title">'+title+'</div><div class="card-divider"></div><div class="card-memo">'+memoDisp+'</div></div></div>'}).join('');document.getElementById('results').innerHTML=html}
function selectAll(c){document.querySelectorAll('.equipment-checkbox').forEach(cb=>cb.checked=c)}
function showEmailModal(){const checked=document.querySelectorAll('.equipment-checkbox:checked');if(checked.length===0){alert('장비를 선택하세요');return}selectedSender=null;const names=Object.keys(EMAILS);let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">보내는 사람 선택</div><div style="margin-bottom:15px;padding:10px;background:#f0f3ff;border-radius:8px;color:#0984e3;font-weight:bold">✓ '+checked.length+'개 장비 선택됨</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="selectSender(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html;document.getElementById('emailModal').style.display='block'}
function selectSender(senderName){selectedSender=senderName;const names=Object.keys(EMAILS);let html='<div style="margin-bottom:15px;padding:10px;background:#e8f5e9;border-radius:8px;color:#27ae60;font-weight:bold">📤 보내는 사람: '+selectedSender+'</div><div style="margin-bottom:20px;font-size:18px;font-weight:bold">받는 사람 선택</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="sendEmail(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html}
async function sendEmail(recipientName){const checked=document.querySelectorAll('.equipment-checkbox:checked');const selectedEquip=Array.from(checked).map(cb=>JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'")));if(!selectedSender||selectedEquip.length===0)return;document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:40px">📧</div><div style="margin-top:20px;font-size:18px;font-weight:bold">메일 전송 중...</div></div>';try{const numberedEquip=selectedEquip.map((item,index)=>({'순번':index+1,'기기명':item.name,'모델':item.model,'S/N':item.serial,'자산번호':item.assetNo}));const ws=XLSX.utils.json_to_sheet(numberedEquip);ws['!cols']=[{wch:8},{wch:35},{wch:18},{wch:20},{wch:20}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'장비목록');const wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});const fileName='장비목록_'+selectedEquip.length+'개_'+new Date().toISOString().slice(0,10)+'.xlsx';await fetch(MAIL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:EMAILS[recipientName],sender:EMAILS[selectedSender],senderName:selectedSender,locationName:currentLoc||currentCat||'장비',excelBase64:wbout,fileName:fileName})});document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">📨</div><div style="margin-top:20px;font-size:18px;font-weight:bold;color:#00b894">메일 전송 완료!</div><div style="margin-top:10px;color:#636e72">'+selectedSender+' → '+recipientName+'<br>'+selectedEquip.length+'개 장비</div><button class="recipient-btn" onclick="closeModal()" style="margin-top:20px">닫기</button></div>'}catch(e){document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">❌</div><div style="margin-top:20px;font-size:18px;font-weight:bold;color:#d63031">전송 실패</div><button class="recipient-btn" onclick="closeModal()" style="margin-top:20px">닫기</button></div>'}}
function closeModal(){selectedSender=null;document.getElementById('emailModal').style.display='none'}
window.onload=function(){load()};
</script>
</body>
</html>
