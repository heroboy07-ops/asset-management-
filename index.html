<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장비 관리 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover {
            background: #5568d3;
        }
        .main-container {
            display: none;
            background: white;
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }
        .header h1 {
            color: #667eea;
        }
        .logout-btn {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .controls select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .controls button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 로그인 화면 -->
    <div class="login-container" id="loginContainer">
        <h1>장비 관리 시스템</h1>
        <input type="text" id="username" placeholder="사용자명" />
        <input type="password" id="password" placeholder="비밀번호" />
        <button id="loginBtn">로그인</button>
    </div>

    <!-- 메인 화면 -->
    <div class="main-container" id="mainContainer">
        <div class="header">
            <h1>장비 관리 시스템</h1>
            <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>총 장비</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>청력기</h3>
                <div class="number" id="audioCount">0</div>
            </div>
            <div class="stat-card">
                <h3>폐활량</h3>
                <div class="number" id="spiroCount">0</div>
            </div>
            <div class="stat-card">
                <h3>기타</h3>
                <div class="number" id="otherCount">0</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="검색 (이름, 자산번호, 시리얼)" />
            <select id="categoryFilter">
                <option value="">전체 카테고리</option>
                <option value="청력기">청력기</option>
                <option value="폐활량">폐활량</option>
                <option value="실린지">실린지</option>
                <option value="프린터기">프린터기</option>
                <option value="업무용노트북">업무용노트북</option>
                <option value="포터블모니터">포터블모니터</option>
                <option value="와이브로">와이브로</option>
            </select>
            <select id="locationFilter">
                <option value="">전체 위치</option>
                <option value="1팀">1팀</option>
                <option value="2팀">2팀</option>
                <option value="3팀">3팀</option>
                <option value="4팀">4팀</option>
                <option value="5팀">5팀</option>
                <option value="6팀">6팀</option>
                <option value="사무실">사무실</option>
                <option value="미지정">미지정</option>
            </select>
            <button id="exportBtn">엑셀 다운로드</button>
        </div>

        <div class="table-container">
            <table id="equipmentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>장비명</th>
                        <th>자산번호</th>
                        <th>시리얼</th>

                        <th>추가정보</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

let currentUser = null;
let filteredData = [...equipmentData];

// 로그인 처리
document.getElementById('loginBtn').addEventListener('click', function() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (username && password) {
        currentUser = username;
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
        renderTable();
        updateStats();
    } else {
        alert('사용자명과 비밀번호를 입력하세요.');
    }
});

// Enter 키로 로그인
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        document.getElementById('loginBtn').click();
    }
});

// 로그아웃 처리
document.getElementById('logoutBtn').addEventListener('click', function() {
    currentUser = null;
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('mainContainer').style.display = 'none';
    document.getElementById('loginContainer').style.display = 'flex';
});

// 테이블 렌더링
function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    filteredData.forEach(item => {
        const row = tbody.insertRow();
        row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.assetNo}</td>
            <td>${item.serial}</td>
            <td>${item.category}</td>
            <td>${item.location}</td>
            <td>${getAdditionalInfo(item)}</td>
        `;
    });
}

// 추가 정보 표시
function getAdditionalInfo(item) {
    if (item.headsetModel) {
        return `헤드셋: ${item.headsetModel} (${item.headsetSerial})`;
    }
    if (item.notebookModel) {
        return `노트북: ${item.notebookModel} (${item.notebookSerial})`;
    }
    return '-';
}

// 통계 업데이트
function updateStats() {
    document.getElementById('totalCount').textContent = equipmentData.length;
    document.getElementById('audioCount').textContent = equipmentData.filter(e => e.category === '청력기').length;
    document.getElementById('spiroCount').textContent = equipmentData.filter(e => e.category === '폐활량').length;
    const others = equipmentData.length - 
        equipmentData.filter(e => e.category === '청력기').length - 
        equipmentData.filter(e => e.category === '폐활량').length;
    document.getElementById('otherCount').textContent = others;
}

// 검색 기능
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('categoryFilter').addEventListener('change', applyFilters);
document.getElementById('locationFilter').addEventListener('change', applyFilters);

function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const location = document.getElementById('locationFilter').value;
    
    filteredData = equipmentData.filter(item => {
        const matchSearch = !searchTerm || 
            item.name.toLowerCase().includes(searchTerm) ||
            item.assetNo.toLowerCase().includes(searchTerm) ||
            item.serial.toLowerCase().includes(searchTerm);
        
        const matchCategory = !category || item.category === category;
        const matchLocation = !location || item.location === location;
        
        return matchSearch && matchCategory && matchLocation;
    });
    
    renderTable();
}

// 엑셀 다운로드
document.getElementById('exportBtn').addEventListener('click', function() {
    let csv = 'ID,장비명,자산번호,시리얼,카테고리,위치,추가정보\n';
    
    filteredData.forEach(item => {
        csv += `${item.id},"${item.name}","${item.assetNo}","${item.serial}","${item.category}","${item.location}","${getAdditionalInfo(item)}"\n`;
    });
    
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = '장비목록.csv';
    link.click();
});
