float:right;font-size:28px;font-weight:bold;color:#aaa;cursor:pointer}.recipient-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#f8f9fa;border:2px solid #dfe6e9;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}.recipient-btn:hover{background:#667eea;color:#fff;border-color:#667eea}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 40px;border-radius:10px;z-index:9999;display:none}.loading.active{display:block}.calendar{display:grid;grid-template-columns:repeat(7,1fr);background:#eee;gap:1px;border:1px solid #ddd;border-radius:8px;overflow:hidden}.cal-header{padding:10px;text-align:center;font-weight:bold;background:#f8f9fa;font-size:12px}.cal-day{height:80px;background:#fff;padding:5px;text-align:left;font-size:14px;cursor:pointer;position:relative}.cal-day.issue{background:#fff0f0}.cal-day.issue::after{content:'⚠️';position:absolute;bottom:5px;right:5px;font-size:12px;color:#d63031}.cal-day.selected{background:#667eea!important;color:#fff!important}.month-nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.month-nav button{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}.selected-preview{background:#f0f3ff;padding:15px;border-radius:8px;margin-bottom:15px;border:2px solid #667eea}.preview-title{font-weight:bold;color:#667eea;margin-bottom:10px;font-size:14px}.preview-item{background:#fff;padding:10px;margin-bottom:5px;border-radius:5px;font-size:13px;display:flex;justify-content:space-between;align-items:center}.preview-remove{color:#d63031;cursor:pointer;font-weight:bold;padding:5px 10px}.preview-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}.action-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}.action-btn:hover{background:#5568d3}.action-btn-small{padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px}.action-btn-small:hover{background:#5568d3}.radio-group{margin:15px 0}.radio-label{display:flex;align-items:center;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px;cursor:pointer}.radio-label input{width:auto;margin-right:10px}

<script>

const LUNG={'50601-00770':{model:'NT300E5K-K34S',sn:'0N8V91IHB00202E'},'50601-00771':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00009R'},'50601-00772':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00410Y'},'50601-00773':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00281R'},'50601-00774':{model:'NT300E5K-L26W',sn:'0QP191IU100958E'},'50601-00775':{model:'NT300E5X-AD2S',sn:'HxX391RD100005B'},'50601-00776':{model:'NT300E5C-A39S',sn:'JkMM91DF300107K'},'50601-00822':{model:'NT300E5K-K34S',sn:'0N8V91IHB00226K'},'50601-00823':{model:'NT300E5R-KD3A',sn:'0UMN91JJC00115M'},'50601-00863':{model:'NT300E5K-L26W',sn:'0QP191IU201075D'},'50601-00864':{model:'NT300E5K-L26W',sn:'0QP191IJ200766K'},'50601-00871':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00159Y'},'50601-00872':{model:'NT300E5R-KD3A',sn:'0UMN91CJC00017V'},'50601-00873':{model:'NT300E5X-AD2S',sn:'HxX391PD100015E'},'50601-00949':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00012H'},'50601-00950':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00319X'},'50601-00951':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00086Z'},'50601-00964':{model:'NT300E5K-L26W',sn:'0QP191GJ100332Z'},'50601-00965':{model:'NT300E5K-L26W',sn:'0QP191AJ101068A'},'50601-00966':{model:'NT550EAZ-AD2A',sn:'0WGE91AK800199N'},'50601-00967':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00042E'},'50601-00968':{model:'NT550EAZ-AD2A',sn:'0WGE91AK900074X'},'50601-00969':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00039D'},'50601-01533':{model:'DM501TGA',sn:'KYTK99YXA0000RZ'},'50601-01534':{model:'DM501TGA',sn:'KYTK99YXA0000BW'},'50601-01535':{model:'DM501TGA',sn:'KYTN99YX90003AH'},'50601-01536':{model:'DM501TGA',sn:'KYTN99YX900034K'},'50601-01537':{model:'NT551XED',sn:'67A29FCX100009Y'},'50601-01538':{model:'NT551XED',sn:'67A29FCX100008J'},'50601-01539':{model:'NT551XED',sn:'67A29FCX100025N'},'50601-01632':{model:'DM501TGA',sn:'L0MM99YY7000ABV'},'50601-01633':{model:'DM501TGA',sn:'L0MM99YY7000JRJ'},'50601-01634':{model:'DM501TGA',sn:'L0MM99YY7000A0X'},'50601-01635':{model:'DM501TGA',sn:'L0MM99YY7000CGF'},'50601-01636':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003P'},'50601-01637':{model:'NT751XGK-K03/C',sn:'KYPD99YY90005F'},'50601-01638':{model:'NT751XGK-K03/C',sn:'KYPD99YY900006'},'50601-01639':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003S'}};
const AUDIO={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
const COLORS={'청력기':'#667eea','청력부스':'#764ba2','중이기기':'#f093fb','소음계':'#4facfe','원심분리기':'#00f2fe','HRV':'#43e97b','EKG':'#fa709a','폐활량':'#fee140','실린지':'#30cfd0','프린터기':'#a8edea','업무용노트북':'#ff9a9e','와이브로':'#fad0c4','포터블모니터':'#ffecd2'};
const IGNORE_TEXT=["특이사항없음","특이사항 없음","이상없음","이상 없음"];
let allData=[],mode='equip',currentCat='',currentLoc='',selectedSender=null,currentYear=new Date().getFullYear(),currentMonth=new Date().getMonth()+1,selectedEquipments=new Map(),currentUser=null,dataCache=null,cacheTime=0;

function showRegScreen(){document.getElementById('loginScreen').style.display='none';document.getElementById('regScreen').style.display='block'}
function backToLogin(){document.getElementById('regScreen').style.display='none';document.getElementById('loginScreen').style.display='block'}
function doRegister(){const name=document.getElementById('regName').value;const empId=document.getElementById('regEmpId').value;const pass=document.getElementById('regPass').value;const team=document.getElementById('regTeam').value;if(!name||!empId||!pass||!team){alert('모든 항목을 입력하세요');return}const users=JSON.parse(localStorage.getItem('equipUsers')||'{}');users[empId]={name,empId,pass,team};localStorage.setItem('equipUsers',JSON.stringify(users));alert('가입 완료');backToLogin()}
function doLogin(){const empId=document.getElementById('loginEmpId').value;const pass=document.getElementById('loginPass').value;if(!empId||!pass){alert('사번과 비밀번호를 입력하세요');return}const users=JSON.parse(localStorage.getItem('equipUsers')||'{}');if(users[empId]&&users[empId].pass===pass){currentUser=users[empId];localStorage.setItem('currentLogin',JSON.stringify(currentUser));document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='block';const cache=localStorage.getItem('equipCache');if(cache){try{const parsed=JSON.parse(cache);const now=Date.now();if((now-parsed.time)<300000){allData=parsed.data;dataCache=parsed.data;cacheTime=parsed.time;document.getElementById('status').innerText=allData.length+'개 장비'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show();load(false);return}}catch(e){}}load(false)}else{alert('로그인 실패')}}
function logout(){if(confirm('로그아웃 하시겠습니까?')){localStorage.removeItem('currentLogin');currentUser=null;selectedEquipments.clear();document.getElementById('mainApp').style.display='none';document.getElementById('loginScreen').style.display='block';document.getElementById('loginEmpId').value='';document.getElementById('loginPass').value=''}}

function showLoading(s){document.getElementById('loading').classList.toggle('active',s)}
async function load(forceRefresh){const now=Date.now();if(!forceRefresh&&dataCache&&(now-cacheTime)<300000){allData=dataCache;document.getElementById('status').innerText=allData.length+'개 장비'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show();return}showLoading(true);try{const res=await fetch(API+'?action=generateAll&t='+now);const data=await res.json();if(data.equipment){allData=data.equipment;dataCache=data.equipment;cacheTime=now;localStorage.setItem('equipCache',JSON.stringify({data:allData,time:now}));document.getElementById('status').innerText=allData.length+'개 장비'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show()}}catch(e){const cache=localStorage.getItem('equipCache');if(cache){const parsed=JSON.parse(cache);allData=parsed.data;dataCache=parsed.data;document.getElementById('status').innerText=allData.length+'개 장비 (캐시)'+(currentUser?' ('+currentUser.name+' - '+currentUser.team+'팀)':'');show()}else{alert('로딩 실패: '+e.message)}}finally{showLoading(false)}}
function parseCurrentLocation(row){const val=row.location||'';if(!val||!val.trim())return{location:"미선택",date:null};const str=val.toString().trim();const dateMatch=str.match(/\((\d{1,2})\/(\d{1,2})\)/);const date=dateMatch?dateMatch[1].padStart(2,'0')+'/'+dateMatch[2].padStart(2,'0'):null;const cleanStr=str.replace(/\(.*?\)/g,'').trim();let location="미선택";if(cleanStr.includes('아산1'))location='아산1';else if(cleanStr.includes('평택'))location='평택';else if(cleanStr.includes('수원'))location='수원';else if(cleanStr.includes('사무실'))location='사무실';else if(cleanStr.includes('센터'))location='센터';else if(cleanStr.includes('의공실'))location='의공실';else{const match=cleanStr.match(/(?:^|[^\d])([1-6])(?:팀|[^\d]|$)/);if(match)location=match[1]}return{location,date}}
function isRealIssue(text){if(!text||!text.trim())return false;const clean=text.replace(/\s/g,"").toLowerCase();if(clean.match(/wt\d+/)||clean.match(/nt\d+/)||clean.match(/dm\d+/))return false;for(const ig of IGNORE_TEXT){const cleanIgnore=ig.replace(/\s/g,"").toLowerCase();if(clean===cleanIgnore||clean.includes(cleanIgnore))return false}return true}
function setMode(m){mode=m;document.getElementById('tab-equip').classList.toggle('active',m==='equip');document.getElementById('tab-location').classList.toggle('active',m==='location');document.getElementById('tab-date').classList.toggle('active',m==='date');show()}
function show(){document.getElementById('searchBox').innerHTML='';document.getElementById('results').innerHTML='';if(mode==='equip'){const cats=[...new Set(allData.map(e=>e.category))].filter(c=>c&&c.trim()!==''&&c.trim()!=='설문지응답시트1'&&!c.includes('설문지'));const equipCounts={};cats.forEach(c=>{equipCounts[c]=allData.filter(r=>r.category===c).length});document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title" id="equipTitle" style="background:#9b59b6">장비 선택</div><select id="es" onchange="updateLocs()"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'">'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select></div><div id="locBox" style="display:none"><div class="box"><div class="box-title" style="background:#e67e22">장소 필터</div><select id="ls" onchange="showEquipList()"><option value="">선택</option></select></div></div>'}else if(mode==='location'){const locationCounts={};LOCS.forEach(loc=>{locationCounts[loc]=allData.filter(r=>parseCurrentLocation(r).location===loc).length});document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title" style="background:#00b894">장소 선택</div><select id="ls" onchange="showLocationList()"><option value="">선택</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('')+'</select></div>'}else{const now=new Date();currentYear=now.getFullYear();currentMonth=now.getMonth()+1;showCalendar()}updatePreview()}
function updateLocs(){const eq=document.getElementById('es').value;if(!eq){document.getElementById('equipTitle').innerText='장비 선택';document.getElementById('locBox').style.display='none';document.getElementById('results').innerHTML='';return}currentCat=eq;const total=allData.filter(r=>r.category===eq).length;document.getElementById('equipTitle').innerText=eq+' ('+total+'개)';document.getElementById('equipTitle').style.background=COLORS[eq]||'#9b59b6';const locationCounts={};LOCS.forEach(loc=>{locationCounts[loc]=allData.filter(r=>r.category===eq&&parseCurrentLocation(r).location===loc).length});const totalAll=allData.filter(r=>r.category===eq).length;document.getElementById('ls').innerHTML='<option value="">선택</option><option value="전체">전체 ('+totalAll+'개)</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('');document.getElementById('locBox').style.display='block';document.getElementById('locBox').querySelector('.box-title').style.background='#e67e22';document.getElementById('results').innerHTML=''}
function showEquipList(){const eq=document.getElementById('es').value;const loc=document.getElementById('ls').value;if(!eq||!loc){document.getElementById('results').innerHTML='';return}currentLoc=loc;let found;if(loc==='전체'){found=allData.filter(r=>r.category===eq)}else{found=allData.filter(r=>r.category===eq&&parseCurrentLocation(r).location===loc)}if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div>';html+=found.map(r=>{const data=parseCurrentLocation(r);const locDisp=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;let title=locDisp+' 보유 / '+r.category+'('+(data.date||'')+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');let memoText=r.currentDetail||r.memo||'';const hasIssue=isRealIssue(memoText);let memoDisp='';if(memoText){const parts=memoText.split('/').map(p=>p.trim());const latestMemo=parts[parts.length-1];memoDisp=(data.date||'최근')+' '+locDisp+' 보유 ('+latestMemo+')'}else{memoDisp=(data.date||'최근')+' '+locDisp+' 보유 (특이사항 없음)'}const memoStyle=hasIssue?'color:#e74c3c;font-weight:bold':'color:#27ae60';const isChecked=selectedEquipments.has(r.assetNo)?'checked':'';const equipColor=COLORS[r.category]||'#00b894';return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' data-asset="'+r.assetNo+'" onchange="updateSelection()" '+isChecked+'><div class="card"><div class="card-title" style="color:'+equipColor+';border-left:4px solid '+equipColor+';padding-left:10px">'+title+'</div><div class="card-divider"></div><div class="card-memo" style="'+memoStyle+'">'+memoDisp+'</div></div></div>'}).join('');document.getElementById('results').innerHTML=html}
function showLocationList(){const loc=document.getElementById('ls').value;if(!loc){document.getElementById('results').innerHTML='';return}currentLoc=loc;const found=allData.filter(r=>parseCurrentLocation(r).location===loc);if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div>';html+=found.map(r=>{const data=parseCurrentLocation(r);const locDisp=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;let title=locDisp+' 보유 / '+r.category+'('+(data.date||'')+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');let memoText=r.currentDetail||r.memo||'';const hasIssue=isRealIssue(memoText);let memoDisp='';if(memoText){const parts=memoText.split('/').map(p=>p.trim());const latestMemo=parts[parts.length-1];memoDisp=(data.date||'최근')+' '+locDisp+' 보유 ('+latestMemo+')'}else{memoDisp=(data.date||'최근')+' '+locDisp+' 보유 (특이사항 없음)'}const memoStyle=hasIssue?'color:#e74c3c;font-weight:bold':'color:#27ae60';const isChecked=selectedEquipments.has(r.assetNo)?'checked':'';const equipColor=COLORS[r.category]||'#00b894';return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' data-asset="'+r.assetNo+'" onchange="updateSelection()" '+isChecked+'><div class="card"><div class="card-title" style="color:'+equipColor+';border-left:4px solid '+equipColor+';padding-left:10px">'+title+'</div><div class="card-divider"></div><div class="card-memo" style="'+memoStyle+'">'+memoDisp+'</div></div></div>'}).join('');document.getElementById('results').innerHTML=html}
function selectAll(c){document.querySelectorAll('.equipment-checkbox').forEach(cb=>{cb.checked=c});updateSelection()}
function updateSelection(){document.querySelectorAll('.equipment-checkbox').forEach(cb=>{const asset=cb.getAttribute('data-asset');const equipData=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));if(cb.checked){selectedEquipments.set(asset,equipData)}else{selectedEquipments.delete(asset)}});updatePreview()}
function updatePreview(){const prev=document.getElementById('selectedPreview');if(selectedEquipments.size===0){prev.innerHTML='';return}let html='<div class="selected-preview"><div class="preview-title">선택된 장비 ('+selectedEquipments.size+'개)</div>';selectedEquipments.forEach((item,asset)=>{html+='<div class="preview-item"><span>'+item.category+' - '+item.assetNo+'</span><span class="preview-remove" onclick="removeSelection(\''+asset+'\')">✕</span></div>'});html+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="action-btn-small" onclick="showEmailModal()">메일 보내기</button>';if(mode!=='location'){html+='<button class="action-btn-small" style="background:#27ae60" onclick="showActionModal()">수령/반납 처리</button>'}html+='</div></div>';prev.innerHTML=html}
function removeSelection(asset){selectedEquipments.delete(asset);const cb=document.querySelector('.equipment-checkbox[data-asset="'+asset+'"]');if(cb)cb.checked=false;updatePreview()}
function showActionModal(){if(selectedEquipments.size===0){alert('장비를 선택하세요');return}let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">작업 선택 ('+selectedEquipments.size+'개)</div>';html+='<button class="action-btn" onclick="selectAction(\'수령\')">수령</button>';html+='<button class="action-btn" onclick="selectAction(\'반납\')">반납</button>';html+='<button class="action-btn" onclick="selectAction(\'수령예정\')">수령예정</button>';html+='<button class="action-btn" onclick="selectAction(\'보유\')">보유</button>';document.getElementById('actionContent').innerHTML=html;document.getElementById('actionModal').style.display='block'}
function selectAction(action){let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">'+action+'</div>';html+='<label style="display:block;margin-bottom:5px;font-weight:bold">이름</label>';html+='<input type="text" id="actionName" value="'+(currentUser?currentUser.name:'')+'" readonly style="background:#f0f0f0;margin-bottom:10px">';html+='<label style="display:block;margin-bottom:5px;font-weight:bold">팀 선택 (변경 가능)</label>';html+='<select id="actionTeam"><option value="">팀 선택</option>'+LOCS.map(l=>'<option value="'+l+'" '+(currentUser&&currentUser.team===l?'selected':'')+'>'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';if(action==='반납'){html+='<select id="returnReason"><option value="">반납사유</option><option value="팀해체">팀해체</option><option value="장비점검">장비점검</option><option value="의공실">의공실</option><option value="기타">기타</option></select>';html+='<input type="text" id="returnReasonEtc" placeholder="기타 사유" style="display:none">';}if(action==='수령예정'){html+='<select id="destTeam"><option value="">목적지</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';}html+='<div class="radio-group"><label class="radio-label"><input type="radio" name="memo" value="없음" checked onchange="toggleMemo(false)"> 특이사항 없음</label><label class="radio-label"><input type="radio" name="memo" value="있음" onchange="toggleMemo(true)"> 특이사항 있음</label></div>';html+='<input type="text" id="memoText" placeholder="특이사항 입력" style="display:none">';html+='<button class="action-btn" onclick="submitAction(\''+action+'\')">등록</button>';document.getElementById('actionContent').innerHTML=html;if(action==='반납'){document.getElementById('returnReason').onchange=function(){document.getElementById('returnReasonEtc').style.display=this.value==='기타'?'block':'none'}}}
function toggleMemo(show){document.getElementById('memoText').style.display=show?'block':'none'}
function closeActionModal(){document.getElementById('actionModal').style.display='none'}
async function submitAction(action){const name=document.getElementById('actionName').value;const team=document.getElementById('actionTeam').value;if(!name||!team){alert('이름과 팀을 입력하세요');return}const hasMemo=document.querySelector('input[name="memo"]:checked').value==='있음';let memo='특이사항 없음';if(hasMemo){const memoInput=document.getElementById('memoText').value.trim();if(!memoInput){alert('특이사항을 입력하세요');return}memo=memoInput}let newLocation=team;const teamLabel=/^[1-6]$/.test(team)?team+'팀':team;let cellValue=teamLabel+' '+action+' ('+name+' - '+memo+')';if(action==='반납'){const reason=document.getElementById('returnReason').value;if(!reason){alert('반납사유를 선택하세요');return}const reasonText=reason==='기타'?document.getElementById('returnReasonEtc').value:reason;if(reason==='의공실'){newLocation='의공실'}else{newLocation='사무실'}cellValue=teamLabel+' 반납 (반납사유-'+reasonText+'/'+name+' - '+memo+')';}else if(action==='수령예정'){const dest=document.getElementById('destTeam').value;if(!dest){alert('목적지를 선택하세요');return}newLocation=dest;cellValue=teamLabel+' 수령예정 ('+name+' - '+memo+')';}else if(action==='보유'){cellValue=teamLabel+' 보유 ('+name+' - '+memo+')';}const locationLabel=/^[1-6]$/.test(newLocation)?newLocation+'팀':newLocation;const entries=Array.from(selectedEquipments.values()).map(e=>({category:e.category,assetNo:e.assetNo,newLocation:locationLabel+' ('+(new Date().getMonth()+1).toString().padStart(2,'0')+'/'+(new Date().getDate()).toString().padStart(2,'0')+')',cellValue:cellValue}));showLoading(true);try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'update',entries:entries})});const result=await res.json();if(result.success){alert('등록 완료');closeActionModal();selectedEquipments.clear();updatePreview();await load(true)}else{alert('등록 실패: '+result.error)}}catch(e){alert('등록 실패: '+e.message)}finally{showLoading(false)}}
function showEmailModal(){if(selectedEquipments.size===0){alert('장비를 선택하세요');return}selectedSender=null;const names=Object.keys(EMAILS);let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">보내는 사람 선택</div><div style="margin-bottom:15px;padding:10px;background:#f0f3ff;border-radius:8px;color:#0984e3;font-weight:bold">✓ '+selectedEquipments.size+'개 장비 선택됨</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="selectSender(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html;document.getElementById('emailModal').style.display='block'}
function selectSender(senderName){selectedSender=senderName;const names=Object.keys(EMAILS);let html='<div style="margin-bottom:15px;padding:10px;background:#e8f5e9;border-radius:8px;color:#27ae60;font-weight:bold">📤 보내는 사람: '+selectedSender+'</div><div style="margin-bottom:20px;font-size:18px;font-weight:bold">받는 사람 선택</div>';html+=names.map(name=>'<button class="recipient-btn" onclick="sendEmail(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');document.getElementById('modalContent').innerHTML=html}
async function sendEmail(recipientName){if(!selectedSender||selectedEquipments.size===0)return;document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:40px">📧</div><div style="margin-top:20px;font-size:18px;font-weight:bold">메일 전송 중...</div></div>';try{const selectedArray=Array.from(selectedEquipments.values());const numberedEquip=selectedArray.map((item,index)=>({'순번':index+1,'기기명':item.name,'모델':item.model,'S/N':item.serial,'자산번호':item.assetNo}));const ws=XLSX.utils.json_to_sheet(numberedEquip);ws['!cols']=[{wch:8},{wch:35},{wch:18},{wch:20},{wch:20}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'장비목록');const wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});const fileName='장비목록_'+selectedEquipments.size+'개_'+new Date().toISOString().slice(0,10)+'.xlsx';await fetch(MAIL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:EMAILS[recipientName],sender:EMAILS[selectedSender],senderName:selectedSender,locationName:currentLoc||currentCat||'장비',excelBase64:wbout,fileName:fileName})});document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">📨</div><div style="margin-top:20px;font-size:18px;font-weight:bold;color:#00b894">메일 전송 완료!</div><div style="margin-top:10px;color:#636e72">'+selectedSender+' → '+recipientName+'<br>'+selectedEquipments.size+'개 장비</div><button class="recipient-btn" onclick="closeModal()" style="margin-top:20px">닫기</button></div>'}catch(e){document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:60px">❌</div><div style="margin-top:20px;font-size:18px;font-weight:bold;color:#d63031">전송 실패</div><button class="recipient-btn" onclick="closeModal()" style="margin-top:20px">닫기</button></div>'}}
function closeModal(){selectedSender=null;document.getElementById('emailModal').style.display='none'}
function showCalendar(){const b=document.getElementById('searchBox');const dateEquipments={};allData.forEach(r=>{if(r.dateDetails){Object.entries(r.dateDetails).forEach(([date,detail])=>{if(detail&&detail.trim()!==''){const hasIssue=detail.indexOf('특이사항 없음')===-1&&detail.indexOf('특이사항없음')===-1&&detail.indexOf('이상없음')===-1&&detail.indexOf('이상 없음')===-1;if(hasIssue){if(!dateEquipments[date]){dateEquipments[date]=new Set()}dateEquipments[date].add(r.category)}}})}});const firstDay=new Date(currentYear,currentMonth-1,1).getDay();const lastDate=new Date(currentYear,currentMonth,0).getDate();let html='<div class="box"><div class="month-nav"><button onclick="moveMonth(-1)">◀</button><b>'+currentYear+'년 '+currentMonth+'월</b><button onclick="moveMonth(1)">▶</button></div><div class="calendar">';['일','월','화','수','목','금','토'].forEach(d=>{html+='<div class="cal-header">'+d+'</div>'});for(let i=0;i<firstDay;i++)html+='<div></div>';for(let d=1;d<=lastDate;d++){const dateStr=String(currentMonth).padStart(2,'0')+'/'+String(d).padStart(2,'0');const equipSet=dateEquipments[dateStr];const equipList=equipSet?Array.from(equipSet):[];const hasIssue=equipList.length>0;let dayContent=d;if(hasIssue){dayContent+='<div style="font-size:10px;margin-top:4px;line-height:1.3;">';equipList.forEach(eq=>{const color=COLORS[eq]||'#2d3436';dayContent+='<div style="color:'+color+';font-weight:bold">'+eq+'</div>'});dayContent+='</div>'}html+='<div class="cal-day'+(hasIssue?' issue':'')+'" onclick="selectDate(\''+dateStr+'\',this)">'+dayContent+'</div>'}html+='</div><div id="dateRes"></div></div>';b.innerHTML=html}
function moveMonth(direction){currentMonth+=direction;if(currentMonth>12){currentMonth=1;currentYear++}else if(currentMonth<1){currentMonth=12;currentYear--}showCalendar()}
function selectDate(dateStr,element){document.querySelectorAll('.cal-day').forEach(x=>x.classList.remove('selected'));element.classList.add('selected');const found=allData.filter(r=>{if(!r.dateDetails||!r.dateDetails[dateStr])return false;const detail=r.dateDetails[dateStr];return detail&&isRealIssue(detail)});if(found.length===0){document.getElementById('dateRes').innerHTML='<p style="padding:20px;text-align:center">특이사항 없음</p>';return}document.getElementById('dateRes').innerHTML='<div style="margin-top:15px">'+found.map(r=>{let detail=r.dateDetails[dateStr]||'';const parts=detail.split('/').map(p=>p.trim());detail=parts.join(' / ');const color=COLORS[r.category]||'#2d3436';return '<div class="card-container" style="display:block;border-left:5px solid '+color+'"><div class="card-title" style="color:'+color+';font-weight:bold">'+r.category+' ('+dateStr+') / '+r.assetNo+'</div><div class="card-divider"></div><div class="card-memo" style="color:#e74c3c;font-weight:bold">'+detail+'</div></div>'}).join('')+'</div>'}
window.onload=function(){const savedLogin=localStorage.getItem('currentLogin');if(savedLogin){try{currentUser=JSON.parse(savedLogin);document.getElementById('mainApp').style.display='block';const cache=localStorage.getItem('equipCache');if(cache){const parsed=JSON.parse(cache);const now=Date.now();if((now-parsed.time)<300000){allData=parsed.data;dataCache=parsed.data;cacheTime=parsed.time;document.getElementById('status').innerText=allData.length+'개 장비 ('+currentUser.name+' - '+currentUser.team+'팀)';show();load(false);return}}load(false)}catch(e){document.getElementById('loginScreen').style.display='block'}}else{document.getElementById('loginScreen').style.display='block'}};
