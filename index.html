<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>장비 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f0f2f7;max-width:720px;margin:0 auto;min-height:100vh}
#scLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f3460,#16213e)}
#scMain{display:none}
.lbox{background:#fff;border-radius:24px;padding:44px 32px 36px;width:calc(100% - 40px);max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.ltitle{text-align:center;margin-bottom:28px}
.ltitle h1{font-size:22px;font-weight:800;color:#0f3460}
.ltitle p{font-size:13px;color:#94a3b8;margin-top:6px}
.lerr{display:none;background:#fff0f0;color:#dc2626;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:16px;text-align:center;border:1px solid #fecaca}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:#f8fafc;transition:border .2s;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:#0f3460;background:#fff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.btn+.btn{margin-top:10px}
.btn-p{background:#0f3460;color:#fff}.btn-p:active{transform:scale(.98)}
.btn-o{background:transparent;color:#0f3460;border:2px solid #0f3460}
.hdr{background:#0f3460;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-title{font-size:17px;font-weight:800}
.hdr-r{display:flex;align-items:center;gap:5px}
.uinfo{font-size:11px;opacity:.8;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.selbar{background:#1e40af;color:#fff;padding:9px 16px;display:none;align-items:center;justify-content:space-between;position:sticky;top:50px;z-index:190}
.selbar.on{display:flex}
.sbtn{padding:7px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;position:sticky;top:50px;z-index:180}
.selbar.on~.tabs{top:88px}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:14px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.on{color:#0f3460;border-bottom-color:#0f3460}
/* 셀렉트 */
.nsel{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;font-weight:700;color:#1e293b;background:#f8fafc;outline:none;font-family:inherit}
.nsel:focus{border-color:#0f3460;background:#fff}
.nsel:disabled{opacity:.45;cursor:default}
/* 선택 패널 */
.sel-panel{display:none;background:#eff6ff;border-bottom:2px solid #bfdbfe;padding:8px 14px}
/* 담당자 */
.cbar{background:#fff;border-bottom:1px solid #f1f5f9;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbtn{padding:6px 13px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.c-call{background:#16a34a;color:#fff}.c-mail{background:#0f3460;color:#fff}
/* 검색 */
.sbar{padding:9px 12px;background:#fff;border-bottom:1px solid #f1f5f9}
.sbar input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit}
.sbar input:focus{border-color:#0f3460;background:#fff}
/* 카드 */
.elist{padding:8px 12px 100px}
.loading{text-align:center;padding:48px 20px;color:#94a3b8;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#0f3460;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:13px;padding:12px 13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid #0f3460;transition:transform .1s}
.card.sel{background:#eff6ff;border-left-color:#2563eb}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;margin-top:1px}
.card.sel .chk{background:#2563eb;border-color:#2563eb;color:#fff}
.ci{flex:1;min-width:0}
.cname{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:2px}
.casset{font-size:12px;color:#94a3b8;margin-bottom:2px}
.clast{font-size:12px;color:#475569;margin-top:2px}
.csub{font-size:12px;color:#1e3a5f;margin-top:2px;word-break:break-all}
.cright{flex-shrink:0}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-수령{background:#dbeafe;color:#1d4ed8}.b-반납{background:#fef9c3;color:#854d0e}
.b-보유{background:#dcfce7;color:#15803d}.b-수령예정{background:#ede9fe;color:#6d28d9}
/* 팀별 요약 */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;padding:12px}
.sc{background:#fff;border-radius:13px;padding:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid #0f3460;display:flex;align-items:center;justify-content:space-between;transition:transform .1s}
.sc:active{transform:scale(.97)}
.sc-n{font-size:13px;font-weight:700;color:#1e293b}
.sc-c{font-size:22px;font-weight:800}
.sc-u{font-size:11px;color:#94a3b8}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f0f2f7;border-bottom:1px solid #e2e8f0}
.stitle{font-size:14px;font-weight:800;color:#0f3460}
/* 오버레이 */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:26px 20px 36px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:17px;font-weight:800;color:#1e293b;margin-bottom:18px;padding-right:32px}
.mcls{position:absolute;top:18px;right:18px;background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;color:#64748b;line-height:30px;text-align:center}
.asec{margin-bottom:16px}
.asec>label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.rgrp{display:flex;flex-wrap:wrap;gap:7px}
.rbtn{padding:8px 14px;border:1.5px solid #e2e8f0;border-radius:9px;background:#f8fafc;font-size:13px;cursor:pointer;font-weight:600;color:#475569;font-family:inherit;transition:all .15s}
.rbtn.on{background:#0f3460;color:#fff;border-color:#0f3460}
.sellist{background:#f8fafc;border-radius:11px;padding:10px;margin-bottom:16px;max-height:90px;overflow-y:auto;border:1px solid #e2e8f0}
.selitem{font-size:12px;padding:3px 0;border-bottom:1px solid #f1f5f9;color:#475569}
.selitem:last-child{border:none}
.rc{background:#f0f7ff;border:1.5px solid #bfdbfe;border-radius:13px;padding:14px 16px;margin-bottom:10px}
.rc-head{font-size:14px;font-weight:800;color:#1e40af;line-height:1.5}
.rc-info{font-size:13px;color:#1e3a5f;margin:5px 0}
.rc-div{border:none;border-top:2px dashed #93c5fd;margin:8px 0}
.rc-bot{font-size:13px;color:#0f3460;font-weight:600}
/* 메일 */
.mail-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mrow:last-child{margin-bottom:0}
.mlabel{font-size:12px;font-weight:700;color:#64748b;min-width:64px;padding-top:2px;flex-shrink:0}
.mval{font-size:13px;color:#1e293b;flex:1;line-height:1.7}
.rb{padding:7px 13px;border:1.5px solid #e2e8f0;border-radius:9px;background:#f8fafc;font-size:12px;cursor:pointer;font-weight:600;color:#475569;font-family:inherit;transition:all .15s}
.rb.on{background:#0f3460;color:#fff;border-color:#0f3460}
/* 달력 */
.calnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #f1f5f9}
.calnav button{border:none;background:none;font-size:26px;cursor:pointer;color:#0f3460;line-height:1}
.caltitle{font-weight:800;font-size:15px;color:#0f3460}
/* 관리자 */
.pcard{background:#f8fafc;border-radius:11px;padding:13px;margin-bottom:9px;border:1px solid #e2e8f0}
.pn{font-weight:700;font-size:14px;margin-bottom:3px;color:#1e293b}
.pi{font-size:12px;color:#94a3b8;margin-bottom:9px}
.pbtns{display:flex;gap:7px}
.bs{padding:7px 14px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.bg{background:#16a34a;color:#fff}.br{background:#dc2626;color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:#1e293b;color:#fff;padding:11px 20px;border-radius:13px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="scLogin">
  <div class="lbox">
    <div class="ltitle"><h1>⚙️ 장비 관리</h1><p>사번과 비밀번호로 로그인</p></div>
    <div class="lerr" id="lerr"></div>
    <div class="fg"><label>사번</label><input type="text" id="lId" placeholder="사번 입력" autocomplete="off"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="lPw" placeholder="비밀번호 입력"></div>
    <button class="btn btn-p" id="btnLogin">로그인</button>
    <button class="btn btn-o" style="margin-top:10px" id="btnOpenReg">회원가입</button>
    <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:12px">첫 번째 가입자는 자동으로 관리자</p>
  </div>
</div>

<div id="scMain">
  <div class="hdr">
    <span class="hdr-title">장비 관리</span>
    <div class="hdr-r">
      <span class="uinfo" id="uinfo"></span>
      <button class="ibtn" id="btnEdit">수정</button>
      <button class="ibtn" id="btnAdmin" style="display:none">관리</button>
      <button class="ibtn" id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="selbar" id="selbar">
    <span id="selCount">0개 선택</span>
    <div style="display:flex;gap:7px">
      <button class="sbtn" style="background:#16a34a;color:#fff" id="btnProc">처리</button>
      <button class="sbtn" style="background:#0f3460;color:#fff" id="btnMail">메일</button>
      <button class="sbtn" style="background:#dc2626;color:#fff" id="btnCancelSel">취소</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-t="equip">장비별</div>
    <div class="tab" data-t="team">팀별</div>
    <div class="tab" data-t="date">날짜별</div>
  </div>

  <!-- 장비별 탭 -->
  <div id="tabEquip">
    <!-- 셀렉트 영역 -->
    <div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 14px">
      <div style="margin-bottom:11px">
        <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">장비 선택</div>
        <select id="catSelect" class="nsel">
          <option value="">장비 선택</option>
        </select>
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">장소 필터</div>
        <select id="locSelect" class="nsel" disabled>
          <option value="">장소 선택</option>
        </select>
      </div>
    </div>
    <!-- 담당자 -->
    <div class="cbar" id="catCbar" style="display:none"></div>
    <!-- 선택된 장비 패널 -->
    <div class="sel-panel" id="selPanel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px;font-weight:800;color:#1e40af">선택된 장비 <span id="selPanelCnt" style="background:#2563eb;color:#fff;padding:2px 8px;border-radius:20px">0</span></span>
        <span style="font-size:12px;color:#2563eb;cursor:pointer;font-weight:600" onclick="clrSel()">전체 해제</span>
      </div>
      <div id="selPanelList" style="display:flex;flex-wrap:wrap;gap:5px;max-height:72px;overflow-y:auto"></div>
    </div>
    <!-- 검색 -->
    <div class="sbar"><input type="text" id="srch" placeholder="자산번호, 기기명 검색..."></div>
    <div style="padding:5px 12px 2px;display:flex;align-items:center;justify-content:space-between">
      <span id="equipCountTxt" style="font-size:12px;color:#94a3b8"></span>
    </div>
    <div class="elist" id="equipList">
      <div class="loading" style="color:#94a3b8">장비를 선택하세요</div>
    </div>
  </div>

  <!-- 팀별 탭 -->
  <div id="tabTeam" style="display:none">
    <div id="teamSum">
      <div style="padding:12px 12px 4px;font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.3px">팀별 현황</div>
      <div class="sgrid" id="teamGrid"></div>
    </div>
    <div id="teamDet" style="display:none">
      <div class="shdr">
        <span class="stitle" id="teamTitle"></span>
        <span style="font-size:13px;color:#64748b;cursor:pointer;padding:5px 12px;background:#fff;border-radius:8px;border:1px solid #e2e8f0" id="btnTeamBack">← 목록</span>
      </div>
      <div class="elist" id="teamList"></div>
    </div>
  </div>

  <!-- 날짜별 탭 -->
  <div id="tabDate" style="display:none;padding-bottom:80px">
    <div class="calnav">
      <button id="btnCalPrev">&#8249;</button>
      <span class="caltitle" id="calTxt"></span>
      <button id="btnCalNext">&#8250;</button>
    </div>
    <div style="padding:10px 12px" id="calGrid"></div>
    <div style="padding:8px 12px" id="calDet"></div>
  </div>
</div>

<!-- 회원가입 -->
<div class="ov" id="ovReg">
  <div class="modal">
    <button class="mcls" id="btnClsReg">&times;</button>
    <h2>회원가입</h2>
    <div class="fg"><label>사번</label><input type="text" id="rId" placeholder="사번"></div>
    <div class="fg"><label>이름</label><input type="text" id="rName" placeholder="이름"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="rPw" placeholder="비밀번호"></div>
    <div class="fg"><label>소속팀</label>
      <select id="rTeam">
        <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
        <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
      </select>
    </div>
    <button class="btn btn-p" id="btnReg">가입 신청</button>
  </div>
</div>

<!-- 처리 -->
<div class="ov" id="ovAct">
  <div class="modal">
    <button class="mcls" id="btnClsAct">&times;</button>
    <h2>장비 처리</h2>
    <div class="sellist" id="actSelList"></div>
    <div class="asec">
      <label>처리 유형</label>
      <div class="rgrp" id="atypeGrp">
        <button class="rbtn on" data-v="수령">수령</button>
        <button class="rbtn" data-v="반납">반납</button>
        <button class="rbtn" data-v="보유">보유</button>
        <button class="rbtn" data-v="수령예정">수령예정</button>
      </div>
    </div>
    <div class="asec" id="secTeam">
      <label>팀 / 위치</label>
      <select id="actTeam" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
        <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
        <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
      </select>
    </div>
    <div class="asec" id="secRet" style="display:none">
      <label>반납 사유</label>
      <div class="rgrp" id="rreasonGrp">
        <button class="rbtn on" data-v="팀해체">팀해체</button>
        <button class="rbtn" data-v="장비점검">장비점검</button>
        <button class="rbtn" data-v="의공실">의공실</button>
        <button class="rbtn" data-v="기타">기타</button>
      </div>
      <input type="text" id="retEtc" placeholder="기타 사유" style="display:none;margin-top:9px;width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;font-family:inherit">
    </div>
    <div id="secPre" style="display:none">
      <div class="asec">
        <label>수령 예정일</label>
        <input type="date" id="preDate" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
      </div>
      <div class="asec">
        <label>현재 장비 위치</label>
        <select id="preLoc" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
          <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
          <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
        </select>
      </div>
    </div>
    <div class="asec">
      <label>특이사항</label>
      <div class="rgrp" id="noteGrp">
        <button class="rbtn on" data-v="없음">특이사항 없음</button>
        <button class="rbtn" data-v="있음">특이사항 있음</button>
      </div>
      <input type="text" id="noteTxt" placeholder="특이사항 내용" style="display:none;margin-top:9px;width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;font-family:inherit">
    </div>
    <button class="btn btn-p" id="btnSubmitAct">확인</button>
  </div>
</div>

<!-- 처리 결과 -->
<div class="ov" id="ovResult">
  <div class="modal">
    <button class="mcls" id="btnClsResult">&times;</button>
    <h2>처리 완료</h2>
    <div id="resultList"></div>
    <button class="btn btn-p" id="btnResultOk" style="margin-top:8px">확인</button>
  </div>
</div>

<!-- 메일 -->
<div class="ov" id="ovMail">
  <div class="modal">

function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function todayStr(){var n=new Date();return('0'+(n.getMonth()+1)).slice(-2)+'/'+('0'+n.getDate()).slice(-2);}
function api(p,cb){
  var url=SCRIPT_URL+'?'+Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]);}).join('&');
  fetch(url).then(function(r){return r.json();}).then(cb).catch(function(e){cb({status:'error',msg:String(e)});});
}
function parseMemo(memo){
  if(!memo)return{model:'',sn:''};
  var m=memo.match(/모델명\s*[-:]\s*([A-Za-z0-9\/\-\.]+)/i);
  var s=memo.match(/(?:S\/N|제조번호)\s*[-:]\s*([A-Za-z0-9]+)/i);
  return{model:m?m[1]:'',sn:s?s[1]:''};
}

/* ── 인증 ── */
function doLogin(){
  var id=document.getElementById('lId').value.trim(),pw=document.getElementById('lPw').value;
  var err=document.getElementById('lerr');err.style.display='none';
  if(!id||!pw){toast('사번과 비밀번호를 입력하세요');return;}
  var users=getU();if(!users.length){err.textContent='먼저 회원가입을 해주세요';err.style.display='block';return;}
  for(var i=0;i<users.length;i++){
    if(users[i].id===id&&users[i].pw===pw){
      if(!users[i].approved){toast('관리자 승인 대기 중입니다');return;}
      me={id:users[i].id,name:users[i].name,team:users[i].team,isAdmin:!!users[i].isAdmin};
      localStorage.setItem('_eqme',JSON.stringify(me));goMain();return;
    }
  }
  err.textContent='사번 또는 비밀번호가 틀렸습니다';err.style.display='block';
}
function doReg(){
  var id=document.getElementById('rId').value.trim(),name=document.getElementById('rName').value.trim();
  var pw=document.getElementById('rPw').value,team=document.getElementById('rTeam').value;
  if(!id||!name||!pw){toast('모든 항목을 입력하세요');return;}
  var users=getU();
  for(var i=0;i<users.length;i++){if(users[i].id===id){toast('이미 존재하는 사번입니다');return;}}
  var first=!users.length;
  users.push({id:id,name:name,pw:pw,team:team,approved:first,isAdmin:first});
  setU(users);hv('ovReg');
  if(first){me={id:id,name:name,team:team,isAdmin:true};localStorage.setItem('_eqme',JSON.stringify(me));goMain();toast('관리자로 로그인됐습니다');}
  else toast('가입 신청 완료. 관리자 승인 후 로그인하세요.');
}
function goMain(){
  document.getElementById('scLogin').style.display='none';
  document.getElementById('scMain').style.display='block';
  document.getElementById('uinfo').textContent=(me.name||'')+' ('+me.team+')';
  document.getElementById('btnAdmin').style.display=me.isAdmin?'inline-block':'none';
  if(!loaded)loadData();else buildCatSelect();
}

/* ── 데이터 로드 ── */
function loadData(){
  document.getElementById('equipList').innerHTML='<div class="loading"><div class="spinner"></div>데이터 로딩 중...</div>';
  api({action:'generateAll'},function(d){
    if(!d||d.status==='error'){
      document.getElementById('equipList').innerHTML='<div class="loading" style="color:#dc2626">연결 실패<br><small>'+(d&&d.msg||'URL 확인')+'</small><br><br><button onclick="loadData()" style="padding:8px 18px;background:#0f3460;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600">다시 시도</button></div>';
      return;
    }
    var items=Array.isArray(d)?d:(d.equipment||[]);
    var sv=getS(),byAsset={};
    items.forEach(function(it){
      it.assetNo=String(it.assetNo||'').trim();
      var an=it.assetNo;
      if(it.category==='청력기'&&HS[an]){it.model=HS[an].m;it.serial=HS[an].sn;it.headset=HS[an].hs;}
      if(sv[an]){var s=sv[an];it.status=s.status||it.status||'보유';it.location=s.location||it.location;it.lastAction=s.lastAction||'';}
      else if(!it.status)it.status='보유';
      byAsset[an]=it;
    });
    Object.keys(HS).forEach(function(an){
      if(byAsset[an]){byAsset[an].model=HS[an].m;byAsset[an].serial=HS[an].sn;byAsset[an].headset=HS[an].hs;}
      else{
        var it={name:'청력기',assetNo:an,category:'청력기',location:'-',status:'보유',model:HS[an].m,serial:HS[an].sn,headset:HS[an].hs,lastAction:''};
        if(sv[an]){var s=sv[an];it.status=s.status||it.status;it.location=s.location||it.location;it.lastAction=s.lastAction||'';}
        items.push(it);byAsset[an]=it;
      }
    });
    allItems=items;loaded=true;
    buildCatSelect();
    document.getElementById('equipList').innerHTML='<div class="loading" style="color:#94a3b8">장비를 선택하세요</div>';
    toast(items.length+'개 장비 로드 완료');
  });
}

/* ── 셀렉트 ── */
function buildCatSelect(){
  var s=document.getElementById('catSelect');
  s.innerHTML='<option value="">장비 선택</option>';
  CATS.forEach(function(cat){
    var cnt=allItems.filter(function(i){return i.category===cat;}).length;
    var opt=document.createElement('option');
    opt.value=cat;opt.textContent=cat+' ('+cnt+'개)';
    if(cat===curCat)opt.selected=true;
    s.appendChild(opt);
  });
}
function buildLocSelect(cat){
  var s=document.getElementById('locSelect');
  s.disabled=false;s.style.opacity='1';
  s.innerHTML='';
  var allOpt=document.createElement('option');allOpt.value='';
  var allCnt=allItems.filter(function(i){return i.category===cat;}).length;
  allOpt.textContent='전체 ('+allCnt+'개)';s.appendChild(allOpt);
  TEAMS.forEach(function(t){
    var cnt=allItems.filter(function(i){return i.category===cat&&i.location===t;}).length;
    var opt=document.createElement('option');opt.value=t;opt.textContent=t+' ('+cnt+'개)';
    if(t===curLoc)opt.selected=true;s.appendChild(opt);
  });
  var misCnt=allItems.filter(function(i){return i.category===cat&&(!i.location||i.location==='-'||TEAMS.indexOf(i.location)<0);}).length;
  var mis=document.createElement('option');mis.value='__mis__';mis.textContent='미선택 ('+misCnt+'개)';s.appendChild(mis);
}

document.getElementById('catSelect').onchange=function(){
  var cat=this.value;
  curCat=cat||null;curLoc=null;
  var ls=document.getElementById('locSelect');
  if(!cat){ls.disabled=true;ls.style.opacity='.5';ls.innerHTML='<option value="">장소 선택</option>';document.getElementById('catCbar').style.display='none';document.getElementById('equipList').innerHTML='<div class="loading" style="color:#94a3b8">장비를 선택하세요</div>';document.getElementById('equipCountTxt').textContent='';return;}
  var ct=CONTACT[cat];var cb=document.getElementById('catCbar');
  if(ct){cb.style.display='flex';cb.innerHTML='<span style="font-size:13px;font-weight:700;color:#1e293b">담당: '+x(ct.name)+'</span><span style="font-size:12px;color:#64748b">'+x(ct.phone)+'</span><a class="cbtn c-call" href="tel:'+x(ct.phone)+'">📞 전화</a><a class="cbtn c-mail" href="mailto:'+x(ct.email)+'">✉ 메일</a>';}
  else cb.style.display='none';
  buildLocSelect(cat);
  document.getElementById('srch').value='';
  renderEList();
};
document.getElementById('locSelect').onchange=function(){
  curLoc=this.value===''?null:this.value;
  renderEList();
};

/* ── 목록 렌더 ── */
function getListItems(){
  var q=(document.getElementById('srch').value||'').toLowerCase();
  return allItems.filter(function(it){
    if(!curCat||it.category!==curCat)return false;
    if(curLoc===null){}
    else if(curLoc==='__mis__'){if(it.location&&it.location!=='-'&&TEAMS.indexOf(it.location)>=0)return false;}
    else{if(it.location!==curLoc)return false;}
    if(q&&(it.name+it.assetNo).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function renderEList(){
  var L=document.getElementById('equipList'),items=getListItems();
  if(!curCat){L.innerHTML='<div class="loading" style="color:#94a3b8">장비를 선택하세요</div>';document.getElementById('equipCountTxt').textContent='';return;}
  document.getElementById('equipCountTxt').textContent=items.length+'개';
  if(!items.length){L.innerHTML='<div class="loading" style="color:#94a3b8">장비 없음</div>';return;}
  L.innerHTML='';items.forEach(function(it){L.appendChild(mkCard(it));});
}

/* ── 카드 ── */
function mkCard(it){
  var card=document.createElement('div');
  var isSel=sel.indexOf(it.assetNo)>=0;
  card.className='card'+(isSel?' sel':'');
  card.setAttribute('data-an',it.assetNo);
  card.style.borderLeftColor=CC[it.category]||'#0f3460';
  var sub='';
  if(it.category==='청력기'&&it.headset){sub=it.model+' / '+it.serial+' / '+it.headset;}
  else if(NB[it.category]&&it.memo){var p=parseMemo(it.memo);sub=(p.model||'')+(p.model&&p.sn?' / ':'')+(p.sn||'');}
  else if(it.model||it.serial){sub=[it.model,it.serial].filter(Boolean).join(' / ');}
  card.innerHTML=
    '<div class="chk">'+(isSel?'✓':'')+'</div>'+
    '<div class="ci">'+
      '<div class="cname">'+x(it.name)+'</div>'+
      '<div class="casset">'+x(it.assetNo)+' · '+x(it.location||'—')+'</div>'+
      (it.lastAction?'<div class="clast">'+x(it.lastAction)+'</div>':'')+
      (sub?'<div class="csub">'+x(sub)+'</div>':'')+
    '</div>'+
    '<div class="cright"><span class="badge b-'+x(it.status||'보유')+'">'+x(it.status||'보유')+'</span></div>';
  card.onclick=function(){togSel(it.assetNo,card);};
  return card;
}
function togSel(an,card){
  var i=sel.indexOf(an);
  if(i>=0){sel.splice(i,1);card.classList.remove('sel');card.querySelector('.chk').textContent='';}
  else{sel.push(an);card.classList.add('sel');card.querySelector('.chk').textContent='✓';}
  updSelbar();
}
function updSelbar(){
  var b=document.getElementById('selbar');
  if(sel.length){b.classList.add('on');document.getElementById('selCount').textContent=sel.length+'개 선택';}
  else b.classList.remove('on');
  updSelPanel();
}
function updSelPanel(){
  var panel=document.getElementById('selPanel');
  var list=document.getElementById('selPanelList');
  document.getElementById('selPanelCnt').textContent=sel.length;
  if(!sel.length){panel.style.display='none';return;}
  panel.style.display='block';
  list.innerHTML='';
  sel.forEach(function(an){
    var it=allItems.filter(function(e){return e.assetNo===an;})[0];
    var tag=document.createElement('span');
    tag.style.cssText='display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #2563eb;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;color:#1e40af;white-space:nowrap';
    var label=it?x(it.name)+' <span style="color:#94a3b8;font-size:11px;font-weight:400">'+x(an)+'</span>':x(an);
    tag.innerHTML=label+' <span style="cursor:pointer;color:#94a3b8;font-size:16px;line-height:1;margin-left:2px" onclick="removeSel(\''+an+'\')">×</span>';
    list.appendChild(tag);
  });
}
function removeSel(an){
  var i=sel.indexOf(an);if(i<0)return;
  sel.splice(i,1);
  document.querySelectorAll('.card[data-an="'+an+'"]').forEach(function(c){
    c.classList.remove('sel');var k=c.querySelector('.chk');if(k)k.textContent='';
  });
  updSelbar();
}
function clrSel(){
  sel=[];
  document.querySelectorAll('.card.sel').forEach(function(c){c.classList.remove('sel');var k=c.querySelector('.chk');if(k)k.textContent='';});
  updSelbar();
}

function renderTeamGrid(){

function showTeamDet(team){

function openAction(){
  if(!sel.length){toast('장비를 선택하세요');return;}
  atype='수령';rreason='팀해체';ntype='없음';
  ['atypeGrp','rreasonGrp','noteGrp'].forEach(function(id){document.querySelectorAll('#'+id+' .rbtn').forEach(function(b){b.classList.remove('on');});});
  document.querySelector('#atypeGrp .rbtn[data-v="수령"]').classList.add('on');
  document.querySelector('#rreasonGrp .rbtn[data-v="팀해체"]').classList.add('on');
  document.querySelector('#noteGrp .rbtn[data-v="없음"]').classList.add('on');
  document.getElementById('secRet').style.display='none';
  document.getElementById('secTeam').style.display='block';
  document.getElementById('secPre').style.display='none';
  document.getElementById('retEtc').style.display='none';document.getElementById('retEtc').value='';
  document.getElementById('noteTxt').style.display='none';document.getElementById('noteTxt').value='';
  document.getElementById('actTeam').value=me.team;
  var nd=new Date();nd.setDate(nd.getDate()+7);document.getElementById('preDate').value=nd.toISOString().slice(0,10);
  var sl=document.getElementById('actSelList');sl.innerHTML='';
  sel.forEach(function(id){
    var it=allItems.filter(function(e){return e.assetNo===id;})[0];
    var d=document.createElement('div');d.className='selitem';d.textContent=it?(it.name+' ('+id+')'):id;sl.appendChild(d);
  });
  ov('ovAct');
}
function submitAction(){
  var ds=todayStr();
  var note=ntype==='없음'?'특이사항 없음':(document.getElementById('noteTxt').value.trim()||'특이사항 있음');
  var rr=rreason==='기타'?(document.getElementById('retEtc').value.trim()||'기타'):rreason;
  var team=document.getElementById('actTeam').value;
  var entries=[],results=[];
  sel.forEach(function(assetNo){
    var it=allItems.filter(function(e){return e.assetNo===assetNo;})[0];if(!it)return;
    var loc,fVal,dateVal;
    if(atype==='수령'){loc=team;fVal=team+' ('+ds+')';dateVal=team+' 수령 ('+me.name+' - '+note+')';}
    else if(atype==='보유'){loc=team;fVal=team+' ('+ds+')';dateVal=team+' 보유 ('+me.name+' - '+note+')';}
    else if(atype==='반납'){loc=rr==='의공실'?'의공실':'사무실';fVal=loc+' ('+ds+')';dateVal=team+' 반납 - '+rr+' ('+me.name+' - '+note+')';}
    else{
      var pdDate=new Date(document.getElementById('preDate').value);
      var pdStr=('0'+(pdDate.getMonth()+1)).slice(-2)+'/'+('0'+pdDate.getDate()).slice(-2);
      var curL=document.getElementById('preLoc').value;
      loc=curL;fVal=curL+' ('+ds+')';dateVal=team+' 수령예정 ('+me.name+' - '+pdStr+' '+team+' 수령예정)';
    }
    it.status=atype;it.location=loc;
    it.lastAction=loc+' '+atype+' ('+ds+') - '+me.name+' ('+note+')';
    entries.push({category:it.category,assetNo:assetNo,newLocation:fVal,cellValue:dateVal,userName:me.name,note:note});
    results.push({it:it,action:atype,team:team,note:note,ds:ds});
  });
  var sv=getS();
  entries.forEach(function(e){
    var it=allItems.filter(function(i){return i.assetNo===e.assetNo;})[0];
    sv[e.assetNo]={status:atype,location:it?it.location:'',lastAction:it?it.lastAction:''};
  });
  setS(sv);hv('ovAct');clrSel();
  var rl=document.getElementById('resultList');rl.innerHTML='';
  results.forEach(function(r){
    var it=r.it,an=it.assetNo;
    var dn=(it.name||'').replace(/[^0-9]/g,'').slice(0,8);
    var head=r.team+' '+r.action+' / '+it.category+' ('+dn+')/'+an;
    var info='';
    if(it.category==='청력기'&&HS[an]){info='(모델명 '+HS[an].m+', S/N - '+HS[an].sn+')  (헤드셋 - '+HS[an].hs+')';}
    else if(NB[it.category]&&it.memo){var p=parseMemo(it.memo);if(p.model||p.sn)info='(모델명 '+(p.model||'')+', S/N - '+(p.sn||'')+')';}
    else if(it.model||it.serial){info='(모델명 '+(it.model||'')+', S/N - '+(it.serial||'')+')';}
    var d=document.createElement('div');d.className='rc';
    d.innerHTML='<div class="rc-head">'+x(head)+'</div>'+(info?'<div class="rc-info">'+x(info)+'</div>':'')+
      '<div class="rc-div"></div><div class="rc-bot">'+x(r.ds+' '+me.name+' - '+r.note)+'</div>';
    rl.appendChild(d);
  });
  ov('ovResult');
  if(curCat)renderEList();
  if(curTeam)showTeamDet(curTeam);
  renderTeamGrid();
  if(curCat){buildLocSelect(curCat);}
  api({action:'update',data:JSON.stringify(entries)},function(d){
    if(!d||d.status==='error'){toast('시트 연결 실패: '+(d&&d.msg||'오류'),5000);return;}
    if(d.errors&&d.errors.length)toast('⚠ '+d.errors[0],6000);
    else toast('시트 기록 완료 ('+d.updated+'건)');
  });
}

function csvRows(){
  var rows=[['순서','기기명','모델','S/N','자산번호','현재위치','상태']];
  sel.forEach(function(id,i){
    var it=allItems.filter(function(e){return e.assetNo===id;})[0];if(!it)return;
    var model='',sn='';
    if(NB[it.category]){var p=parseMemo(it.memo||'');model=p.model;sn=p.sn;}
    else{model=it.model||'';sn=it.serial||'';}
    rows.push([i+1,it.name,model,sn,it.assetNo,it.location||'-',it.status||'보유']);
  });
  return rows;
}

function renderPending(){

      '<div class="pbtns"><button class="bs bg" onclick="doApprove(\''+x(u.id)+'\',true)">승인</button><button class="bs br" onclick="doApprove(\''+x(u.id)+'\',false)">거부</button></div>';

function doApprove(uid,ok){
  var users=getU();
  if(ok){for(var i=0;i<users.length;i++){if(users[i].id===uid){users[i].approved=true;break;}}}
  else users=users.filter(function(u){return u.id!==uid;});
  setU(users);toast(ok?'승인 완료':'거부 완료');renderPending();
}

/* ── 달력 ── */
function drawCal(){
  var months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTxt').textContent=calY+'년 '+months[calM];
  document.getElementById('calDet').innerHTML='';
  var mm=('0'+(calM+1)).slice(-2);
  var evs={};
  allItems.forEach(function(it){
    if(!it.lastAction)return;
    // 특이사항 있는 것만
    if(it.lastAction.indexOf('특이사항 없음')>=0)return;
    var m=it.lastAction.match(/\((\d{2})\/(\d{2})\)/);
    if(!m||m[1]!==mm)return;
    var day=parseInt(m[2]);if(!evs[day])evs[day]=[];
    evs[day].push({c:CC[it.category]||'#888',it:it});
  });
  var first=new Date(calY,calM,1).getDay(),total=new Date(calY,calM+1,0).getDate();
  var td=new Date(),tY=td.getFullYear(),tM=td.getMonth(),tD=td.getDate();
  var h='<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>';
  ['일','월','화','수','목','금','토'].forEach(function(d,i){h+='<th style="padding:7px 2px;text-align:center;color:'+(i===0?'#e53e3e':i===6?'#2563eb':'#94a3b8')+';font-size:12px;font-weight:700">'+d+'</th>';});
  h+='</tr><tr>';
  for(var i=0;i<first;i++)h+='<td></td>';
  var col=first;
  for(var day=1;day<=total;day++){
    var isT=calY===tY&&calM===tM&&day===tD;
    var ev=evs[day]||[];var dow=(first+day-1)%7;
    var nc=isT?'#fff':(dow===0?'#e53e3e':dow===6?'#2563eb':'#1e293b');
    var dots='';
    if(ev.length){
      var sh={},dl=[];ev.forEach(function(e){if(!sh[e.c]){sh[e.c]=true;dl.push(e.c);}});
      dots='<div style="display:flex;justify-content:center;gap:2px;margin-top:2px">';
      dl.slice(0,4).forEach(function(c){dots+='<div style="width:5px;height:5px;border-radius:50%;background:'+c+'"></div>';});
      dots+='</div>';
    }
    h+='<td style="padding:3px;text-align:center;vertical-align:top;cursor:'+(ev.length?'pointer':'default')+'" '+(ev.length?'onclick="showDay('+day+')"':'')+'>'+
      '<div style="width:27px;height:27px;line-height:27px;border-radius:50%;background:'+(isT?'#0f3460':'transparent')+';color:'+nc+';margin:0 auto;font-size:12px;font-weight:'+(isT?800:400)+'">'+day+'</div>'+dots+'</td>';
    col++;if(col%7===0&&day<total)h+='</tr><tr>';
  }
  document.getElementById('calGrid').innerHTML=h+'</tr></table>';
}
function showDay(day){
  var mm=('0'+(calM+1)).slice(-2),dd=('0'+day).slice(-2),ds=mm+'/'+dd;
  // 특이사항 있는 것만
  var items=allItems.filter(function(it){
    return it.lastAction&&it.lastAction.indexOf('('+ds+')')>=0&&it.lastAction.indexOf('특이사항 없음')<0;
  });
  var det=document.getElementById('calDet');
  if(!items.length){det.innerHTML='<p style="color:#94a3b8;text-align:center;padding:16px;font-size:13px">특이사항 내역 없음</p>';return;}
  var h='<div style="font-weight:800;color:#0f3460;margin-bottom:10px;font-size:14px">'+(calM+1)+'/'+day+' 특이사항 ('+items.length+'건)</div>';
  items.forEach(function(it){
    var c=CC[it.category]||'#888';
    h+='<div style="background:#fff;border-radius:13px;padding:13px;margin-bottom:9px;border-left:4px solid '+c+';box-shadow:0 2px 10px rgba(0,0,0,.07)">'+
      '<div style="font-weight:700;font-size:14px;color:#1e293b">'+x(it.name)+' <span style="font-size:11px;color:#94a3b8">('+x(it.assetNo)+')</span></div>'+
      '<div style="font-size:12px;color:#64748b;margin:3px 0">'+x(it.category)+' · '+x(it.location||'-')+'</div>'+
      '<div style="font-size:12px;color:#dc2626;font-weight:600">'+x(it.lastAction||'')+'</div>'+
    '</div>';
  });
  det.innerHTML=h;
}
