<div class="loading" id="loading">처리중...</div>

<div class="screen login-screen" id="loginScreen" style="display:flex">
<div class="login-box">
<h1>장비관리</h1>
<input type="text" id="loginId" placeholder="아무거나">
<input type="password" id="loginPw" placeholder="아무거나">
<button type="button" onclick="window.doLogin()">로그인</button>
<button type="button" class="link-btn" onclick="window.goRegister()">회원가입</button>
</div>
</div>

<div class="screen register-screen" id="registerScreen" style="display:none">
<div class="login-box">
<h1>회원가입</h1>
<input type="text" id="regId" placeholder="사번">
<input type="text" id="regName" placeholder="이름">
<input type="password" id="regPw" placeholder="비밀번호">
<input type="password" id="regPwConf" placeholder="비밀번호 확인">
<select id="regTeam">
<option value="">팀 선택</option>
<option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option>
<option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option>
<option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option>
<option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option>
</select>
<button type="button" onclick="window.doRegister()">가입신청</button>
<button type="button" class="link-btn" onclick="window.goLogin()">로그인으로</button>
</div>
</div>

<div class="screen main-screen" id="mainScreen" style="display:none">
<div class="header">
<h1>장비관리</h1>
<div class="header-right">
<span id="userInfo"></span>
<button class="btn-edit" onclick="window.showEdit()">정보수정</button>
<button class="btn-logout" onclick="window.doLogout()">로그아웃</button>
</div>
</div>
<div class="tabs">
<button class="tab active" onclick="window.switchView('equipment')" id="equipTab">장비별</button>
<button class="tab" onclick="window.switchView('team')" id="teamTab">팀별</button>
<button class="tab" onclick="window.switchView('date')" id="dateTab">날짜별</button>
</div>

<div id="equipmentView">
<div class="search-bar">
<input type="text" id="searchInput" placeholder="검색" oninput="window.filter()">
<button class="btn-email-all" onclick="window.emailSelected(window.G.sel)">선택 메일</button>
</div>
<div class="category-tabs" id="categoryTabs"></div>
<div class="select-all-bar">
<label><input type="checkbox" id="selectAllCheckbox" onchange="window.toggleSelectAll()"> 전체 선택</label>
</div>
<div class="equipment-list" id="equipmentList"></div>
</div>

<div id="teamView" class="hidden">
<div class="search-bar">
<select id="teamFilter" onchange="window.filterTeam()">
<option value="">팀 선택</option>
<option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option>
<option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option>
<option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option>
<option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option>
</select>
<button class="btn-email-all" onclick="window.emailTeam()">팀 메일</button>
</div>
<div class="equipment-list" id="teamList"></div>
</div>

<div id="dateView" class="hidden">
<div class="month-nav">
<button onclick="window.moveMonth(-1)">◀ 이전달</button>
<span id="currentMonth" style="font-weight:bold;font-size:18px"></span>
<button onclick="window.moveMonth(1)">다음달 ▶</button>
</div>
<div class="calendar" id="calendar"></div>
<div id="dateResults"></div>
</div>

<div class="action-bar" id="actionBar">
<span><span class="selected-count" id="selectedCount">0</span> 선택</span>
<button onclick="window.showBulk()">수령/반납</button>
<button onclick="window.emailSelected(window.G.sel)">메일</button>
</div>

<div class="bottom-nav">
<button class="nav-item active" onclick="window.switchView('equipment')" id="navEquip">장비별</button>
<button class="nav-item" onclick="window.switchView('team')" id="navTeam">팀별</button>

<div class="modal" id="bulkModal">
<div class="modal-content">
<div class="modal-header"><h2>일괄처리</h2><span class="modal-close" onclick="window.closeModal('bulkModal')">×</span></div>

<div class="form-group"><label>팀/위치</label><select id="bulkTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="form-group hidden" id="returnGroup"><label>반납사유</label><select id="returnReason" onchange="window.toggleCustom()"><option value="팀해체">팀해체</option><option value="의공실">의공실</option><option value="장비점검">장비점검</option><option value="기타">기타</option></select></div>
<div class="form-group hidden" id="customGroup"><label>사유입력</label><input type="text" id="customReason"></div>
<div class="form-group"><label>관리자</label><input type="text" id="bulkManager"></div>
<div class="form-group"><label>특이사항</label><textarea id="bulkMemo">특이사항 없음</textarea></div>
<div class="form-group"><label>날짜</label><input type="date" id="bulkDate"></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.submitBulk()">등록</button><button class="btn-secondary" onclick="window.closeModal('bulkModal')">취소</button></div>
</div>
</div>

<div class="modal" id="emailModal">
<div class="modal-content">
<div class="modal-header"><h2>이메일 보내기</h2><span class="modal-close" onclick="window.closeModal('emailModal')">×</span></div>
<div class="form-group"><label>보낸사람</label><select id="emailFrom"><option value="">선택</option></select></div>
<div class="form-group"><label>받는사람</label><select id="emailTo"><option value="">선택</option></select></div>
<div class="form-group"><label>제목</label><input type="text" id="emailSubject" value="장비 정보"></div>
<div class="form-group"><label>내용</label><textarea id="emailBody" rows="10"></textarea></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.sendEmail()">전송</button><button class="btn-secondary" onclick="window.closeModal('emailModal')">취소</button></div>
</div>
</div>

<div class="modal" id="editModal">
<div class="modal-content">
<div class="modal-header"><h2>정보수정</h2><span class="modal-close" onclick="window.closeModal('editModal')">×</span></div>

<div class="form-group"><label>이름</label><input type="text" id="editName" disabled></div>
<div class="form-group"><label>팀</label><select id="editTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div>
<div class="form-group"><label>새 비밀번호</label><input type="password" id="editPw" placeholder="변경시만"></div>
<div class="modal-buttons"><button class="btn-primary" onclick="window.saveEdit()">저장</button><button class="btn-secondary" onclick="window.closeModal('editModal')">취소</button></div>
</div>
</div>

window.renderCat=function(){const c=document.getElementById('categoryTabs');c.innerHTML='';const all=document.createElement('button');all.className='category-tab active';all.textContent='전체';all.onclick=()=>window.selectCat('');c.appendChild(all);CAT.forEach(ca=>{const cnt=window.G.all.filter(e=>e.category===ca).length;if(cnt>0){const btn=document.createElement('button');btn.className='category-tab';btn.textContent=ca+'('+cnt+')';btn.onclick=()=>window.selectCat(ca);c.appendChild(btn)}})};
window.selectCat=function(c){window.G.cat=c;document.querySelectorAll('.category-tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');window.filter()};
window.filter=function(){const s=document.getElementById('searchInput').value.toLowerCase();window.G.filt=window.G.all.filter(i=>{const mc=!window.G.cat||i.category===window.G.cat;const ms=!s||i.name.toLowerCase().includes(s)||i.assetNo.toLowerCase().includes(s);return mc&&ms});window.renderList()};
window.renderList=function(){
const l=document.getElementById('equipmentList');
if(window.G.filt.length===0){l.innerHTML='<div style="text-align:center;padding:40px;color:#999">없음</div>';return}
l.innerHTML=window.G.filt.map(i=>{
let h='<div class="equipment-item">';
h+='<input type="checkbox" class="equipment-checkbox" data-id="'+i.id+'" '+(window.G.sel.includes(i.id)?'checked':'')+' onchange="window.toggleSel('+i.id+')">';
h+='<div class="equipment-name">'+i.name+'</div>';
h+='<div class="equipment-info">자산: '+i.assetNo+'</div>';
if(i.serial)h+='<div class="equipment-info">시리얼: '+i.serial+'</div>';
if(i.notebookModel)h+='<div class="equipment-info">노트북: '+i.notebookModel+' ('+i.notebookSerial+')</div>';
if(i.headsetModel)h+='<div class="equipment-info">헤드셋: '+i.headsetModel+' ('+i.headsetSerial+')</div>';
h+='<span class="equipment-location">'+i.location+'</span>';
h+='<button class="email-btn" onclick="window.emailSelected(['+i.id+'])">이메일</button>';
h+='</div>';
return h;
}).join('');
};

window.submitBulk=async function(){
if(window.G.sel.length===0){alert('선택없음');return}
const type=document.getElementById('bulkType').value;
const team=document.getElementById('bulkTeam').value;
const mgr=document.getElementById('bulkManager').value.trim();
const memo=document.getElementById('bulkMemo').value.trim();
const date=document.getElementById('bulkDate').value;
let reason='';
if(type==='반납'){
reason=document.getElementById('returnReason').value;
if(reason==='기타')reason=document.getElementById('customReason').value.trim();
if(!reason){alert('반납사유 입력');return}
}
if(!team||!mgr||!memo||!date){alert('모두 입력');return}
document.getElementById('loading').classList.add('active');
try{
for(const id of window.G.sel){
const eq=window.G.all.find(e=>e.id===id);
if(!eq)continue;
const url=API+'?equipment='+encodeURIComponent(eq.category)+'&assetNo='+encodeURIComponent(eq.assetNo)+'&team='+encodeURIComponent(team)+'&status='+encodeURIComponent(type)+'&manager='+encodeURIComponent(mgr)+'&memo='+encodeURIComponent(memo)+'&returnReason='+encodeURIComponent(reason)+'&date='+date;
await fetch(url);
const idx=window.G.all.findIndex(e=>e.id===id);
if(idx>-1){
if(type==='수령'||type==='보유'||type==='수령예정')window.G.all[idx].location=team;
else if(type==='반납')window.G.all[idx].location='사무실';
}
}
alert('등록완료');
window.G.sel=[];
document.getElementById('selectedCount').textContent='0';
document.getElementById('selectAllCheckbox').checked=false;
document.getElementById('actionBar').classList.remove('active');
window.closeModal('bulkModal');
window.filter();
}catch(e){alert('실패:'+e.message)}finally{document.getElementById('loading').classList.remove('active')}
};

window.showCalendar=function(){
document.getElementById('currentMonth').textContent=window.G.currentYear+'년 '+window.G.currentMonth+'월';
const cal=document.getElementById('calendar');
cal.innerHTML='';
['일','월','화','수','목','금','토'].forEach(d=>{const h=document.createElement('div');h.className='cal-header';h.textContent=d;cal.appendChild(h)});
const firstDay=new Date(window.G.currentYear,window.G.currentMonth-1,1).getDay();
const lastDate=new Date(window.G.currentYear,window.G.currentMonth,0).getDate();
for(let i=0;i<firstDay;i++){cal.appendChild(document.createElement('div'))}
for(let d=1;d<=lastDate;d++){
const day=document.createElement('div');
day.className='cal-day';
day.textContent=d;
day.onclick=()=>window.selectDate(d);
cal.appendChild(day);
}
};

window.moveMonth=function(dir){
window.G.currentMonth+=dir;
if(window.G.currentMonth>12){window.G.currentMonth=1;window.G.currentYear++}
else if(window.G.currentMonth<1){window.G.currentMonth=12;window.G.currentYear--}
window.showCalendar();
};

};

window.G.user=JSON.parse(saved);
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
document.getElementById('userInfo').textContent=window.G.user.name;
window.load();
}
</script>
