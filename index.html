// [CORS 해결을 위한 JSONP 통신 함수]
function callGAS(url, action, params, callback) {
    const callbackName = 'jsonp_' + Date.now();
    window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        callback(data);
    };
    const query = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(typeof params[k] === 'object' ? JSON.stringify(params[k]) : params[k])).join('&');
    const script = document.createElement('script');
    script.src = `${url}?action=${action}&callback=${callbackName}&${query}`;
    document.body.appendChild(script);
}

// --- 나머지 파싱 및 렌더링 함수들 (100% 동일하게 유지) ---

function parseCurrentLocation(row){const val=row.location||'';if(!val||!val.trim())return{location:"미선택",date:null};const str=val.toString().trim();const dateMatch=str.match(/\((\d{1,2})\/(\d{1,2})\)/);const date=dateMatch?dateMatch[1].padStart(2,'0')+'/'+dateMatch[2].padStart(2,'0'):null;const cleanStr=str.replace(/\(.*?\)/g,'').trim();let location="미선택";if(cleanStr.includes('아산1'))location='아산1';else if(cleanStr.includes('평택'))location='평택';else if(cleanStr.includes('수원'))location='수원';else if(cleanStr.includes('사무실'))location='사무실';else if(cleanStr.includes('센터'))location='센터';else if(cleanStr.includes('의공실'))location='의공실';else{const match=cleanStr.match(/(?:^|[^\d])([1-6])(?:팀|[^\d]|$)/);if(match)location=match[1]}return{location,date}}
function isRealIssue(text){if(!text||!text.trim())return false;const clean=text.replace(/\s/g,"").toLowerCase();if(clean.match(/wt\d+/)||clean.match(/nt\d+/)||clean.match(/dm\d+/))return false;for(const ig of IGNORE_TEXT){const cleanIgnore=ig.replace(/\s/g,"").toLowerCase();if(clean===cleanIgnore||clean.includes(cleanIgnore))return false}return true}
function setMode(m){mode=m;document.getElementById('tab-equip').classList.toggle('active',m==='equip');document.getElementById('tab-location').classList.toggle('active',m==='location');document.getElementById('tab-date').classList.toggle('active',m==='date');document.getElementById('tab-admin').classList.toggle('active',m==='admin');show()}

function show(){

        const equipCounts={}; cats.forEach(c=>{equipCounts[c]=allData.filter(r=>r.category===c).length});
        document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title" id="equipTitle" style="background:#9b59b6">장비 선택</div><select id="es" onchange="updateLocs()"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'">'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select></div><div id="locBox" style="display:none"><div class="box"><div class="box-title" style="background:#e67e22">장소 필터</div><select id="ls" onchange="showEquipList()"><option value="">선택</option></select></div></div>'

    }else if(mode==='admin'){

function updateLocs(){

    document.getElementById('equipTitle').innerText=eq+' ('+total+'개)';
    document.getElementById('equipTitle').style.background=COLORS[eq]||'#9b59b6';
    const locationCounts={}; LOCS.forEach(loc=>{locationCounts[loc]=allData.filter(r=>r.category===eq&&parseCurrentLocation(r).location===loc).length});
    const totalAll=allData.filter(r=>r.category===eq).length;
    document.getElementById('ls').innerHTML='<option value="">선택</option><option value="전체">전체 ('+totalAll+'개)</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+' ('+locationCounts[l]+'개)</option>').join('');

}

function showLocationList(){
    const loc=document.getElementById('ls').value;
    if(!loc){document.getElementById('results').innerHTML='';return}
    currentLoc=loc;
    const found=allData.filter(r=>parseCurrentLocation(r).location===loc);
    renderResults(found);

function renderResults(found){
    if(found.length===0){document.getElementById('results').innerHTML='<p style="padding:20px;text-align:center">장비 없음</p>';return}
    let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div><div id="topButtons" style="margin:10px 0"></div>';
    html+=found.map(r=>{
        const data=parseCurrentLocation(r);
        const locDisp=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;
        let title=locDisp+' 보유 / '+r.category+'('+(data.date||'')+') / '+r.assetNo;
        if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}
        if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}
        if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}
        const equipData=JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');
        let memoText=r.currentDetail||r.memo||''; const hasIssue=isRealIssue(memoText);
        let memoDisp=memoText? (data.date||'최근')+' '+locDisp+' 보유 ('+memoText.split('/').pop().trim()+')' : (data.date||'최근')+' '+locDisp+' 보유 (특이사항 없음)';
        const memoStyle=hasIssue?'color:#e74c3c;font-weight:bold':'color:#27ae60';
        const isChecked=selectedEquipments.has(r.assetNo)?'checked':'';
        const equipColor=COLORS[r.category]||'#00b894';
        return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' data-asset="'+r.assetNo+'" onchange="updateSelection()" '+isChecked+'><div class="card"><div class="card-title" style="color:'+equipColor+';border-left:4px solid '+equipColor+';padding-left:10px">'+title+'</div><div class="card-divider"></div><div class="card-memo" style="'+memoStyle+'">'+memoDisp+'</div></div></div>'
    }).join('');
    document.getElementById('results').innerHTML=html;
    updateTopButtons();
}

function updateSelection(){document.querySelectorAll('.equipment-checkbox').forEach(cb=>{const asset=cb.getAttribute('data-asset');const equipData=JSON.parse(cb.getAttribute('data-equipment').replace(/&apos;/g,"'"));if(cb.checked){selectedEquipments.set(asset,equipData)}else{selectedEquipments.delete(asset)}});updatePreview()}

function showActionModal(){
    if(selectedEquipments.size===0){alert('장비를 선택하세요');return}
    let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">작업 선택 ('+selectedEquipments.size+'개)</div>';
    if(mode==='equip'){html+='<button class="action-btn" onclick="selectAction(\'수령\')">수령</button><button class="action-btn" onclick="selectAction(\'수령예정\')">수령예정</button>'}
    else if(mode==='location'){html+='<button class="action-btn" onclick="selectAction(\'반납\')">반납</button><button class="action-btn" onclick="selectAction(\'보유\')">보유</button>'}
    document.getElementById('actionContent').innerHTML=html;
    document.getElementById('actionModal').style.display='block';
}

function selectAction(action){
    let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">'+action+'</div>';
    html+='<label style="display:block;margin-bottom:5px;font-weight:bold">이름</label><input type="text" id="actionName" value="'+(currentUser?currentUser.name:'')+'" readonly style="background:#f0f0f0;margin-bottom:10px">';
    html+='<label style="display:block;margin-bottom:5px;font-weight:bold">팀 선택</label><select id="actionTeam"><option value="">팀 선택</option>'+LOCS.map(l=>'<option value="'+l+'" '+(currentUser&&currentUser.team===l?'selected':'')+'>'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';
    if(action==='반납'){html+='<select id="returnReason"><option value="">반납사유</option><option value="팀해체">팀해체</option><option value="장비점검">장비점검</option><option value="의공실">의공실</option><option value="기타">기타</option></select><input type="text" id="returnReasonEtc" placeholder="기타 사유" style="display:none">';}
    if(action==='수령예정'){html+='<select id="destTeam"><option value="">목적지</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';}
    html+='<div class="radio-group"><label class="radio-label"><input type="radio" name="memo" value="없음" checked onchange="toggleMemo(false)"> 특이사항 없음</label><label class="radio-label"><input type="radio" name="memo" value="있음" onchange="toggleMemo(true)"> 특이사항 있음</label></div><input type="text" id="memoText" placeholder="특이사항 입력" style="display:none">';
    html+='<button class="action-btn" onclick="submitAction(\''+action+'\')">등록</button>';
    document.getElementById('actionContent').innerHTML=html;
    if(action==='반납'){document.getElementById('returnReason').onchange=function(){document.getElementById('returnReasonEtc').style.display=this.value==='기타'?'block':'none'}}
}

function toggleMemo(show){document.getElementById('memoText').style.display=show?'block':'none'}
function closeActionModal(){document.getElementById('actionModal').style.display='none'}

async function submitAction(action){
    const name=document.getElementById('actionName').value;
    const team=document.getElementById('actionTeam').value;
    if(!name||!team){alert('이름과 팀을 입력하세요');return}
    const hasMemo=document.querySelector('input[name="memo"]:checked').value==='있음';
    let memo=hasMemo ? document.getElementById('memoText').value.trim() : '특이사항 없음';
    if(hasMemo && !memo){alert('특이사항을 입력하세요');return}

    let newLocation=team; const teamLabel=/^[1-6]$/.test(team)?team+'팀':team;
    let cellValue=teamLabel+' '+action+' ('+name+' - '+memo+')';

    if(action==='반납'){
        const reason=document.getElementById('returnReason').value;
        const reasonText=reason==='기타'?document.getElementById('returnReasonEtc').value:reason;
        newLocation=(reason==='의공실')?'의공실':'사무실';
        cellValue=teamLabel+' 반납 (반납사유-'+reasonText+'/'+name+' - '+memo+')';
    }else if(action==='수령예정'){
        const dest=document.getElementById('destTeam').value; newLocation=dest;
        cellValue=teamLabel+' 수령예정 ('+name+' - '+memo+')';
    }

    const locationLabel=/^[1-6]$/.test(newLocation)?newLocation+'팀':newLocation;
    const entries=Array.from(selectedEquipments.values()).map(e=>({
        category:e.category, assetNo:e.assetNo,
        newLocation:locationLabel+' ('+(new Date().getMonth()+1).toString().padStart(2,'0')+'/'+(new Date().getDate()).toString().padStart(2,'0')+')',
        cellValue:cellValue
    }));

    showLoading(true);
    callGAS(API, 'update', {entries}, function(result) {
        showLoading(false);
        if(result.success){alert('등록 완료'); closeActionModal(); selectedEquipments.clear(); updatePreview(); load(true)}
        else{alert('등록 실패: '+result.error)}
    });
}

// --- 이메일 전송 부분 (fetch mode:no-cors 유지 또는 callGAS 선택 가능) ---

function showEmailModal(){
    if(selectedEquipments.size===0){alert('장비를 선택하세요');return}
    selectedSender=null; const names=Object.keys(EMAILS);
    let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">보내는 사람 선택</div>';
    html+=names.map(name=>'<button class="recipient-btn" onclick="selectSender(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');
    document.getElementById('modalContent').innerHTML=html;
    document.getElementById('emailModal').style.display='block';
}

function selectSender(senderName){
    selectedSender=senderName;
    const names=Object.keys(EMAILS);
    let html='<div style="margin-bottom:15px;background:#e8f5e9;padding:10px;border-radius:8px">📤 보내는 사람: '+selectedSender+'</div><div style="margin-bottom:20px;font-size:18px;font-weight:bold">받는 사람 선택</div>';
    html+=names.map(name=>'<button class="recipient-btn" onclick="sendEmail(\''+name+'\')">'+name+'<br><small style="color:#636e72">'+EMAILS[name]+'</small></button>').join('');
    document.getElementById('modalContent').innerHTML=html;
}

async function sendEmail(recipientName){
    if(!selectedSender||selectedEquipments.size===0)return;
    document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px">📧 메일 전송 중...</div>';
    
    try {
        const selectedArray=Array.from(selectedEquipments.values());
        const numberedEquip=selectedArray.map((item,index)=>({
            '순번':index+1, '기기명':item.name, '모델':item.model||'', 'S/N':item.serial||''
        }));
        const ws=XLSX.utils.json_to_sheet(numberedEquip);
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'장비목록');
        const wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});

        // 이메일은 서버에서 반환값을 확인할 필요가 적으므로 기존 no-cors 유지 가능
        await fetch(MAIL_API,{
            method:'POST', mode:'no-cors',
            body:JSON.stringify({
                recipient:EMAILS[recipientName], sender:EMAILS[selectedSender],
                senderName:selectedSender, locationName:currentLoc||'장비',
                excelBase64:wbout, fileName:'장비목록.xlsx'
            })
        });
        alert('전송 요청 완료'); closeModal();
    } catch(e) { alert('오류: '+e.message); }
}

function closeModal(){selectedSender=null;document.getElementById('emailModal').style.display='none'}
