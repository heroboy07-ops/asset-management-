<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:10px}.header{background:#667eea;color:#fff;padding:15px;text-align:center;font-weight:bold;border-radius:10px;margin-bottom:10px;font-size:14px}.tabs{display:flex;gap:5px;margin-bottom:15px}.tab{flex:1;padding:12px;background:#fff;border:2px solid #ddd;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;font-size:13px}.tab.active{background:#667eea;color:#fff;border-color:#667eea}.box{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.box-title{font-weight:bold;margin-bottom:10px;font-size:14px;color:#fff;background:#00b894;padding:10px;margin:-15px -15px 15px -15px;border-radius:12px 12px 0 0}select,input,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:10px}.btn-group{display:flex;gap:10px;margin-bottom:10px}.select-btn{flex:1;padding:12px;background:#0984e3;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}.select-btn.deselect{background:#6c757d}.card-container{display:flex;align-items:flex-start;margin-bottom:10px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}.equipment-checkbox{width:24px;height:24px;margin-right:10px;margin-top:5px;cursor:pointer;flex-shrink:0}.card{flex:1}.card-title{font-weight:bold;font-size:14px;color:#333;line-height:1.6;margin-bottom:10px}.card-divider{border-top:2px solid #e0e0e0;margin:10px 0;padding-top:10px}.card-memo{font-size:13px;color:#666}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5)}.modal-content{background:#fff;margin:10% auto;padding:30px;border-radius:12px;width:95%;max-width:500px;max-height:85vh;overflow-y:auto}.modal-close{float:right;font-size:28px;font-weight:bold;color:#aaa;cursor:pointer}.recipient-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#f8f9fa;border:2px solid #dfe6e9;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 40px;border-radius:10px;z-index:9999;display:none}.loading.active{display:block}.calendar{display:grid;grid-template-columns:repeat(7,1fr);background:#eee;gap:1px;border:1px solid #ddd;border-radius:8px;overflow:hidden}.cal-header{padding:10px;text-align:center;font-weight:bold;background:#f8f9fa;font-size:12px}.cal-day{height:80px;background:#fff;padding:5px;text-align:left;font-size:14px;cursor:pointer;position:relative}.cal-day.issue{background:#fff0f0}.cal-day.issue::after{content:'⚠️';position:absolute;bottom:5px;right:5px;font-size:12px;color:#d63031}.cal-day.selected{background:#667eea!important;color:#fff!important}.month-nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.month-nav button{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}.action-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}.action-btn-small{padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px}

<body>

</div>
<div id="regScreen" style="display:none">
    <div class="box"><div class="box-title">회원가입</div><input type="text" id="regName" placeholder="이름"><input type="text" id="regEmpId" placeholder="사번"><input type="password" id="regPass" placeholder="비밀번호"><select id="regTeam"><option value="">팀 선택</option><option value="1">1팀</option><option value="2">2팀</option><option value="3">3팀</option><option value="4">4팀</option><option value="5">5팀</option><option value="6">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="의공실">의공실</option><option value="센터">센터</option></select><button class="action-btn" onclick="doRegister()">가입</button><button class="action-btn" style="background:#6c757d" onclick="backToLogin()">취소</button></div>
</div>

<div id="mainApp" style="display:none">
    <div class="header"><span id="statusText">로딩 중...</span><div style="float:right"><button id="adminBtn" onclick="setMode('admin')" style="padding:5px 10px;background:#e67e22;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:12px;display:none">👥 회원관리</button><button onclick="logout()" style="padding:5px 10px;background:#e74c3c;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:12px;margin-left:5px">로그아웃</button></div></div>
    <div class="tabs">
        <div class="tab active" id="tab-equip" onclick="setMode('equip')">장비리스트</div>
        <div class="tab" id="tab-location" onclick="setMode('location')">팀별 장비</div>
        <div class="tab" id="tab-date" onclick="setMode('date')">날짜별 특이사항</div>
        <div class="tab" id="tab-admin" onclick="setMode('admin')" style="display:none">회원관리</div>
    </div>
    <div id="searchBox"></div>
    <div id="topButtons"></div>
    <div id="results"></div>
</div>

<div id="emailModal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
<div id="actionModal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeActionModal()">&times;</span><div id="actionContent"></div></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbyZKxkg1g1_ur5bRHJf0wjqAr1LlMFncW27SSV1nGDk5pLl9Ap9dcym0qXk-AKEd4Op/exec';

const LOCS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터','미선택'];

// ⚠️ 복구된 데이터 매핑
const EMAILS={'조해영':'hy0617.jo@samsung.com','백수빈':'subeen2319.baek@samsung.com','문선미':'sm0316.moon@samsung.com','김보현':'bohyeon6601.kim@samsung.com','김정민':'jm0605.kim@samsung.com','고희진':'heejin3579.ko@samsung.com','이지연':'joanna0812.lee@samsung.com','신수인':'suingss0120.shin@samsung.com','김성현':'seonghyeon402.kim@samsung.com','안황코':'heroboy07@hanmail.net'};
const LUNG={'50601-00770':{model:'NT300E5K-K34S',sn:'0N8V91IHB00202E'},'50601-00771':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00009R'},'50601-00772':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00410Y'},'50601-00773':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00281R'},'50601-00774':{model:'NT300E5K-L26W',sn:'0QP191IU100958E'},'50601-00775':{model:'NT300E5X-AD2S',sn:'HxX391RD100005B'},'50601-00776':{model:'NT300E5C-A39S',sn:'JkMM91DF300107K'},'50601-00822':{model:'NT300E5K-K34S',sn:'0N8V91IHB00226K'},'50601-00823':{model:'NT300E5R-KD3A',sn:'0UMN91JJC00115M'},'50601-00863':{model:'NT300E5K-L26W',sn:'0QP191IU201075D'},'50601-00864':{model:'NT300E5K-L26W',sn:'0QP191IJ200766K'},'50601-00871':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00159Y'},'50601-00872':{model:'NT300E5R-KD3A',sn:'0UMN91CJC00017V'},'50601-00873':{model:'NT300E5X-AD2S',sn:'HxX391PD100015E'},'50601-00949':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00012H'},'50601-00950':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00319X'},'50601-00951':{model:'NT270E5R-KD1S',sn:'JKGK91KFC00086Z'},'50601-00964':{model:'NT300E5K-L26W',sn:'0QP191GJ100332Z'},'50601-00965':{model:'NT300E5K-L26W',sn:'0QP191AJ101068A'},'50601-00966':{model:'NT550EAZ-AD2A',sn:'0WGE91AK800199N'},'50601-00967':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00042E'},'50601-00968':{model:'NT550EAZ-AD2A',sn:'0WGE91AK900074X'},'50601-00969':{model:'NT550EAZ-AD2A',sn:'0WGE91AKC00039D'},'50601-01533':{model:'DM501TGA',sn:'KYTK99YXA0000RZ'},'50601-01534':{model:'DM501TGA',sn:'KYTK99YXA0000BW'},'50601-01535':{model:'DM501TGA',sn:'KYTN99YX90003AH'},'50601-01536':{model:'DM501TGA',sn:'KYTN99YX900034K'},'50601-01537':{model:'NT551XED',sn:'67A29FCX100009Y'},'50601-01538':{model:'NT551XED',sn:'67A29FCX100008J'},'50601-01539':{model:'NT551XED',sn:'67A29FCX100025N'},'50601-01632':{model:'DM501TGA',sn:'L0MM99YY7000ABV'},'50601-01633':{model:'DM501TGA',sn:'L0MM99YY7000JRJ'},'50601-01634':{model:'DM501TGA',sn:'L0MM99YY7000A0X'},'50601-01635':{model:'DM501TGA',sn:'L0MM99YY7000CGF'},'50601-01636':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003P'},'50601-01637':{model:'NT751XGK-K03/C',sn:'KYPD99YY90005F'},'50601-01638':{model:'NT751XGK-K03/C',sn:'KYPD99YY900006'},'50601-01639':{model:'NT751XGK-K03/C',sn:'KYPD99YY90003S'}};
const AUDIO={'50604-00152':'WT109429/WT109430','50604-00153':'WT109528/WT109536','50604-00181':'WT305446/WT305444','50604-00194':'WT402572/WT402584','50604-00195':'WT402783/WT402588','50604-00196':'WT402782/WT402781','50604-00211':'WT482942/WT482966','50604-00212':'WT476053/WT498521','50604-00221':'WT565596/WT558124','50604-00222':'WT550841/WT567270','50604-00233':'WT662399/WT638008','50604-00234':'WT694207/WT699298'};
const COLORS={'청력기':'#667eea','청력부스':'#764ba2','중이기기':'#f093fb','소음계':'#4facfe','원심분리기':'#00f2fe','HRV':'#43e97b','EKG':'#fa709a','폐활량':'#fee140','실린지':'#30cfd0','프린터기':'#a8edea','업무용노트북':'#ff9a9e','와이브로':'#fad0c4','포터블모니터':'#ffecd2'};

let allData=[], mode='equip', currentUser=null, selectedEquipments=new Map(), selectedSender=null;
let currentYear=new Date().getFullYear(), currentMonth=new Date().getMonth()+1;

window.onload=()=>{
    const saved=localStorage.getItem('currentLogin');
    if(saved){currentUser=JSON.parse(saved); document.getElementById('mainApp').style.display='block'; if(currentUser.empId==='218062'){document.getElementById('tab-admin').style.display='block'; document.getElementById('adminBtn').style.display='block'} load(false)}
    else{document.getElementById('loginScreen').style.display='block'}
};

function showLoading(s){document.getElementById('loading').classList.toggle('active',s)}
function setMode(m){mode=m; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+m).classList.add('active'); show()}

async function doLogin(){
    const empId=document.getElementById('loginEmpId').value; const pass=document.getElementById('loginPass').value;
    if(!empId||!pass)return alert('사번/비번 입력');
    showLoading(true);
    try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'login',empId,pass})}); const result=await res.json();
        if(result.success){currentUser=result.user; currentUser.password=pass; localStorage.setItem('currentLogin',JSON.stringify(currentUser)); location.reload()}
        else alert(result.error)}catch(e){alert('로그인 오류')}finally{showLoading(false)}
}
function logout(){localStorage.removeItem('currentLogin'); location.reload()}
function showRegScreen(){document.getElementById('loginScreen').style.display='none'; document.getElementById('regScreen').style.display='block'}
function backToLogin(){document.getElementById('regScreen').style.display='none'; document.getElementById('loginScreen').style.display='block'}
async function doRegister(){const name=document.getElementById('regName').value; const empId=document.getElementById('regEmpId').value; const pass=document.getElementById('regPass').value; const team=document.getElementById('regTeam').value; if(!name||!empId||!pass||!team)return alert('필수 입력'); try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'register',user:{name,empId,pass,team}})}); const r=await res.json(); if(r.success){alert('가입완료'); backToLogin()}else alert(r.error)}catch(e){alert('가입오류')}}

async function load(f){showLoading(true); try{const res=await fetch(API+'?action=generateAll&t='+Date.now()); const data=await res.json(); allData=data.equipment; document.getElementById('statusText').innerText=allData.length+'개 장비 ('+currentUser.name+' - '+currentUser.team+'팀)'; show()}catch(e){alert('로딩실패')}finally{showLoading(false)}}

function show(){
    document.getElementById('searchBox').innerHTML=''; document.getElementById('results').innerHTML=''; document.getElementById('topButtons').innerHTML='';
    if(mode==='equip'){
        const cats=[...new Set(allData.map(e=>e.category))].filter(c=>c&&!c.includes('설문지'));
        document.getElementById('searchBox').innerHTML=`<div class="box"><div class="box-title" id="equipTitle">장비 선택</div><select id="es" onchange="updateLocFilter()"><option value="">선택</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div id="locBox" style="display:none"><div class="box"><div class="box-title" style="background:#e67e22">장소 필터</div><select id="ls" onchange="showEquipList()"></select></div></div>`;
    } else if(mode==='location'){
        document.getElementById('searchBox').innerHTML=`<div class="box"><div class="box-title" style="background:#00b894">장소 선택</div><select id="ls" onchange="showLocationList()"><option value="">선택</option>${LOCS.map(l=>`<option value="${l}">${l}${/^[1-6]$/.test(l)?'팀':''}</option>`).join('')}</select></div>`;
    } else if(mode==='date'){ showCalendar() } else if(mode==='admin'){ showAdminPanel() }
}

function updateLocFilter(){
    const eq=document.getElementById('es').value; if(!eq)return; const title=document.getElementById('equipTitle'); title.innerText=eq; title.style.background=COLORS[eq]||'#9b59b6';
    document.getElementById('locBox').style.display='block';
    const counts={}; LOCS.forEach(l=>{counts[l]=allData.filter(r=>r.category===eq && parseCurrentLocation(r).location===l).length});
    document.getElementById('ls').innerHTML='<option value="">선택</option><option value="전체">전체</option>'+LOCS.map(l=>`<option value="${l}">${l}${/^[1-6]$/.test(l)?'팀':''} (${counts[l]}개)</option>`).join('');
}
function showEquipList(){ renderList(allData.filter(r=>r.category===document.getElementById('es').value && (document.getElementById('ls').value==='전체' || parseCurrentLocation(r).location===document.getElementById('ls').value)))}
function showLocationList(){ renderList(allData.filter(r=>parseCurrentLocation(r).location===document.getElementById('ls').value))}

function renderList(found){
    if(found.length===0){document.getElementById('results').innerHTML='<p style="text-align:center;padding:20px">장비 없음</p>'; return}
    let html='<div class="btn-group"><button class="select-btn" onclick="selectAll(true)">✓ 전체선택</button><button class="select-btn deselect" onclick="selectAll(false)">✗ 전체해제</button></div>';
    html+=found.map(r=>{
        const loc=parseCurrentLocation(r); const isChecked=selectedEquipments.has(r.assetNo)?'checked':''; const color=COLORS[r.category]||'#00b894';
        let detail = `S/N: ${r.serial||'미기록'}`;
        if(r.category==='폐활량' && LUNG[r.assetNo]) detail += ` (노트북: ${LUNG[r.assetNo].model})`;
        if(r.category==='청력기' && AUDIO[r.assetNo]) detail += ` (H/D: ${AUDIO[r.assetNo]})`;
        return `<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-asset="${r.assetNo}" data-info='${JSON.stringify({assetNo:r.assetNo,category:r.category,name:r.category,model:r.model||'',serial:r.serial||''})}' onchange="updateSelection()" ${isChecked}><div class="card"><div class="card-title" style="color:${color}">${r.category} / ${r.assetNo}</div><div style="font-size:12px;color:#666">${detail}</div><div class="card-divider"></div><div class="card-memo">${r.currentDetail||'특이사항 없음'}</div></div></div>`;
    }).join('');
    document.getElementById('results').innerHTML=html;
}

function selectAll(c){ document.querySelectorAll('.equipment-checkbox').forEach(b=>{b.checked=c}); updateSelection()}
function updateSelection(){
    document.querySelectorAll('.equipment-checkbox').forEach(b=>{
        if(b.checked) selectedEquipments.set(b.dataset.asset, JSON.parse(b.dataset.info));
        else selectedEquipments.delete(b.dataset.asset);
    });
    renderTopButtons();
}
function renderTopButtons(){
    const area=document.getElementById('topButtons'); if(selectedEquipments.size===0){area.innerHTML=''; return}
    area.innerHTML=`<div class="box" style="position:sticky;top:0;z-index:10;background:#fff9f0;border:2px solid #e67e22"><div style="font-weight:bold;margin-bottom:10px">선택됨: ${selectedEquipments.size}개</div><div style="display:flex;gap:10px"><button class="action-btn-small" style="flex:1" onclick="showActionModal()">작업 등록</button><button class="action-btn-small" style="flex:1;background:#3498db" onclick="showEmailModal()">📧 메일전송</button></div></div>`;
}

// ⚠️ 등록 로직 (요청하신 포맷 적용)
function showActionModal(){
    let html=`<div style="font-weight:bold;font-size:18px;margin-bottom:20px">작업 선택</div>`;
    const actions=['수령','수령예정','반납','보유'];
    actions.forEach(a=>{ html+=`<button class="action-btn" onclick="openFinalForm('${a}')">${a}</button>`});
    document.getElementById('actionContent').innerHTML=html; document.getElementById('actionModal').style.display='block';
}
function openFinalForm(action){
    let html=`<div style="font-weight:bold;font-size:18px;margin-bottom:20px">${action} 정보 입력</div><label>담당자: ${currentUser.name}</label><select id="actionTeam">${LOCS.map(l=>`<option value="${l}" ${currentUser.team===l?'selected':''}>${l}${/^[1-6]$/.test(l)?'팀':''}</option>`).join('')}</select><input type="text" id="actionMemo" placeholder="특이사항(없으면 비움)"><button class="action-btn" style="background:#27ae60" onclick="submitAction('${action}')">확인 등록</button>`;
    document.getElementById('actionContent').innerHTML=html;
}
async function submitAction(action){
    const team=document.getElementById('actionTeam').value; const memo=document.getElementById('actionMemo').value.trim()||'특이사항 없음';
    const now=new Date(); const dateStr=(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0');
    const teamLabel=/^[1-6]$/.test(team)?team+'팀':team;
    
    // 04/11 5팀 수령 (김민철 - 특이사항 없음)
    const cellValue=`${dateStr} ${teamLabel} ${action} (${currentUser.name} - ${memo})`;
    const newLoc=`${teamLabel} (${dateStr})`;

    const entries=Array.from(selectedEquipments.values()).map(e=>({category:e.category, assetNo:e.assetNo, newLocation:newLoc, cellValue:cellValue}));
    showLoading(true);
    try{const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'update',entries})}); const r=await res.json(); if(r.success){alert('완료'); location.reload()} else alert(r.error)}catch(e){alert('오류')}finally{showLoading(false)}
}

// ⚠️ 메일 전송 로직 (복구됨)
function showEmailModal(){
    selectedSender=null;
    let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">발신자 선택</div>';
    html+=Object.keys(EMAILS).map(n=>`<button class="recipient-btn" onclick="selectSender('${n}')">${n}</button>`).join('');
    document.getElementById('modalContent').innerHTML=html; document.getElementById('emailModal').style.display='block';
}
function selectSender(n){
    selectedSender=n;
    let html=`<div style="margin-bottom:15px;color:#27ae60;font-weight:bold">📤 발신: ${n}</div><div style="font-weight:bold;font-size:18px;margin-bottom:20px">수신자 선택</div>`;
    html+=Object.keys(EMAILS).map(rn=>`<button class="recipient-btn" onclick="sendEmail('${rn}')">${rn}</button>`).join('');
    document.getElementById('modalContent').innerHTML=html;
}
async function sendEmail(rn){
    document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px">메일 생성 중...</div>';
    try{
        const list=Array.from(selectedEquipments.values()).map((e,i)=>{
            let model=e.model, sn=e.serial;
            if(e.category==='폐활량' && LUNG[e.assetNo]){ model=LUNG[e.assetNo].model; sn=LUNG[e.assetNo].sn }
            return {'순번':i+1,'기기명':e.category,'자산번호':e.assetNo,'모델':model,'S/N':sn};
        });
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(list),'장비목록');
        const b64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
        await fetch(MAIL_API,{method:'POST',mode:'no-cors',body:JSON.stringify({recipient:EMAILS[rn],sender:EMAILS[selectedSender],senderName:selectedSender,excelBase64:b64,fileName:`장비목록_${new Date().toISOString().slice(0,10)}.xlsx`})});
        alert('전송 완료'); closeModal();
    }catch(e){alert('전송실패')}
}

// 달력 및 관리자 기능
function showCalendar(){
    const searchArea=document.getElementById('searchBox');
    searchArea.innerHTML=`<div class="box"><div class="box-title" style="background:#764ba2">날짜별 기록</div><div class="month-nav"><button onclick="changeMonth(-1)">◀</button><span>${currentYear}년 ${currentMonth}월</span><button onclick="changeMonth(1)">▶</button></div><div class="calendar" id="calendarGrid"></div></div>`;
    const grid=document.getElementById('calendarGrid'); grid.innerHTML=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-header">${d}</div>`).join('');
    const first=new Date(currentYear, currentMonth-1, 1).getDay(); const last=new Date(currentYear, currentMonth, 0).getDate();
    for(let i=0;i<first;i++) grid.innerHTML+='<div class="cal-day"></div>';
    for(let d=1;d<=last;d++){
        const dateKey=`${currentMonth.toString().padStart(2,'0')}/${d.toString().padStart(2,'0')}`;
        const hasIssue=allData.some(r=>(r.currentDetail||'').includes(dateKey));
        grid.innerHTML+=`<div class="cal-day ${hasIssue?'issue':''}" onclick="showDateDetail('${dateKey}')">${d}</div>`;
    }
}
function changeMonth(v){ currentMonth+=v; if(currentMonth>12){currentMonth=1;currentYear++} if(currentMonth<1){currentMonth=12;currentYear--} showCalendar()}
function showDateDetail(date){
    const items=allData.filter(r=>(r.currentDetail||'').includes(date)); if(items.length===0) return;
    document.getElementById('modalContent').innerHTML=`<div style="font-weight:bold;margin-bottom:15px">${date} 기록</div>`+items.map(r=>`<div style="padding:10px;border-bottom:1px solid #eee;font-size:13px"><b>${r.category}</b>: ${r.currentDetail}</div>`).join('');
    document.getElementById('emailModal').style.display='block';
}
async function showAdminPanel(){
    document.getElementById('results').innerHTML='로딩...';
    try{const res=await fetch(API+'?action=getUsers'); const users=await res.json();
        document.getElementById('results').innerHTML='<div class="box">'+users.map(u=>`<div style="padding:10px;border-bottom:1px solid #eee">${u.name}(${u.empId}) - ${u.team}팀</div>`).join('')+'</div>';
    }catch(e){alert('오류')}
}
function parseCurrentLocation(row){
    const v=row.location||''; if(v.includes('아산1')) return {location:'아산1'}; if(v.includes('평택')) return {location:'평택'}; if(v.includes('수원')) return {location:'수원'};
    const m=v.toString().match(/([1-6])팀?/); return m?{location:m[1]}:{location:v.toString().split(' ')[0]||'미선택'};
}
function closeModal(){document.getElementById('emailModal').style.display='none'}
function closeActionModal(){document.getElementById('actionModal').style.display='none'}
</script>
