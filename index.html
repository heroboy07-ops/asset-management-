<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>장비 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;max-width:480px;margin:0 auto;min-height:100vh}
.screen{display:none}.screen.active{display:block}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
.login-box{background:#fff;border-radius:20px;padding:40px 32px;width:100%;max-width:360px;margin:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{font-size:22px;color:#0f3460;margin-bottom:6px;text-align:center}
.login-box p{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#0f3460}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary{background:#0f3460;color:#fff}.btn-secondary{background:#f1f5f9;color:#0f3460;border:1.5px solid #0f3460}
#loginError{color:#e53e3e;font-size:13px;text-align:center;margin-bottom:8px;display:none;font-weight:600;padding:8px;background:#fff5f5;border-radius:8px}
.header{background:#0f3460;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.user-info{font-size:11px;opacity:.85}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.select-bar{background:#0a2540;color:#fff;padding:10px 16px;display:none;align-items:center;justify-content:space-between;position:sticky;top:57px;z-index:99}
.select-bar.active{display:flex}
.sel-btn{padding:6px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;position:sticky;top:57px;z-index:98}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:14px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:#0f3460;border-bottom-color:#0f3460}
.filter-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:20px;border:1.5px solid #e0e0e0;font-size:13px;cursor:pointer;white-space:nowrap;background:#fff;color:#555}
.filter-chip.active{background:#0f3460;color:#fff;border-color:#0f3460}
.search-bar{padding:12px 16px;background:#fff;border-bottom:1px solid #f0f0f0}
.search-bar input{width:100%;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none}
.equipment-list{padding:12px 16px;padding-bottom:100px}
.loading{text-align:center;padding:40px;color:#888;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#0f3460;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.equip-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;border-left:4px solid #0f3460}
.equip-card.selected{background:#e8f0ff}
.equip-check{width:24px;height:24px;border-radius:50%;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:#2563eb;margin-top:2px}
.equip-card.selected .equip-check{background:#2563eb;border-color:#2563eb;color:#fff}
.equip-info{flex:1;min-width:0}
.equip-name{font-weight:700;font-size:15px;color:#1a1a2e;margin-bottom:3px}
.equip-asset{font-size:12px;color:#888;margin-bottom:2px}
.equip-sub{font-size:11px;color:#666;margin-top:2px}
.equip-right{text-align:right;flex-shrink:0}
.equip-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-수령{background:#dbeafe;color:#1d4ed8}.status-반납{background:#fef3c7;color:#92400e}
.status-보유{background:#d1fae5;color:#065f46}.status-수령예정{background:#ede9fe;color:#5b21b6}
.email-btn{margin-top:6px;padding:4px 8px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;font-size:11px;cursor:pointer;color:#555}
.team-section{margin-bottom:12px}
.team-header{font-size:13px;font-weight:700;color:#0f3460;padding:8px 12px;background:#e8f0ff;border-radius:8px;margin-bottom:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:18px;font-weight:700;color:#0f3460;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#888;line-height:1}
.action-section{margin-bottom:16px}
.action-section label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:8px}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.radio-btn{padding:8px 14px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-weight:500}
.radio-btn.active{background:#0f3460;color:#fff;border-color:#0f3460}
.sel-list{background:#f8f9fa;border-radius:10px;padding:10px;margin-bottom:16px;max-height:120px;overflow-y:auto}
.sel-list .item{font-size:13px;padding:4px 0;border-bottom:1px solid #eee;color:#333}
.sel-list .item:last-child{border:none}
.pending-card{background:#f8f9fa;border-radius:10px;padding:14px;margin-bottom:10px}
.pending-card .pname{font-weight:700;font-size:15px;margin-bottom:4px}
.pending-card .pinfo{font-size:12px;color:#888;margin-bottom:10px}
.pbtns{display:flex;gap:8px}
.pbtn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
#dateBackBtn{display:none;background:#0f3460;color:#fff;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;position:sticky;top:57px;z-index:100}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;transition:transform .3s;white-space:nowrap;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h1>장비 관리 시스템</h1>
    <p>사번과 비밀번호로 로그인</p>
    <div id="loginError">사번 또는 비밀번호가 틀렸습니다</div>
    <div class="form-group"><label>사번</label><input type="text" id="loginId" placeholder="사번 입력" autocomplete="off"></div>
    <div class="form-group"><label>비밀번호</label><input type="password" id="loginPw" placeholder="비밀번호 입력"></div>
    <button class="btn btn-primary" id="loginBtn">로그인</button>
    <button class="btn btn-secondary" id="openRegBtn" style="margin-top:10px">회원가입</button>
    <p style="font-size:11px;color:#ccc;text-align:center;margin-top:10px">첫 가입자가 자동으로 관리자가 됩니다</p>
  </div>
</div>

<div class="modal-overlay" id="regModal">
  <div class="modal">
    <button class="modal-close" id="closeRegBtn">&times;</button>
    <h2>회원가입</h2>
    <div class="form-group"><label>사번</label><input type="text" id="regId" placeholder="사번 입력"></div>
    <div class="form-group"><label>이름</label><input type="text" id="regName" placeholder="이름 입력"></div>
    <div class="form-group"><label>비밀번호</label><input type="password" id="regPw" placeholder="비밀번호 입력"></div>
    <div class="form-group"><label>소속팀</label>
      <select id="regTeam">
        <option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option>
        <option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option>
        <option value="수원">수원</option><option value="평택">평택</option><option value="아산1">아산1</option>
        <option value="사무실">사무실</option><option value="의공실">의공실</option><option value="센터">센터</option>
      </select>
    </div>
    <button class="btn btn-primary" id="submitRegBtn">가입 신청</button>
  </div>
</div>

<div id="mainScreen" class="screen">
  <div class="header">
    <h1>장비 관리</h1>
    <div class="header-right">
      <span class="user-info" id="userInfoText"></span>
      <button class="icon-btn" id="editOpenBtn">수정</button>
      <button class="icon-btn" id="adminOpenBtn" style="display:none">관리</button>
      <button class="icon-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="select-bar" id="selectBar">
    <span id="selectCount">0개 선택</span>
    <div style="display:flex;gap:8px">
      <button class="sel-btn" style="background:#27ae60;color:#fff" id="processSelBtn">처리</button>
      <button class="sel-btn" style="background:#e74c3c;color:#fff" id="cancelSelBtn">취소</button>
    </div>
  </div>
  <div id="dateBackBtn">← 달력으로 돌아가기</div>
  <div class="tabs" id="tabBar">
    <div class="tab active" data-tab="equip">장비별</div>
    <div class="tab" data-tab="team">팀별</div>
    <div class="tab" data-tab="date">날짜별</div>
  </div>
  <div id="equipTab">
    <div class="filter-bar" id="catFilter"></div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="자산번호, 기기명 검색..."></div>
    <div class="equipment-list" id="equipList"><div class="loading"><div class="spinner"></div>장비 데이터 로딩 중...</div></div>
  </div>
  <div id="teamTab" style="display:none">
    <div class="filter-bar" id="teamFilter"></div>
    <div class="equipment-list" id="teamList"></div>
  </div>
  <div id="dateTab" style="display:none;padding-bottom:80px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eee">
      <button id="calPrevBtn" style="border:none;background:none;font-size:26px;cursor:pointer;color:#0f3460;padding:0 8px">&#8249;</button>
      <div id="calTitle" style="font-weight:700;font-size:16px;color:#0f3460"></div>
      <button id="calNextBtn" style="border:none;background:none;font-size:26px;cursor:pointer;color:#0f3460;padding:0 8px">&#8250;</button>
    </div>
    <div id="calGrid" style="padding:8px 12px"></div>
    <div id="calLegend" style="padding:4px 12px 8px"></div>
    <div id="calDetail" style="padding:12px 16px"></div>
  </div>
  <div class="modal-overlay" id="actionModal">
    <div class="modal">
      <button class="modal-close" id="closeActionBtn">&times;</button>
      <h2>수령/반납 처리</h2>
      <div class="sel-list" id="selList"></div>
      <div class="action-section">
        <label>처리 유형</label>
        <div class="radio-group" id="actionType">
          <button class="radio-btn active" data-val="수령">수령</button>
          <button class="radio-btn" data-val="반납">반납</button>
          <button class="radio-btn" data-val="보유">보유</button>
          <button class="radio-btn" data-val="수령예정">수령예정</button>
        </div>
      </div>
      <div class="action-section" id="teamSec">
        <label>팀 / 위치</label>
        <select id="actionTeam">
          <option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option>
          <option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option>
          <option value="수원">수원</option><option value="평택">평택</option><option value="아산1">아산1</option>
          <option value="사무실">사무실</option><option value="의공실">의공실</option><option value="센터">센터</option>
        </select>
      </div>
      <div class="action-section" id="returnSec" style="display:none">
        <label>반납 사유</label>
        <div class="radio-group" id="returnReason">
          <button class="radio-btn active" data-val="팀해체">팀해체</button>
          <button class="radio-btn" data-val="장비점검">장비점검</button>
          <button class="radio-btn" data-val="폐기">폐기</button>
          <button class="radio-btn" data-val="의공실">의공실</button>
          <button class="radio-btn" data-val="기타">기타</button>
        </div>
        <input type="text" id="returnCustom" placeholder="기타 사유" style="margin-top:10px;width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;display:none;outline:none">
      </div>
      <div class="action-section">
        <label>특이사항</label>
        <div class="radio-group" id="noteType">
          <button class="radio-btn active" data-val="없음">특이사항 없음</button>
          <button class="radio-btn" data-val="있음">특이사항 있음</button>
        </div>
        <input type="text" id="noteCustom" placeholder="특이사항 입력" style="margin-top:10px;width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;display:none;outline:none">
      </div>
      <button class="btn btn-primary" id="submitActionBtn" style="margin-top:8px">확인</button>
    </div>
  </div>
  <div class="modal-overlay" id="emailModal">
    <div class="modal">
      <button class="modal-close" id="closeEmailBtn">&times;</button>
      <h2>이메일 전송</h2>
      <div class="form-group"><label>받는 사람</label><input type="email" id="emailTo" placeholder="이메일 주소"></div>
      <div class="form-group"><label>제목</label><input type="text" id="emailSubject"></div>
      <div class="form-group"><label>내용</label><textarea id="emailBody" rows="5" style="width:100%;padding:10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;resize:vertical;outline:none"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" id="submitEmailBtn" style="flex:1;margin-top:0">앱스크립트 전송</button>
        <button class="btn btn-secondary" id="mailtoBtn" style="flex:1;margin-top:0">메일앱으로 열기</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <button class="modal-close" id="closeAdminBtn">&times;</button>
      <h2>가입 승인 관리</h2>
      <div id="pendingList"></div>
    </div>
  </div>
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <button class="modal-close" id="closeEditBtn">&times;</button>
      <h2>정보 수정</h2>
      <div class="form-group"><label>소속팀</label>
        <select id="editTeam">
          <option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option>
          <option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option>
          <option value="수원">수원</option><option value="평택">평택</option><option value="아산1">아산1</option>
          <option value="사무실">사무실</option><option value="의공실">의공실</option><option value="센터">센터</option>
        </select>
      </div>
      <div class="form-group"><label>새 비밀번호 (변경시만)</label><input type="password" id="editPw" placeholder="비밀번호 입력"></div>
      <button class="btn btn-primary" id="submitEditBtn">수정 완료</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxjVYcgEiBP_GjtLtXQ9rQyOkVDYPjjeEt_raw2lu_2RJuDY3tQ2NMPjObzBoTA-1tI/exec';
var TEAMS=['1팀','2팀','3팀','4팀','5팀','6팀','수원','평택','아산1','사무실','의공실','센터'];
var CATS=['전체','청력기','청력부스','중이기기','소음계','원심분리기','HRV','EKG','폐활량','실린지','프린터기','업무용노트북','와이브로','포터블모니터'];
var CAT_COLORS={'청력기':'#2563eb','청력부스':'#60a5fa','중이기기':'#16a34a','소음계':'#f59e0b','원심분리기':'#7c3aed','HRV':'#0891b2','EKG':'#db2777','폐활량':'#dc2626','실린지':'#ea580c','프린터기':'#64748b','업무용노트북':'#1e3a5f','와이브로':'#0d9488','포터블모니터':'#9333ea'};
var TEAM_COLORS={'1팀':'#2563eb','2팀':'#16a34a','3팀':'#dc2626','4팀':'#7c3aed','5팀':'#ea580c','6팀':'#0891b2','수원':'#f59e0b','평택':'#db2777','아산1':'#0d9488','사무실':'#64748b','의공실':'#9333ea','센터':'#1e3a5f'};
var HS={'50604-00152':{m:'SA-203',s:'WT109429/WT109430'},'50604-00153':{m:'SA-203',s:'WT109431/WT109432'},'50604-00154':{m:'SA-203',s:'WT109433/WT109434'},'50604-00155':{m:'SA-203',s:'WT109435/WT109436'},'50604-00156':{m:'SA-203',s:'WT109437/WT109438'},'50604-00157':{m:'SA-203',s:'WT109439/WT109440'},'50604-00158':{m:'SA-203',s:'WT109441/WT109442'},'50604-00159':{m:'SA-203',s:'WT109443/WT109444'},'50604-00160':{m:'SA-203',s:'WT109445/WT109446'},'50604-00161':{m:'SA-203',s:'WT109447/WT109448'},'50604-00162':{m:'SA-203',s:'WT109449/WT109450'},'50604-00163':{m:'SA-203',s:'WT109451/WT109452'}};
var currentUser=null,allEquip=[],selectedIds=[],catFilter='전체',teamFilter='전체',actionType='수령',returnReason='팀해체',noteType='없음',emailTarget=null,dataLoaded=false,calYear=new Date().getFullYear(),calMonth=new Date().getMonth();

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function openModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function api(params,cb){var url=SCRIPT_URL+'?'+Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');fetch(url).then(function(r){return r.json();}).then(cb).catch(function(e){cb({status:'error',msg:String(e)});});}
function getUsers(){try{return JSON.parse(localStorage.getItem('EQu')||'[]');}catch(e){return[];}}
function saveUsers(u){localStorage.setItem('EQu',JSON.stringify(u));}
function getEqStatus(){try{return JSON.parse(localStorage.getItem('EQs')||'{}');}catch(e){return{};}}
function saveEqStatus(s){localStorage.setItem('EQs',JSON.stringify(s));}

function doLogin(){
  var id=document.getElementById('loginId').value.trim();
  var pw=document.getElementById('loginPw').value;
  var err=document.getElementById('loginError');
  err.style.display='none';
  if(!id||!pw){toast('사번과 비밀번호를 입력하세요');return;}
  var users=getUsers();
  // 유저가 없으면 회원가입 안내
  if(users.length===0){
    err.textContent='계정이 없습니다. 회원가입 버튼을 눌러 가입하세요.';
    err.style.display='block';
    return;
  }
  for(var i=0;i<users.length;i++){
    if(users[i].id===id&&users[i].pw===pw){
      if(!users[i].approved){toast('관리자 승인 대기 중입니다');return;}
      currentUser={id:users[i].id,name:users[i].name,team:users[i].team,isAdmin:!!users[i].isAdmin};
      showMain();return;
    }
  }
  err.textContent='사번 또는 비밀번호가 틀렸습니다';
  err.style.display='block';
}

function doRegister(){
  var id=document.getElementById('regId').value.trim();
  var name=document.getElementById('regName').value.trim();
  var pw=document.getElementById('regPw').value;
  var team=document.getElementById('regTeam').value;
  if(!id||!name||!pw){toast('모든 항목을 입력하세요');return;}
  var users=getUsers();
  for(var i=0;i<users.length;i++){if(users[i].id===id){toast('이미 존재하는 사번입니다');return;}}
  var isFirst=users.length===0;
  users.push({id:id,name:name,pw:pw,team:team,approved:isFirst,isAdmin:isFirst});
  saveUsers(users);
  closeModal('regModal');
  if(isFirst){
    currentUser={id:id,name:name,team:team,isAdmin:true};
    showMain();
    toast('관리자 계정으로 로그인됐습니다');
  }else{
    toast('가입 신청 완료. 관리자 승인 후 로그인 가능합니다.');
  }
}

function showLogin(){
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('loginId').value='';
  document.getElementById('loginPw').value='';
  document.getElementById('loginError').style.display='none';
}

function showMain(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  document.getElementById('userInfoText').textContent=(currentUser.name||'')+' ('+currentUser.team+')';
  document.getElementById('adminOpenBtn').style.display=currentUser.isAdmin?'inline-block':'none';
  buildCatFilter();buildTeamFilter();
  if(!dataLoaded)loadData();else renderEquipList();
}

function loadData(){
  document.getElementById('equipList').innerHTML='<div class="loading"><div class="spinner"></div>장비 데이터 로딩 중...</div>';
  api({action:'generateAll'},function(data){
    if(!data||data.status==='error'){
      document.getElementById('equipList').innerHTML='<div class="loading" style="color:#c00">연결 실패<br><small>'+(data&&data.msg||'URL 확인')+'</small><br><br><button onclick="loadData()" style="padding:8px 16px;background:#0f3460;color:#fff;border:none;border-radius:8px;cursor:pointer">다시 시도</button></div>';
      return;
    }
    var items=data.equipment||data||[];
    var saved=getEqStatus();
    items.forEach(function(item){
      if(!item.status)item.status='보유';
      if(item.category==='청력기'&&HS[item.assetNo]){item.headsetModel=HS[item.assetNo].m;item.headsetSerial=HS[item.assetNo].s;}
      if(saved[item.assetNo]){var s=saved[item.assetNo];item.status=s.status||item.status;item.location=s.location||item.location;item.lastUser=s.lastUser||'';item.lastNote=s.lastNote||'';item.lastAction=s.lastAction||'';}
    });
    allEquip=items;dataLoaded=true;renderEquipList();toast(items.length+'개 장비 로드 완료');
  });
}

function buildCatFilter(){
  var bar=document.getElementById('catFilter');bar.innerHTML='';
  CATS.forEach(function(c){
    var chip=document.createElement('div');chip.className='filter-chip'+(c==='전체'?' active':'');chip.textContent=c;
    chip.onclick=function(){document.querySelectorAll('#catFilter .filter-chip').forEach(function(x){x.classList.remove('active');});chip.classList.add('active');catFilter=c;renderEquipList();};
    bar.appendChild(chip);
  });
}

function buildTeamFilter(){
  var bar=document.getElementById('teamFilter');bar.innerHTML='';
  ['전체'].concat(TEAMS).forEach(function(t){
    var chip=document.createElement('div');chip.className='filter-chip'+(t==='전체'?' active':'');chip.textContent=t;
    chip.onclick=function(){document.querySelectorAll('#teamFilter .filter-chip').forEach(function(x){x.classList.remove('active');});chip.classList.add('active');teamFilter=t;renderTeamList();};
    bar.appendChild(chip);
  });
}

function getFiltered(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase();
  return allEquip.filter(function(item){
    var catOk=catFilter==='전체'||item.category===catFilter;
    var qOk=!q||(item.name&&item.name.toLowerCase().indexOf(q)>=0)||(item.assetNo&&item.assetNo.toLowerCase().indexOf(q)>=0);
    return catOk&&qOk;
  });
}

function renderEquipList(){
  var list=document.getElementById('equipList');
  var items=getFiltered();
  if(!items.length){list.innerHTML='<div class="loading" style="color:#aaa">장비 없음</div>';return;}
  list.innerHTML='';
  items.forEach(function(item){list.appendChild(makeCard(item,'cat'));});
}

function renderTeamList(){
  var list=document.getElementById('teamList');list.innerHTML='';
  var teams=teamFilter==='전체'?TEAMS:[teamFilter];
  var found=false;
  teams.forEach(function(t){
    var items=allEquip.filter(function(i){return i.location===t;});
    if(!items.length)return;found=true;
    var sec=document.createElement('div');sec.className='team-section';
    sec.innerHTML='<div class="team-header">'+esc(t)+' ('+items.length+'대)</div>';
    items.forEach(function(item){sec.appendChild(makeCard(item,'team'));});
    list.appendChild(sec);
  });
  if(!found)list.innerHTML='<div class="loading" style="color:#aaa">해당 팀 장비 없음</div>';
}

function makeCard(item,colorMode){
  var card=document.createElement('div');
  var isSel=selectedIds.indexOf(item.assetNo)>=0;
  card.className='equip-card'+(isSel?' selected':'');
  var accent=colorMode==='team'?(TEAM_COLORS[item.location]||'#0f3460'):(CAT_COLORS[item.category]||'#0f3460');
  card.style.borderLeftColor=accent;
  var sub='';
  if(item.headsetModel)sub='헤드셋: '+item.headsetModel+' / '+item.headsetSerial;
  if(item.notebookInfo)sub='노트북: '+item.notebookInfo;
  card.innerHTML='<div class="equip-check">'+(isSel?'✓':'')+'</div>'+
    '<div class="equip-info">'+
      '<div class="equip-name">'+esc(item.name)+'</div>'+
      '<div class="equip-asset">자산번호: '+esc(item.assetNo)+' | '+esc(item.location||'-')+'</div>'+
      (item.lastAction?'<div class="equip-sub" style="color:#0f3460;font-size:11px">'+esc(item.lastAction)+'</div>':'')+
      (sub?'<div class="equip-sub">'+esc(sub)+'</div>':'')+
    '</div>'+
    '<div class="equip-right">'+
      '<div class="equip-status status-'+esc(item.status||'보유')+'">'+esc(item.status||'보유')+'</div>'+
      '<button class="email-btn">✉ 메일</button>'+
    '</div>';
  card.querySelector('.email-btn').onclick=function(e){e.stopPropagation();openEmailModal(item.assetNo);};
  card.onclick=function(){toggleSel(item.assetNo,card);};
  return card;
}

function toggleSel(assetNo,card){
  var idx=selectedIds.indexOf(assetNo);
  if(idx>=0){selectedIds.splice(idx,1);card.classList.remove('selected');card.querySelector('.equip-check').textContent='';}
  else{selectedIds.push(assetNo);card.classList.add('selected');card.querySelector('.equip-check').textContent='✓';}
  updateSelBar();
}

function updateSelBar(){
  var bar=document.getElementById('selectBar');
  if(selectedIds.length>0){bar.classList.add('active');document.getElementById('selectCount').textContent=selectedIds.length+'개 선택';}
  else bar.classList.remove('active');
}

function clearSel(){
  selectedIds=[];
  document.querySelectorAll('.equip-card.selected').forEach(function(c){c.classList.remove('selected');var chk=c.querySelector('.equip-check');if(chk)chk.textContent='';});
  updateSelBar();
}

function openActionModal(){
  if(!selectedIds.length){toast('장비를 선택하세요');return;}
  actionType='수령';returnReason='팀해체';noteType='없음';
  document.querySelectorAll('#actionType .radio-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('#actionType .radio-btn[data-val="수령"]').classList.add('active');
  document.querySelectorAll('#returnReason .radio-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('#returnReason .radio-btn[data-val="팀해체"]').classList.add('active');
  document.querySelectorAll('#noteType .radio-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('#noteType .radio-btn[data-val="없음"]').classList.add('active');
  document.getElementById('returnSec').style.display='none';
  document.getElementById('teamSec').style.display='block';
  document.getElementById('returnCustom').style.display='none';
  document.getElementById('noteCustom').style.display='none';
  document.getElementById('returnCustom').value='';
  document.getElementById('noteCustom').value='';
  document.getElementById('actionTeam').value=currentUser.team;
  var sl=document.getElementById('selList');sl.innerHTML='';
  selectedIds.forEach(function(id){
    var item=allEquip.filter(function(e){return e.assetNo===id;})[0];
    var div=document.createElement('div');div.className='item';div.textContent=item?(item.name+' ('+id+')'):id;sl.appendChild(div);
  });
  openModal('actionModal');
}

function submitAction(){
  var team=document.getElementById('actionTeam').value;
  var note=noteType==='없음'?'특이사항 없음':(document.getElementById('noteCustom').value||'특이사항 있음');
  var rr=returnReason==='기타'?(document.getElementById('returnCustom').value||'기타'):returnReason;
  var entries=[];
  var now=new Date();var mm=('0'+(now.getMonth()+1)).slice(-2);var dd=('0'+now.getDate()).slice(-2);var dateStr=mm+'/'+dd;
  selectedIds.forEach(function(assetNo){
    var item=allEquip.filter(function(e){return e.assetNo===assetNo;})[0];if(!item)return;
    var newLoc=actionType==='반납'?(rr==='의공실'?'의공실':'사무실'):team;
    var cellValue=actionType==='반납'?team+' 반납 (반납사유-'+rr+'/'+currentUser.name+'-'+note+')':team+' '+actionType+' ('+currentUser.name+'-'+note+')';
    var actionStr=newLoc+' '+actionType+' ('+dateStr+') - '+currentUser.name+' ('+note+')';
    item.status=actionType;item.location=newLoc;item.lastUser=currentUser.name;item.lastNote=note;item.lastAction=actionStr;
    entries.push({category:item.category,assetNo:assetNo,action:actionType,team:team,newLocation:newLoc,cellValue:cellValue,userName:currentUser.name,note:note,returnReason:rr});
  });
  var saved=getEqStatus();
  entries.forEach(function(e){saved[e.assetNo]={status:e.action,location:e.newLocation,lastUser:e.userName,lastNote:e.note,lastAction:e.newLocation+' '+e.action+' ('+dateStr+') - '+e.userName+' ('+e.note+')'}; });
  saveEqStatus(saved);
  closeModal('actionModal');clearSel();renderEquipList();toast('처리 완료');
  api({action:'update',data:JSON.stringify(entries)},function(data){if(data&&data.status==='ok')toast('시트 기록 완료');});
}

function openEmailModal(assetNo){
  emailTarget=allEquip.filter(function(e){return e.assetNo===assetNo;})[0];if(!emailTarget)return;
  var item=emailTarget;var d=new Date();
  document.getElementById('emailSubject').value='[장비 알림] '+item.name+' ('+item.assetNo+') - '+(d.getMonth()+1)+'/'+d.getDate();
  var body='장비명: '+item.name+'\n자산번호: '+item.assetNo+'\n카테고리: '+(item.category||'-')+'\n현재위치: '+(item.location||'-')+'\n상태: '+(item.status||'보유');
  if(item.lastNote&&item.lastNote!=='특이사항 없음')body+='\n특이사항: '+item.lastNote;
  if(item.lastUser)body+='\n처리자: '+item.lastUser;
  body+='\n\n---\n장비관리 앱 자동 발송';
  document.getElementById('emailBody').value=body;document.getElementById('emailTo').value='';
  openModal('emailModal');
}

function submitEmail(){
  var to=document.getElementById('emailTo').value.trim();if(!to){toast('이메일 주소를 입력하세요');return;}
  api({action:'sendEmail',to:to,subject:document.getElementById('emailSubject').value,body:document.getElementById('emailBody').value},function(data){
    if(data&&data.status==='ok'){toast('전송 완료');closeModal('emailModal');}else toast('전송 실패 - 메일앱으로 열기를 사용하세요');
  });
}

function openMailto(){
  var to=document.getElementById('emailTo').value.trim();
  window.location.href='mailto:'+to+'?subject='+encodeURIComponent(document.getElementById('emailSubject').value)+'&body='+encodeURIComponent(document.getElementById('emailBody').value);
  closeModal('emailModal');
}

function renderPending(){
  var container=document.getElementById('pendingList');
  var users=getUsers();var pending=users.filter(function(u){return !u.approved;});
  if(!pending.length){container.innerHTML='<p style="text-align:center;padding:20px;color:#888">대기 없음</p>';return;}
  container.innerHTML='';
  pending.forEach(function(u){
    var card=document.createElement('div');card.className='pending-card';
    card.innerHTML='<div class="pname">'+esc(u.name)+'</div><div class="pinfo">사번: '+esc(u.id)+' | 팀: '+esc(u.team)+'</div>'+
      '<div class="pbtns"><button class="pbtn" style="background:#0f3460;color:#fff" onclick="doApprove(\''+esc(u.id)+'\',true)">승인</button>'+
      '<button class="pbtn" style="background:#e53e3e;color:#fff" onclick="doApprove(\''+esc(u.id)+'\',false)">거부</button></div>';
    container.appendChild(card);
  });
}

function doApprove(userId,approve){
  var users=getUsers();
  if(approve){for(var i=0;i<users.length;i++){if(users[i].id===userId){users[i].approved=true;break;}}}
  else{users=users.filter(function(u){return u.id!==userId;});}
  saveUsers(users);toast(approve?'승인 완료':'거부 완료');renderPending();
}

function openEdit(){
  var sel=document.getElementById('editTeam');for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===currentUser.team){sel.selectedIndex=i;break;}}
  document.getElementById('editPw').value='';openModal('editModal');
}

function submitEdit(){
  var team=document.getElementById('editTeam').value;var newPw=document.getElementById('editPw').value;
  var users=getUsers();
  for(var i=0;i<users.length;i++){if(users[i].id===currentUser.id){users[i].team=team;if(newPw)users[i].pw=newPw;break;}}
  saveUsers(users);currentUser.team=team;
  document.getElementById('userInfoText').textContent=(currentUser.name||'')+' ('+currentUser.team+')';
  closeModal('editModal');toast('정보 수정됐습니다');
}

function renderCalendar(){calYear=new Date().getFullYear();calMonth=new Date().getMonth();drawCalendar();}

function drawCalendar(){
  var months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=calYear+'년 '+months[calMonth];
  document.getElementById('calDetail').innerHTML='';
  var mm=('0'+(calMonth+1)).slice(-2);
  var eventDays={};
  allEquip.forEach(function(item){
    if(!item.lastNote||item.lastNote==='특이사항 없음')return;if(!item.lastAction)return;
    var m=item.lastAction.match(/\((\d{2})\/(\d{2})\)/);if(!m||m[1]!==mm)return;
    var day=parseInt(m[2]);if(!eventDays[day])eventDays[day]=[];
    eventDays[day].push({item:item,color:CAT_COLORS[item.category]||'#888'});
  });
  var first=new Date(calYear,calMonth,1).getDay();var total=new Date(calYear,calMonth+1,0).getDate();var today=new Date();
  var dayNames=['일','월','화','수','목','금','토'];
  var h='<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>';
  dayNames.forEach(function(d,i){var c=i===0?'#e53e3e':(i===6?'#2563eb':'#888');h+='<th style="padding:6px 2px;text-align:center;color:'+c+';font-weight:600;font-size:12px">'+d+'</th>';});
  h+='</tr><tr>';
  for(var i=0;i<first;i++)h+='<td></td>';
  var col=first;
  for(var day=1;day<=total;day++){
    var isToday=calYear===today.getFullYear()&&calMonth===today.getMonth()&&day===today.getDate();
    var evs=eventDays[day]||[];var hasEv=evs.length>0;
    var dow=(first+day-1)%7;
    var numColor=isToday?'#fff':(dow===0?'#e53e3e':(dow===6?'#2563eb':'#222'));
    var bg=isToday?'#0f3460':'transparent';
    var dots='';
    if(hasEv){var shown={},dotList=[];evs.forEach(function(ev){if(!shown[ev.color]){shown[ev.color]=true;dotList.push(ev.color);}});dots='<div style="display:flex;justify-content:center;gap:2px;margin-top:2px">';dotList.slice(0,4).forEach(function(c){dots+='<div style="width:5px;height:5px;border-radius:50%;background:'+c+'"></div>';});dots+='</div>';}
    h+='<td style="padding:2px;text-align:center;vertical-align:top;cursor:'+(hasEv?'pointer':'default')+'" onclick="showDayDetail('+day+')"><div style="width:26px;height:26px;line-height:26px;border-radius:50%;background:'+bg+';color:'+numColor+';margin:0 auto;font-size:13px;font-weight:'+(isToday?'700':'400')+'">'+day+'</div>'+dots+'</td>';
    col++;if(col%7===0&&day<total)h+='</tr><tr>';
  }
  h+='</tr></table>';
  document.getElementById('calGrid').innerHTML=h;
  var legendEl=document.getElementById('calLegend');
  if(!legendEl.hasChildNodes()){var leg='<div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;font-size:11px">';Object.keys(CAT_COLORS).forEach(function(cat){leg+='<div style="display:flex;align-items:center;gap:3px"><div style="width:8px;height:8px;border-radius:50%;background:'+CAT_COLORS[cat]+'"></div>'+esc(cat)+'</div>';});leg+='</div>';legendEl.innerHTML=leg;}
  document.getElementById('calPrevBtn').onclick=function(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}drawCalendar();};
  document.getElementById('calNextBtn').onclick=function(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}drawCalendar();};
}

function showDayDetail(day){
  var mm=('0'+(calMonth+1)).slice(-2);var dd=('0'+day).slice(-2);var dateStr=mm+'/'+dd;
  var detail=document.getElementById('calDetail');
  var items=allEquip.filter(function(item){if(!item.lastNote||item.lastNote==='특이사항 없음')return false;return item.lastAction&&item.lastAction.indexOf('('+dateStr+')')!==-1;});
  if(!items.length){detail.innerHTML='<div style="padding:12px;color:#aaa;text-align:center;font-size:13px">특이사항 없음</div>';return;}
  var h='<div style="font-weight:700;color:#0f3460;margin-bottom:10px;font-size:14px">'+(calMonth+1)+'/'+day+' 특이사항 ('+items.length+'건)</div>';
  items.forEach(function(item){
    var c=CAT_COLORS[item.category]||'#888';
    h+='<div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid '+c+';box-shadow:0 1px 4px rgba(0,0,0,0.08)"><div style="font-weight:700;font-size:13px;margin-bottom:4px">'+esc(item.name)+' <span style="color:#888;font-weight:400;font-size:11px">('+esc(item.assetNo)+')</span></div><div style="font-size:12px;color:#444">'+esc(item.category)+' | '+esc(item.location||'-')+'</div><div style="font-size:12px;color:#e53e3e;font-weight:600;margin-top:3px">특이사항: '+esc(item.lastNote||'')+'</div><div style="font-size:11px;color:#888;margin-top:2px">'+esc(item.lastUser||'')+' · '+dateStr+'</div></div>';
  });
  detail.innerHTML=h;
}

document.querySelectorAll('#returnReason .radio-btn').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('#returnReason .radio-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');returnReason=btn.getAttribute('data-val');document.getElementById('returnCustom').style.display=returnReason==='기타'?'block':'none';};});
document.querySelectorAll('#noteType .radio-btn').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('#noteType .radio-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');noteType=btn.getAttribute('data-val');document.getElementById('noteCustom').style.display=noteType==='있음'?'block':'none';};});
