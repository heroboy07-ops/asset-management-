<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>장비관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:10px}.header{background:#667eea;color:#fff;padding:15px;text-align:center;font-weight:bold;border-radius:10px;margin-bottom:10px;font-size:14px}.tabs{display:flex;gap:5px;margin-bottom:15px}.tab{flex:1;padding:12px;background:#fff;border:2px solid #ddd;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;font-size:13px}.tab.active{background:#667eea;color:#fff;border-color:#667eea}.box{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.box-title{font-weight:bold;margin-bottom:10px;font-size:14px;color:#fff;background:#6c8ef5;padding:10px;margin:-15px -15px 15px -15px;border-radius:12px 12px 0 0}select,input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:10px}.btn{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-bottom:10px}.btn:hover{background:#5568d3}.btn.success{background:#00b894}.btn.success:hover{background:#00a383}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5)}.modal-content{background:#fff;margin:10% auto;padding:30px;border-radius:12px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}.modal-close{float:right;font-size:28px;font-weight:bold;color:#aaa;cursor:pointer}.modal-close:hover{color:#000}.action-btn{display:block;width:100%;padding:15px;margin:8px 0;background:#f8f9fa;border:2px solid #dfe6e9;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold;text-align:center}.action-btn:hover{background:#667eea;color:#fff;border-color:#667eea}.action-btn.selected{background:#667eea;color:#fff;border-color:#667eea}.radio-group{margin:15px 0}.radio-label{display:flex;align-items:center;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px;cursor:pointer}.radio-label input{width:auto;margin-right:10px}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 40px;border-radius:10px;z-index:9999;display:none}.loading.active{display:block}.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:8px;border-left:8px solid #667eea;box-shadow:0 2px 4px rgba(0,0,0,.1)}.card-title{font-weight:bold;font-size:14px;color:#333;margin-bottom:5px}
</style>
</head>
<body>

<div class="loading" id="loading">처리 중...</div>

<div id="loginScreen">
<div class="box">
<div class="box-title">로그인</div>
<input type="text" id="loginName" placeholder="이름">
<input type="text" id="loginEmpId" placeholder="사번">
<input type="password" id="loginPass" placeholder="비밀번호">
<button class="btn" onclick="login()">로그인</button>
<button class="btn" onclick="showRegister()">회원가입</button>
</div>
</div>

<div id="registerScreen" style="display:none">
<div class="box">
<div class="box-title">회원가입</div>
<input type="text" id="regName" placeholder="이름">
<input type="text" id="regEmpId" placeholder="사번">
<select id="regTeam">
<option value="">팀 선택</option>
<option value="1">1팀</option>
<option value="2">2팀</option>
<option value="3">3팀</option>
<option value="4">4팀</option>
<option value="5">5팀</option>
<option value="6">6팀</option>
<option value="평택">평택</option>
<option value="수원">수원</option>
<option value="아산1">아산1</option>
<option value="사무실">사무실</option>
<option value="의공실">의공실</option>
<option value="센터">센터</option>
</select>
<input type="password" id="regPass" placeholder="비밀번호">
<button class="btn" onclick="register()">가입</button>
<button class="btn" onclick="backToLogin()">취소</button>
</div>
</div>

<div id="mainApp" style="display:none">
<div class="header" id="status">로딩 중...</div>
<div class="tabs">
<div class="tab active" id="tab-equip" onclick="setMode('equip')">장비선택</div>
<div class="tab" id="tab-list" onclick="setMode('list')">목록조회</div>
</div>
<div id="searchBox"></div>
<div id="results"></div>
</div>

<div id="actionModal" class="modal">
<div class="modal-content">
<span class="modal-close" onclick="closeActionModal()">&times;</span>
<div id="actionContent"></div>
</div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbzHiX9TEUMUkac0_QwGdoM8Zgq9xKJ_CW6uJRwnfmVdbwFI0XLtASrLKphxGxqU6I6l/exec';
const LOCS=['1','2','3','4','5','6','평택','수원','아산1','사무실','의공실','센터'];
const COLORS={'청력기':'#667eea','청력부스':'#764ba2','중이기기':'#f093fb','소음계':'#4facfe','원심분리기':'#00f2fe','HRV':'#43e97b','EKG':'#fa709a','폐활량':'#fee140','실린지':'#30cfd0','프린터기':'#a8edea','업무용노트북':'#ff9a9e','와이브로':'#fad0c4','포터블모니터':'#ffecd2'};
let allData=[],mode='equip',currentUser=null,selectedEquipments=[];

function showLoading(s){document.getElementById('loading').classList.toggle('active',s)}

function login(){
const name=document.getElementById('loginName').value;
const empId=document.getElementById('loginEmpId').value;
const pass=document.getElementById('loginPass').value;
if(!name||!empId||!pass){alert('모든 항목을 입력하세요');return}
const users=JSON.parse(localStorage.getItem('users')||'{}');
const key=empId;
if(users[key]&&users[key].pass===pass){
currentUser=users[key];
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainApp').style.display='block';
load();
}else{alert('로그인 실패')}}

function showRegister(){
document.getElementById('loginScreen').style.display='none';
document.getElementById('registerScreen').style.display='block'}

function backToLogin(){
document.getElementById('registerScreen').style.display='none';
document.getElementById('loginScreen').style.display='block'}

function register(){
const name=document.getElementById('regName').value;
const empId=document.getElementById('regEmpId').value;
const team=document.getElementById('regTeam').value;
const pass=document.getElementById('regPass').value;
if(!name||!empId||!team||!pass){alert('모든 항목을 입력하세요');return}
const users=JSON.parse(localStorage.getItem('users')||'{}');
users[empId]={name:name,empId:empId,team:team,pass:pass};
localStorage.setItem('users',JSON.stringify(users));
alert('가입 완료');
backToLogin()}

async function load(){
showLoading(true);
try{
const res=await fetch(API+'?action=generateAll&t='+Date.now());
const data=await res.json();
if(data.equipment){
allData=data.equipment;
document.getElementById('status').innerText=allData.length+'개 장비 ('+currentUser.name+' - '+currentUser.team+'팀)';
show()
}}catch(e){alert('로딩 실패: '+e.message)}
finally{showLoading(false)}}

function setMode(m){
mode=m;
selectedEquipments=[];
document.getElementById('tab-equip').classList.toggle('active',m==='equip');
document.getElementById('tab-list').classList.toggle('active',m==='list');
show()}

function show(){
document.getElementById('searchBox').innerHTML='';
document.getElementById('results').innerHTML='';
if(mode==='equip'){
const cats=[...new Set(allData.map(e=>e.category))];
const equipCounts={};
cats.forEach(c=>{equipCounts[c]=allData.filter(r=>r.category===c).length});
document.getElementById('searchBox').innerHTML='<div class="box"><div class="box-title">장비 선택</div><select id="catSelect"><option value="">선택</option>'+cats.map(e=>'<option value="'+e+'">'+e+' ('+equipCounts[e]+'개)</option>').join('')+'</select><button class="btn" onclick="showEquipList()">조회</button></div>';
}else{
showAllList()}}

function showEquipList(){
const cat=document.getElementById('catSelect').value;
if(!cat)return;
const found=allData.filter(r=>r.category===cat);
let html='<div class="box"><div class="box-title">'+cat+' ('+found.length+'개)</div>';
html+=found.map(r=>{
const checked=selectedEquipments.some(e=>e.assetNo===r.assetNo)?'checked':'';
return '<label class="radio-label"><input type="checkbox" '+checked+' onchange="toggleEquip(\''+r.assetNo+'\',\''+r.category+'\',this.checked)"> '+r.assetNo+' - '+(r.model||'')+'</label>'
}).join('');
html+='<button class="btn success" onclick="showActionModal()">수령/반납 처리</button></div>';
document.getElementById('results').innerHTML=html}

function toggleEquip(asset,cat,checked){
if(checked){
selectedEquipments.push({assetNo:asset,category:cat})
}else{
selectedEquipments=selectedEquipments.filter(e=>e.assetNo!==asset)}}

function showActionModal(){
if(selectedEquipments.length===0){alert('장비를 선택하세요');return}
let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">작업 선택 ('+selectedEquipments.length+'개)</div>';
html+='<button class="action-btn" onclick="selectAction(\'수령\')">수령</button>';
html+='<button class="action-btn" onclick="selectAction(\'반납\')">반납</button>';
html+='<button class="action-btn" onclick="selectAction(\'수령예정\')">수령예정</button>';
html+='<button class="action-btn" onclick="selectAction(\'보유\')">보유</button>';
document.getElementById('actionContent').innerHTML=html;
document.getElementById('actionModal').style.display='block'}

function selectAction(action){
let html='<div style="margin-bottom:20px;font-size:18px;font-weight:bold">'+action+'</div>';
html+='<input type="text" id="actionName" placeholder="이름" value="'+currentUser.name+'" style="margin-bottom:10px">';
html+='<select id="actionTeam" style="margin-bottom:10px"><option value="">팀 선택</option>'+LOCS.map(l=>'<option value="'+l+'" '+(l===currentUser.team?'selected':'')+'>'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';
if(action==='반납'){
html+='<select id="returnReason" style="margin-bottom:10px"><option value="">반납사유</option><option value="팀해체">팀해체</option><option value="장비점검">장비점검</option><option value="의공실">의공실</option><option value="기타">기타</option></select>';
html+='<input type="text" id="returnReasonEtc" placeholder="기타 사유" style="display:none;margin-bottom:10px">';
}
if(action==='수령예정'){
html+='<select id="destTeam" style="margin-bottom:10px"><option value="">목적지</option>'+LOCS.map(l=>'<option value="'+l+'">'+(/^[1-6]$/.test(l)?l+'팀':l)+'</option>').join('')+'</select>';
}
html+='<div class="radio-group"><label class="radio-label"><input type="radio" name="memo" value="없음" checked onchange="toggleMemo(false)"> 특이사항 없음</label><label class="radio-label"><input type="radio" name="memo" value="있음" onchange="toggleMemo(true)"> 특이사항 있음</label></div>';
html+='<input type="text" id="memoText" placeholder="특이사항 입력" style="display:none;margin-bottom:10px">';
html+='<button class="btn success" onclick="submitAction(\''+action+'\')">등록</button>';
document.getElementById('actionContent').innerHTML=html;
if(action==='반납'){
document.getElementById('returnReason').onchange=function(){
document.getElementById('returnReasonEtc').style.display=this.value==='기타'?'block':'none'}}}

function toggleMemo(show){
document.getElementById('memoText').style.display=show?'block':'none'}

function closeActionModal(){
document.getElementById('actionModal').style.display='none'}

async function submitAction(action){
const name=document.getElementById('actionName').value;
const team=document.getElementById('actionTeam').value;
if(!name||!team){alert('이름과 팀을 입력하세요');return}
const hasMemo=document.querySelector('input[name="memo"]:checked').value==='있음';
const memo=hasMemo?document.getElementById('memoText').value:'특이사항 없음';
let newLocation=team;
let cellValue=team+'팀 '+action+' ('+name+' - '+memo+')';
if(action==='반납'){
const reason=document.getElementById('returnReason').value;
if(!reason){alert('반납사유를 선택하세요');return}
const reasonText=reason==='기타'?document.getElementById('returnReasonEtc').value:reason;
if(reason==='의공실'){newLocation='의공실'}else{newLocation='사무실'}
cellValue=team+'팀 반납 (반납사유-'+reasonText+'/'+name+' - '+memo+')';
}else if(action==='수령예정'){
const dest=document.getElementById('destTeam').value;
if(!dest){alert('목적지를 선택하세요');return}
newLocation=dest;
cellValue=team+'팀 수령예정 ('+name+' - '+memo+')';
}else if(action==='보유'){
cellValue=team+'팀 보유 ('+name+' - '+memo+')';
}
const entries=selectedEquipments.map(e=>({
category:e.category,
assetNo:e.assetNo,
newLocation:newLocation+'팀 ('+(new Date().getMonth()+1).toString().padStart(2,'0')+'/'+(new Date().getDate()).toString().padStart(2,'0')+')',
cellValue:cellValue
}));
showLoading(true);
try{
await fetch(API+'?action=update&data='+encodeURIComponent(JSON.stringify(entries)));
alert('등록 완료');
closeActionModal();
selectedEquipments=[];
await load();
}catch(e){alert('등록 실패: '+e.message)}
finally{showLoading(false)}}

function showAllList(){
let html='<div class="box"><div class="box-title">전체 장비</div>';
allData.forEach(r=>{
const color=COLORS[r.category]||'#667eea';
html+='<div class="card" style="border-left-color:'+color+'"><div class="card-title">'+r.category+' / '+r.assetNo+'</div>'+(r.memo||'')+'</div>'
});
html+='</div>';
document.getElementById('results').innerHTML=html}

window.onload=function(){
const users=JSON.parse(localStorage.getItem('users')||'{}');
if(Object.keys(users).length===0){
document.getElementById('loginScreen').style.display='block'
}};
</script>
</body>
</html>
