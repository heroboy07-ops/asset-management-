<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d63031">
<title>장비관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#f0f2f5}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#d63031 0%,#c0392b 100%)}
.login-box{background:white;border-radius:24px;padding:40px 30px;width:100%;max-width:400px}
.login-title{font-size:32px;font-weight:900;text-align:center;margin-bottom:40px;color:#d63031}
.login-input{width:100%;padding:16px;border:2px solid #e9ecef;border-radius:12px;font-size:16px;margin-bottom:15px}
.login-input:focus{outline:none;border-color:#d63031}
.login-btn{width:100%;padding:18px;background:linear-gradient(135deg,#d63031,#c0392b);color:white;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer}
.login-btn:active{transform:scale(.98)}
.login-link{text-align:center;margin-top:24px;color:#666;font-size:15px;cursor:pointer}
.login-link span{color:#d63031;font-weight:700}
.main-app{display:none}
.header{background:linear-gradient(135deg,#d63031 0%,#c0392b 100%);color:white;padding:20px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.header h1{font-size:26px;font-weight:900}
.user-info{font-size:14px;background:rgba(255,255,255,.25);padding:6px 14px;border-radius:20px;font-weight:600}
.logout-btn{font-size:13px;background:rgba(255,255,255,.35);padding:6px 12px;border-radius:16px;cursor:pointer;margin-top:6px;font-weight:600}
.selected-count{text-align:center;margin-top:12px;font-size:17px;font-weight:800}
.category-select{padding:16px;background:white}
.view-mode{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mode-btn{padding:14px;border:2px solid #e9ecef;background:white;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.mode-btn.active{background:#d63031;color:white;border-color:#d63031}
.category-dropdown{width:100%;padding:16px;border:2px solid #e9ecef;border-radius:14px;font-size:17px;font-weight:800;margin-top:12px}
.team-groups{padding:16px;padding-bottom:120px}
.team-group{background:white;border-radius:16px;margin-bottom:14px;overflow:hidden}
.team-header{padding:18px;background:#f8f9fa;display:flex;justify-content:space-between;cursor:pointer}
.team-name{font-size:20px;font-weight:900;color:#d63031}
.team-count{font-size:16px;color:#666;font-weight:800}
.team-items{display:none;padding:14px}
.team-items.show{display:block}
.equipment-list{padding:16px;padding-bottom:120px}
.equipment-item{background:white;border-radius:16px;padding:18px;margin-bottom:14px;display:flex;gap:14px}
.checkbox{width:28px;height:28px;margin-top:6px;cursor:pointer;accent-color:#d63031}
.equipment-info{flex:1}
.equipment-location{font-size:24px;font-weight:900;color:#0984e3;margin-bottom:10px}
.equipment-name{font-size:20px;font-weight:800;color:#d63031;margin-bottom:10px}
.equipment-details{font-size:15px;color:#666;line-height:1.9}
.bottom-action{position:fixed;bottom:0;left:0;right:0;background:white;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.2);z-index:100}
.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-action{padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}
.btn-action:active{transform:scale(.97)}
.btn-move{background:linear-gradient(135deg,#d63031,#c0392b);color:white}
.btn-select-all{background:linear-gradient(135deg,#6c757d,#5a6268);color:white}
.btn-action:disabled{opacity:.5}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.modal.active{display:flex}
.modal-content{background:white;border-radius:24px 24px 0 0;padding:28px;width:100%;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;margin-bottom:24px}
.modal-title{font-size:22px;font-weight:900}
.modal-close{font-size:32px;cursor:pointer;color:#999}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:15px;font-weight:800;margin-bottom:10px}
.form-input,.form-select{width:100%;padding:14px;border:2px solid #e9ecef;border-radius:12px;font-size:16px}
.btn-submit{width:100%;padding:18px;background:linear-gradient(135deg,#d63031,#c0392b);color:white;border:none;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;margin-top:12px}
.btn-submit:active{transform:scale(.98)}
.selected-list{background:#f8f9fa;padding:14px;border-radius:12px;max-height:160px;overflow-y:auto;margin-bottom:16px}
.empty-state{text-align:center;padding:80px 20px;color:#999;font-size:20px;font-weight:600}
.loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:white;padding:24px 48px;border-radius:16px;z-index:300;font-size:17px;font-weight:800}
.success-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:48px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:500;text-align:center;min-width:300px}
.admin-screen{display:none;padding:20px;padding-bottom:120px}
.user-card{background:white;border-radius:16px;padding:18px;margin-bottom:14px}
.user-card-header{display:flex;justify-content:space-between;margin-bottom:12px}
.user-name{font-size:18px;font-weight:800}
.user-badge{font-size:12px;padding:5px 12px;border-radius:14px;font-weight:800}
.badge-pending{background:#fff3cd;color:#856404}
.badge-approved{background:#d4edda;color:#155724}
.user-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-approve{background:#28a745;color:white;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-reject{background:#dc3545;color:white;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
<div class="login-box">
<div class="login-title">🏥 장비관리</div>
<div id="loginForm">
<input type="text" class="login-input" id="loginEmployeeId" placeholder="사번">
<input type="password" class="login-input" id="loginPassword" placeholder="비밀번호">
<button class="login-btn" onclick="login()">로그인</button>
<div class="login-link" onclick="showSignup()">계정이 없으신가요? <span>회원가입</span></div>
</div>
<div id="signupForm" style="display:none">
<input type="text" class="login-input" id="signupEmployeeId" placeholder="사번">
<input type="text" class="login-input" id="signupName" placeholder="이름">
<input type="text" class="login-input" id="signupTeam" placeholder="소속팀">
<input type="password" class="login-input" id="signupPassword" placeholder="비밀번호 (4자리 이상)">
<input type="password" class="login-input" id="signupPasswordConfirm" placeholder="비밀번호 확인">
<button class="login-btn" onclick="signup()">가입 신청</button>
<div class="login-link" onclick="showLogin()">이미 계정이 있으신가요? <span>로그인</span></div>
</div>
</div>
</div>
<div class="main-app" id="mainApp">
<div class="header">
<div class="header-top">
<h1>🏥 장비관리</h1>
<div>
<div class="user-info" id="userInfo"></div>
<div class="logout-btn" onclick="logout()">로그아웃</div>
</div>
</div>
<div class="selected-count" id="selectedCount">0개 선택</div>
</div>
<div class="category-select">
<div class="view-mode">
<button class="mode-btn active" onclick="setMode('equipment')">📦 장비별</button>
<button class="mode-btn" onclick="setMode('team')">👥 팀별</button>
</div>
<select class="category-dropdown" id="categorySelect" onchange="loadCategory()">
<option value="">선택하세요</option>
</select>
</div>
<div class="team-groups" id="teamGroups" style="display:none"></div>
<div class="equipment-list" id="equipmentList">
<div class="empty-state">📦<br>카테고리 선택</div>
</div>
<div class="bottom-action">
<div class="action-buttons">
<button class="btn-action btn-select-all" onclick="toggleSelectAll()">전체선택</button>
<button class="btn-action btn-move" onclick="openMoveModal()" id="btnMove" disabled>제출</button>
</div>
<div id="adminBtn" style="margin-top:10px;display:none">
<button class="btn-action" style="width:100%;background:#6c757d;color:white" onclick="showAdminScreen()">👤 사용자관리</button>
</div>
</div>
</div>
<div class="admin-screen" id="adminScreen">
<div style="background:white;padding:24px;border-radius:16px;margin-bottom:16px">
<h2 style="color:#d63031;margin-bottom:12px;font-size:24px;font-weight:900">👤 사용자 관리</h2>
<div style="display:flex;gap:10px">
<button class="logout-btn" onclick="showMainApp()">📦 장비관리</button>
<button class="logout-btn" onclick="logout()">로그아웃</button>
</div>
</div>
<div id="userList"></div>
</div>
<div class="modal" id="moveModal">
<div class="modal-content">
<div class="modal-header">
<div class="modal-title">장비 제출</div>
<div class="modal-close" onclick="closeModal()">×</div>
</div>
<div class="form-group">
<div class="form-label">선택 (<span id="moveCount">0</span>개)</div>
<div class="selected-list" id="selectedList"></div>
</div>
<div class="form-group">
<div class="form-label">팀 선택 *</div>
<select class="form-select" id="teamSelect">

<option value="사무실">사무실</option>
<option value="센터">센터</option>
</select>
</div>
<div class="form-group">
<div class="form-label">상태 *</div>
<select class="form-select" id="statusSelect" onchange="statusChanged()">
<option value="">선택</option>
<option value="수령">수령</option>
<option value="보유">보유</option>
<option value="반납">반납</option>
<option value="수령예정">수령예정</option>
</select>
</div>
<div class="form-group" id="returnReasonGroup" style="display:none">

<select class="form-select" id="returnReason">
<option value="">선택</option>
<option value="팀해체">팀해체</option>
<option value="의공실">의공실</option>
<option value="장비점검">장비점검</option>
<option value="폐기">폐기</option>
</select>
</div>
<div class="form-group">
<div class="form-label">특이사항</div>
<input type="text" class="form-input" id="memo" placeholder="특이사항 없음">
</div>
<button class="btn-submit" onclick="submitToSheets()">✅ Sheets 제출</button>
</div>
</div>
<div class="loading" id="loading">⏳ Sheets 업데이트 중...</div>

const APPS_SCRIPT_URL='여기에_Apps_Script_배포_URL_입력';

let currentUser=null,selectedEquipment=[],currentMode='equipment',filteredData=[],allSelected=false;

function init(){
  try{
    const userStr=localStorage.getItem('currentUser');
    const usersStr=localStorage.getItem('users');
    if(!userStr||userStr==='null'){showLoginScreen();return;}
    const user=JSON.parse(userStr);
    const users=JSON.parse(usersStr||'[]');
    const validUser=users.find(u=>u.employeeId===user.employeeId);
    if(!validUser){localStorage.removeItem('currentUser');showLoginScreen();return;}
    if(!validUser.approved){alert('승인 대기중');localStorage.removeItem('currentUser');showLoginScreen();return;}
    currentUser=validUser;
    localStorage.setItem('currentUser',JSON.stringify(validUser));
    showMainApp();
  }catch(e){showLoginScreen();}
}

function showLoginScreen(){document.getElementById('loginScreen').style.display='flex';document.getElementById('mainApp').style.display='none';document.getElementById('adminScreen').style.display='none';}
function showMainApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='block';document.getElementById('adminScreen').style.display='none';document.getElementById('userInfo').textContent=currentUser.name+(currentUser.isAdmin?' 👑':'');if(currentUser.isAdmin)document.getElementById('adminBtn').style.display='block';setMode('equipment');}
function showLogin(){document.getElementById('loginForm').style.display='block';document.getElementById('signupForm').style.display='none';}
function showSignup(){document.getElementById('loginForm').style.display='none';document.getElementById('signupForm').style.display='block';}

function signup(){
  const employeeId=document.getElementById('signupEmployeeId').value.trim();
  const name=document.getElementById('signupName').value.trim();
  const team=document.getElementById('signupTeam').value.trim();
  const password=document.getElementById('signupPassword').value;
  const passwordConfirm=document.getElementById('signupPasswordConfirm').value;
  if(!employeeId||!name||!team||!password||!passwordConfirm){alert('모든 항목 입력');return;}
  if(password.length<4){alert('비밀번호 4자리 이상');return;}
  if(password!==passwordConfirm){alert('비밀번호 불일치');return;}
  const users=JSON.parse(localStorage.getItem('users')||'[]');
  if(users.find(u=>u.employeeId===employeeId)){alert('이미 등록된 사번');return;}
  const isAdmin=(employeeId==='218062');
  users.push({employeeId,name,team,password,approved:isAdmin,isAdmin,createdAt:new Date().toISOString()});
  localStorage.setItem('users',JSON.stringify(users));
  document.getElementById('signupEmployeeId').value='';
  document.getElementById('signupName').value='';
  document.getElementById('signupTeam').value='';
  document.getElementById('signupPassword').value='';
  document.getElementById('signupPasswordConfirm').value='';
  alert(isAdmin?'관리자 등록 완료':'가입 신청 완료. 승인 대기');
  showLogin();
}

function login(){
  const employeeId=document.getElementById('loginEmployeeId').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!employeeId||!password){alert('사번/비밀번호 입력');return;}
  const users=JSON.parse(localStorage.getItem('users')||'[]');
  const user=users.find(u=>u.employeeId===employeeId);
  if(!user){alert('등록되지 않은 사번');return;}
  if(!user.approved){alert('승인 대기중');return;}
  if(user.password!==password){alert('비밀번호 불일치');return;}
  currentUser=user;
  localStorage.setItem('currentUser',JSON.stringify(user));
  if(user.isAdmin)showAdminScreen();else showMainApp();
}

function logout(){currentUser=null;localStorage.removeItem('currentUser');document.getElementById('loginEmployeeId').value='';document.getElementById('loginPassword').value='';showLoginScreen();}
function showAdminScreen(){document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='none';document.getElementById('adminScreen').style.display='block';loadUserList();}

function loadUserList(){
  const users=JSON.parse(localStorage.getItem('users')||'[]');
  const container=document.getElementById('userList');
  if(users.length===0){container.innerHTML='<div class="empty-state">👥<br>사용자 없음</div>';return;}
  container.innerHTML=users.map(user=>`<div class="user-card"><div class="user-card-header"><div class="user-name">${user.name}${user.isAdmin?' 👑':''}</div><div class="user-badge ${user.approved?'badge-approved':'badge-pending'}">${user.approved?'승인':'대기'}</div></div><div style="font-size:15px;color:#666;margin-bottom:6px">사번: ${user.employeeId}</div><div style="font-size:15px;color:#666">소속: ${user.team}</div>${!user.approved?`<div class="user-actions"><button class="btn-approve" onclick="approveUser('${user.employeeId}')">승인</button><button class="btn-reject" onclick="rejectUser('${user.employeeId}')">거부</button></div>`:''}${user.approved&&!user.isAdmin?`<div class="user-actions"><button class="btn-approve" onclick="makeAdmin('${user.employeeId}')">관리자 지정</button></div>`:''}</div>`).join('');
}

function approveUser(employeeId){const users=JSON.parse(localStorage.getItem('users')||'[]');const user=users.find(u=>u.employeeId===employeeId);if(user){user.approved=true;localStorage.setItem('users',JSON.stringify(users));loadUserList();showToast(user.name+' 승인');}}
function rejectUser(employeeId){if(!confirm('거부?'))return;let users=JSON.parse(localStorage.getItem('users')||'[]');users=users.filter(u=>u.employeeId!==employeeId);localStorage.setItem('users',JSON.stringify(users));loadUserList();showToast('거부 완료');}
function makeAdmin(employeeId){if(!confirm('관리자 지정?'))return;const users=JSON.parse(localStorage.getItem('users')||'[]');const user=users.find(u=>u.employeeId===employeeId);if(user){user.isAdmin=true;localStorage.setItem('users',JSON.stringify(users));loadUserList();showToast(user.name+' 관리자');}}

function setMode(mode){currentMode=mode;selectedEquipment=[];allSelected=false;document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));event.target.classList.add('active');const select=document.getElementById('categorySelect');select.innerHTML='<option value="">선택</option>';if(mode==='equipment'){select.innerHTML+='<option value="청력기">청력기</option><option value="청력부스">청력부스</option><option value="중이기기">중이기기</option><option value="소음계">소음계</option><option value="원심분리기">원심분리기</option><option value="HRV">HRV</option><option value="EKG">EKG</option><option value="폐활량">폐활량</option><option value="실린지">실린지</option><option value="프린터기">프린터기</option><option value="업무용노트북">노트북</option><option value="포터블모니터">모니터</option><option value="와이브로">와이브로</option>';}else{select.innerHTML+='<option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="수원">수원</option><option value="평택">평택</option><option value="아산1">아산1</option><option value="센터">센터</option><option value="사무실">사무실</option><option value="의공실">의공실</option>';}document.getElementById('teamGroups').style.display='none';document.getElementById('equipmentList').innerHTML='<div class="empty-state">📦<br>선택</div>';updateSelectedCount();}

function loadCategory(){const category=document.getElementById('categorySelect').value;selectedEquipment=[];if(!category){document.getElementById('teamGroups').style.display='none';document.getElementById('equipmentList').innerHTML='<div class="empty-state">📦<br>선택</div>';updateSelectedCount();return;}if(currentMode==='equipment'){filteredData=equipmentData.filter(e=>e.category===category);renderGroupedByTeam();}else{filteredData=equipmentData.filter(e=>e.location===category);renderList();}updateSelectedCount();}

function renderGroupedByTeam(){document.getElementById('equipmentList').style.display='none';document.getElementById('teamGroups').style.display='block';const teams={};filteredData.forEach(eq=>{if(!teams[eq.location])teams[eq.location]=[];teams[eq.location].push(eq);});const container=document.getElementById('teamGroups');container.innerHTML=Object.keys(teams).sort().map(team=>`<div class="team-group"><div class="team-header" onclick="toggleTeam('${team}')"><div class="team-name">📍 ${team}</div><div class="team-count">${teams[team].length}개</div></div><div class="team-items" id="team_${team}">${teams[team].map(eq=>{let details=`<div>${eq.name}</div><div>🔢 ${eq.serial}</div>`;if(eq.category==='청력기'&&eq.headset)details+=`<div style="color:#e74c3c;font-weight:700">🎧 ${eq.headset}</div>`;if(eq.category==='폐활량'&&eq.laptopModel)details+=`<div style="color:#0984e3;font-weight:700">💻 ${eq.laptopModel}</div>`;return`<div class="equipment-item"><input type="checkbox" class="checkbox" onchange="toggleSelect(${eq.id})" ${selectedEquipment.includes(eq.id)?'checked':''}><div class="equipment-info"><div class="equipment-name">🏷️ ${eq.assetNo}</div><div class="equipment-details">${details}</div></div></div>`;}).join('')}</div></div>`).join('');}

function toggleTeam(team){document.getElementById('team_'+team).classList.toggle('show');}

function renderList(){document.getElementById('teamGroups').style.display='none';document.getElementById('equipmentList').style.display='block';const container=document.getElementById('equipmentList');if(filteredData.length===0){container.innerHTML='<div class="empty-state">📦<br>없음</div>';return;}container.innerHTML=filteredData.map(eq=>{let details=`<div>${eq.name}</div><div>🔢 ${eq.serial}</div>`;if(eq.category==='청력기'&&eq.headset)details+=`<div style="color:#e74c3c;font-weight:700">🎧 ${eq.headset}</div>`;if(eq.category==='폐활량'&&eq.laptopModel)details+=`<div style="color:#0984e3;font-weight:700">💻 ${eq.laptopModel}</div>`;return`<div class="equipment-item"><input type="checkbox" class="checkbox" onchange="toggleSelect(${eq.id})" ${selectedEquipment.includes(eq.id)?'checked':''}><div class="equipment-info"><div class="equipment-location">📍 ${eq.location}</div><div class="equipment-name">🏷️ ${eq.assetNo}</div><div class="equipment-details">${details}</div></div></div>`;}).join('');}

function toggleSelect(id){const index=selectedEquipment.indexOf(id);index>-1?selectedEquipment.splice(index,1):selectedEquipment.push(id);updateSelectedCount();}
function toggleSelectAll(){if(filteredData.length===0)return;allSelected=!allSelected;if(allSelected){selectedEquipment=filteredData.map(e=>e.id);document.querySelectorAll('.checkbox').forEach(cb=>cb.checked=true);}else{selectedEquipment=[];document.querySelectorAll('.checkbox').forEach(cb=>cb.checked=false);}updateSelectedCount();}
function updateSelectedCount(){const count=selectedEquipment.length;document.getElementById('selectedCount').textContent=count+'개 선택';document.getElementById('btnMove').disabled=count===0;}
function statusChanged(){const status=document.getElementById('statusSelect').value;document.getElementById('returnReasonGroup').style.display=(status==='반납')?'block':'none';}

function openMoveModal(){if(selectedEquipment.length===0)return;document.getElementById('moveCount').textContent=selectedEquipment.length;const listHtml=selectedEquipment.map(id=>{const eq=equipmentData.find(e=>e.id===id);return`<div style="padding:10px 0;border-bottom:1px solid #dee2e6;font-weight:600">🏷️ ${eq.assetNo}</div>`;}).join('');document.getElementById('selectedList').innerHTML=listHtml;document.getElementById('teamSelect').value='';document.getElementById('statusSelect').value='';document.getElementById('returnReason').value='';document.getElementById('memo').value='특이사항 없음';document.getElementById('returnReasonGroup').style.display='none';document.getElementById('moveModal').classList.add('active');}

async function submitToSheets(){const team=document.getElementById('teamSelect').value;const status=document.getElementById('statusSelect').value;const returnReason=document.getElementById('returnReason').value;const memo=document.getElementById('memo').value||'특이사항 없음';if(!team){alert('❌ 팀 선택');return;}if(!status){alert('❌ 상태 선택');return;}if(status==='반납'&&!returnReason){alert('❌ 반납사유 선택');return;}if(APPS_SCRIPT_URL.includes('여기에')){alert('⚠️ Apps Script URL 필요!\n\nGitHub에 올린 후:\n1. index.html 파일 클릭\n2. 연필 아이콘 (Edit)\n3. Ctrl+F → "여기에_Apps_Script_URL_입력" 검색\n4. URL로 교체\n5. Commit\n\n지금은 로컬 저장만 됩니다.');selectedEquipment.forEach(id=>{const eq=equipmentData.find(e=>e.id===id);if(status==='수령'||status==='보유'||status==='수령예정')eq.location=team;else if(status==='반납')eq.location='사무실';});selectedEquipment=[];loadCategory();updateSelectedCount();closeModal();showSuccessModal(selectedEquipment.length,team,'로컬 저장');return;}document.getElementById('loading').style.display='block';const count=selectedEquipment.length;let successCount=0;for(const id of selectedEquipment){const eq=equipmentData.find(e=>e.id===id);const data={team,status,equipment:eq.category,assetNo:eq.assetNo,manager:currentUser.name,memo,returnReason,date:new Date().toISOString().split('T')[0]};try{await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(status==='수령'||status==='보유'||status==='수령예정')eq.location=team;else if(status==='반납')eq.location='사무실';successCount++;}catch(e){}}document.getElementById('loading').style.display='none';selectedEquipment=[];loadCategory();updateSelectedCount();closeModal();showSuccessModal(successCount,team,'Sheets 저장 완료');}

function showSuccessModal(count,team,msg){const modal=document.getElementById('successModal');modal.innerHTML=`<div style="font-size:72px;margin-bottom:20px">✅</div><div style="font-size:28px;font-weight:900;color:#28a745;margin-bottom:14px">제출 완료!</div><div style="font-size:18px;color:#333;margin-bottom:8px;font-weight:700">${count}개 장비 → ${team}</div><div style="font-size:15px;color:#999">${msg}</div>`;modal.style.display='block';setTimeout(()=>{modal.style.display='none';},3000);}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));}
function showToast(msg){const toast=document.createElement('div');toast.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:white;padding:16px 32px;border-radius:24px;z-index:400;font-size:16px;font-weight:700';toast.textContent=msg;document.body.appendChild(toast);setTimeout(()=>toast.remove(),2500);}

init();
</script>
</body>
