<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>장비 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f0f2f7;max-width:680px;margin:0 auto;min-height:100vh}
#loginScreen{display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f3460 0%,#16213e 60%,#1a1a2e 100%)}
#loginScreen.active{display:flex}
#mainScreen{display:none}
#mainScreen.active{display:block}
.login-box{background:#fff;border-radius:24px;padding:44px 32px 36px;width:calc(100% - 40px);max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.35)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:800;color:#0f3460}
.login-logo p{font-size:13px;color:#94a3b8;margin-top:6px}
#loginError{display:none;background:#fff0f0;color:#dc2626;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:16px;text-align:center;border:1px solid #fecaca}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:#f8fafc;transition:all .2s;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:#0f3460;background:#fff;box-shadow:0 0 0 3px rgba(15,52,96,.08)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn+.btn{margin-top:10px}
.btn-primary{background:#0f3460;color:#fff}
.btn-primary:active{background:#0a2540;transform:scale(.98)}
.btn-outline{background:transparent;color:#0f3460;border:2px solid #0f3460}
.btn-sm{width:auto;padding:7px 16px;font-size:13px;border-radius:9px;font-weight:600;border:none;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
/* 헤더 */
.hdr{background:#0f3460;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr h1{font-size:18px;font-weight:800}
.hdr-right{display:flex;align-items:center;gap:6px}
.hdr-info{font-size:11px;opacity:.8;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ibtn:active{background:rgba(255,255,255,.25)}
/* 선택바 */
.selbar{background:#1e40af;color:#fff;padding:10px 18px;display:none;align-items:center;justify-content:space-between;position:sticky;top:54px;z-index:99}
.selbar.on{display:flex}
.selbtn{padding:7px 18px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;position:sticky;top:54px;z-index:98;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:14px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.on{color:#0f3460;border-bottom-color:#0f3460}
/* 뒤로가기 */
#backBtn{display:none;background:#0f3460;color:#fff;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;position:sticky;top:54px;z-index:97;align-items:center;gap:8px}
#backBtn.on{display:flex}
/* 요약 그리드 */
.sum-wrap{padding:14px 14px 4px}
.sum-title{font-size:13px;font-weight:800;color:#64748b;margin-bottom:10px;letter-spacing:.3px;text-transform:uppercase}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.sum-card{background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid #0f3460;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.sum-card:active{transform:scale(.97)}
.sum-card .sc-name{font-size:14px;font-weight:700;color:#1e293b}
.sum-card .sc-cnt{font-size:22px;font-weight:800;color:#0f3460}
.sum-card .sc-unit{font-size:11px;color:#94a3b8;font-weight:500}
/* 검색 */
.sbar{padding:10px 14px;background:#fff;border-bottom:1px solid #f1f5f9}
.sbar input{width:100%;padding:11px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:#f8fafc}
.sbar input:focus{border-color:#0f3460;background:#fff}
/* 섹션 헤더 */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;background:#f0f2f7;position:sticky;top:96px;z-index:90}
.sec-hdr-title{font-size:15px;font-weight:800;color:#0f3460}
.sec-hdr-back{font-size:13px;color:#64748b;cursor:pointer;padding:4px 10px;background:#fff;border-radius:8px;border:1px solid #e2e8f0}
/* 장비 목록 */
.elist{padding:8px 14px 100px}
.loading{text-align:center;padding:48px 20px;color:#94a3b8;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#0f3460;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:14px;padding:13px 14px 13px 16px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid #0f3460;transition:all .15s}
.card:active{transform:scale(.99)}
.card.sel{background:#eff6ff;border-left-color:#2563eb}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800;margin-top:2px}
.card.sel .chk{background:#2563eb;border-color:#2563eb;color:#fff}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:2px}
.casset{font-size:12px;color:#94a3b8}
.csub{font-size:11px;color:#64748b;margin-top:3px;line-height:1.5}
.cright{text-align:right;flex-shrink:0}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-수령{background:#dbeafe;color:#1d4ed8}
.b-반납{background:#fef9c3;color:#854d0e}
.b-보유{background:#dcfce7;color:#15803d}
.b-수령예정{background:#ede9fe;color:#6d28d9}
/* 모달 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:28px 24px 36px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;position:relative}
.modal h2{font-size:18px;font-weight:800;color:#1e293b;margin-bottom:20px;padding-right:32px}
.mclose{position:absolute;top:20px;right:20px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:#64748b;line-height:32px;text-align:center}
.asec{margin-bottom:18px}
.asec label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.rgrp{display:flex;flex-wrap:wrap;gap:8px}
.rbtn{padding:9px 16px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:13px;cursor:pointer;font-weight:600;color:#475569;transition:all .2s;font-family:inherit}
.rbtn.on{background:#0f3460;color:#fff;border-color:#0f3460}
.sellist{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:18px;max-height:110px;overflow-y:auto;border:1px solid #e2e8f0}
.sellist .it{font-size:13px;padding:5px 0;border-bottom:1px solid #f1f5f9;color:#475569}
.sellist .it:last-child{border:none}
.pcard{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #e2e8f0}
.pcard .pn{font-weight:700;font-size:15px;margin-bottom:4px;color:#1e293b}
.pcard .pi{font-size:12px;color:#94a3b8;margin-bottom:10px}
.pbtns{display:flex;gap:8px}
/* 토스트 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:#1e293b;color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
/* 달력 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:#fff;border-bottom:1px solid #f1f5f9}
.cal-nav-btn{border:none;background:none;font-size:28px;cursor:pointer;color:#0f3460;padding:0 4px;line-height:1}
.cal-nav-title{font-weight:800;font-size:16px;color:#0f3460}
</style>
</head>
<body>

<div id="loginScreen" class="active">
  <div class="login-box">
    <div class="login-logo">
      <h1>⚙️ 장비 관리</h1>
      <p>사번과 비밀번호로 로그인하세요</p>
    </div>
    <div id="loginError"></div>
    <div class="fg"><label>사번</label><input type="text" id="loginId" placeholder="사번 입력" autocomplete="off"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="loginPw" placeholder="비밀번호 입력"></div>
    <button class="btn btn-primary" id="loginBtn">로그인</button>
    <button class="btn btn-outline" id="openRegBtn" style="margin-top:10px">회원가입</button>
    <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:14px">첫 번째 가입자가 자동으로 관리자가 됩니다</p>
  </div>
</div>

<div class="overlay" id="regOverlay">
  <div class="modal">
    <button class="mclose" id="closeRegBtn">&times;</button>
    <h2>회원가입</h2>
    <div class="fg"><label>사번</label><input type="text" id="regId" placeholder="사번 입력"></div>
    <div class="fg"><label>이름</label><input type="text" id="regName" placeholder="이름 입력"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="regPw" placeholder="비밀번호 입력"></div>
    <div class="fg"><label>소속팀</label>
      <select id="regTeam">
        <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
        <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
      </select>
    </div>
    <button class="btn btn-primary" id="submitRegBtn">가입 신청</button>
  </div>
</div>

<div id="mainScreen">
  <div class="hdr">
    <h1>장비 관리</h1>
    <div class="hdr-right">
      <span class="hdr-info" id="userText"></span>
      <button class="ibtn" id="editOpenBtn">수정</button>
      <button class="ibtn" id="adminBtn" style="display:none">관리</button>
      <button class="ibtn" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="selbar" id="selbar">
    <span id="selCount">0개 선택</span>
    <div style="display:flex;gap:8px">
      <button class="selbtn btn-green" id="procBtn">처리</button>
      <button class="selbtn btn-red" id="cancelSelBtn">취소</button>
    </div>
  </div>

  <div id="backBtn">← 목록으로</div>

  <div class="tabs" id="tabBar">
    <div class="tab on" data-t="equip">장비별</div>
    <div class="tab" data-t="team">팀별</div>
    <div class="tab" data-t="date">날짜별</div>
  </div>

  <!-- 장비별 -->
  <div id="tabEquip">
    <div id="equipSummary">
      <div class="sum-wrap">
        <div class="sum-title">카테고리별 현황</div>
        <div class="sum-grid" id="catSumGrid"></div>
      </div>
    </div>
    <div id="equipDetail" style="display:none">
      <div class="sec-hdr">
        <span class="sec-hdr-title" id="equipDetailTitle"></span>
        <span class="sec-hdr-back" id="equipDetailBack">← 목록</span>
      </div>
      <div class="sbar"><input type="text" id="searchInput" placeholder="자산번호, 기기명 검색..."></div>
      <div class="elist" id="equipList"></div>
    </div>
  </div>

  <!-- 팀별 -->
  <div id="tabTeam" style="display:none">
    <div id="teamSummary">
      <div class="sum-wrap">
        <div class="sum-title">팀별 현황</div>
        <div class="sum-grid" id="teamSumGrid"></div>
      </div>
    </div>
    <div id="teamDetail" style="display:none">
      <div class="sec-hdr">
        <span class="sec-hdr-title" id="teamDetailTitle"></span>
        <span class="sec-hdr-back" id="teamDetailBack">← 목록</span>
      </div>
      <div class="elist" id="teamList"></div>
    </div>
  </div>

  <!-- 날짜별 -->
  <div id="tabDate" style="display:none;padding-bottom:80px">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="calPrev">&#8249;</button>
      <span class="cal-nav-title" id="calTitle"></span>
      <button class="cal-nav-btn" id="calNext">&#8250;</button>
    </div>
    <div style="padding:10px 14px" id="calGrid"></div>
    <div style="padding:6px 14px 4px;display:flex;flex-wrap:wrap;gap:8px" id="calLegend"></div>
    <div style="padding:12px 14px" id="calDetail"></div>
  </div>

  <!-- 처리 모달 -->
  <div class="overlay" id="actionOverlay">
    <div class="modal">
      <button class="mclose" id="closeActionBtn">&times;</button>
      <h2>수령 / 반납 처리</h2>
      <div class="sellist" id="selList"></div>
      <div class="asec">
        <label>처리 유형</label>
        <div class="rgrp" id="atypeGrp">
          <button class="rbtn on" data-v="수령">수령</button>
          <button class="rbtn" data-v="반납">반납</button>
          <button class="rbtn" data-v="보유">보유</button>
          <button class="rbtn" data-v="수령예정">수령예정</button>
        </div>
      </div>
      <div class="asec" id="teamSecM">
        <label>팀 / 위치</label>
        <select id="actionTeam" style="width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
          <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
          <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
        </select>
      </div>
      <div class="asec" id="returnSecM" style="display:none">
        <label>반납 사유</label>
        <div class="rgrp" id="rreasonGrp">
          <button class="rbtn on" data-v="팀해체">팀해체</button>
          <button class="rbtn" data-v="장비점검">장비점검</button>
          <button class="rbtn" data-v="폐기">폐기</button>
          <button class="rbtn" data-v="의공실">의공실</button>
          <button class="rbtn" data-v="기타">기타</button>
        </div>
        <input type="text" id="returnCustom" placeholder="기타 사유 입력" style="display:none;margin-top:10px;width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none">
      </div>
      <div class="asec">
        <label>특이사항</label>
        <div class="rgrp" id="noteGrp">
          <button class="rbtn on" data-v="없음">특이사항 없음</button>
          <button class="rbtn" data-v="있음">특이사항 있음</button>
        </div>
        <input type="text" id="noteCustom" placeholder="특이사항 입력" style="display:none;margin-top:10px;width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none">
      </div>
      <button class="btn btn-primary" id="submitActionBtn" style="margin-top:10px">확인</button>
    </div>
  </div>

  <!-- 관리자 모달 -->
  <div class="overlay" id="adminOverlay">
    <div class="modal">
      <button class="mclose" id="closeAdminBtn">&times;</button>
      <h2>가입 승인 관리</h2>
      <div id="pendingList"></div>
    </div>
  </div>

  <!-- 정보수정 모달 -->
  <div class="overlay" id="editOverlay">
    <div class="modal">
      <button class="mclose" id="closeEditBtn">&times;</button>
      <h2>정보 수정</h2>
      <div class="fg"><label>소속팀</label>
        <select id="editTeam">
          <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
          <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
        </select>
      </div>
      <div class="fg"><label>새 비밀번호 (변경시만)</label><input type="password" id="editPw" placeholder="새 비밀번호"></div>
      <button class="btn btn-primary" id="submitEditBtn">수정 완료</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxB0vA1MbY2X2gfHJSwYCjHG4sUoVgJbKiQrxm5jaRdrVvIL6qmRg-kgB5Uw7Wa_h6V/exec';
var TEAMS=['1팀','2팀','3팀','4팀','5팀','6팀','수원','평택','아산1','사무실','의공실','센터'];
var CATS=['청력기','청력부스','중이기기','소음계','원심분리기','HRV','EKG','폐활량','실린지','프린터기','업무용노트북','와이브로','포터블모니터'];
var CC={'청력기':'#2563eb','청력부스':'#60a5fa','중이기기':'#16a34a','소음계':'#f59e0b','원심분리기':'#7c3aed','HRV':'#0891b2','EKG':'#db2777','폐활량':'#dc2626','실린지':'#ea580c','프린터기':'#64748b','업무용노트북':'#1e3a5f','와이브로':'#0d9488','포터블모니터':'#9333ea'};
var TC={'1팀':'#2563eb','2팀':'#16a34a','3팀':'#dc2626','4팀':'#7c3aed','5팀':'#ea580c','6팀':'#0891b2','수원':'#f59e0b','평택':'#db2777','아산1':'#0d9488','사무실':'#64748b','의공실':'#9333ea','센터':'#1e3a5f'};

function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

function getU(){try{return JSON.parse(localStorage.getItem('_equ')||'[]');}catch(e){return[];}}

function getS(){try{return JSON.parse(localStorage.getItem('_eqs')||'{}');}catch(e){return{};}}
function setS(s){localStorage.setItem('_eqs',JSON.stringify(s));}
function api(p,cb){var url=SCRIPT_URL+'?'+Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]);}).join('&');fetch(url).then(function(r){return r.json();}).then(cb).catch(function(e){cb({status:'error',msg:String(e)});});}

/* ── 로그인 ── */
function doLogin(){
  var id=document.getElementById('loginId').value.trim();
  var pw=document.getElementById('loginPw').value;
  var err=document.getElementById('loginError');
  err.style.display='none';
  if(!id||!pw){toast('사번과 비밀번호를 입력하세요');return;}
  var users=getU();
  if(users.length===0){err.textContent='먼저 회원가입을 해주세요';err.style.display='block';return;}
  for(var i=0;i<users.length;i++){
    if(users[i].id===id&&users[i].pw===pw){
      if(!users[i].approved){toast('관리자 승인 대기 중입니다');return;}
      me={id:users[i].id,name:users[i].name,team:users[i].team,isAdmin:!!users[i].isAdmin};
      goMain();return;
    }
  }
  err.textContent='사번 또는 비밀번호가 틀렸습니다';
  err.style.display='block';
}
function doReg(){
  var id=document.getElementById('regId').value.trim();
  var name=document.getElementById('regName').value.trim();
  var pw=document.getElementById('regPw').value;
  var team=document.getElementById('regTeam').value;
  if(!id||!name||!pw){toast('모든 항목을 입력하세요');return;}
  var users=getU();
  for(var i=0;i<users.length;i++){if(users[i].id===id){toast('이미 존재하는 사번입니다');return;}}
  var first=users.length===0;
  users.push({id:id,name:name,pw:pw,team:team,approved:first,isAdmin:first});
  setU(users);hide('regOverlay');
  if(first){me={id:id,name:name,team:team,isAdmin:true};goMain();toast('관리자로 로그인됐습니다');}
  else toast('가입 신청 완료. 관리자 승인 후 로그인하세요.');
}
function goLogin(){
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('loginId').value='';document.getElementById('loginPw').value='';
  document.getElementById('loginError').style.display='none';
}
function goMain(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainScreen').style.display='block';
  document.getElementById('userText').textContent=(me.name||'')+' ('+me.team+')';
  document.getElementById('adminBtn').style.display=me.isAdmin?'inline-block':'none';
  if(!loaded)loadData();else renderCatSummary();
}

/* ── 데이터 ── */
function loadData(){
  document.getElementById('catSumGrid').innerHTML='<div class="loading"><div class="spinner"></div>로딩 중...</div>';
  api({action:'generateAll'},function(d){
    if(!d||d.status==='error'){
      document.getElementById('catSumGrid').innerHTML='<div class="loading" style="color:#dc2626">연결 실패<br><small>'+(d&&d.msg||'URL 확인')+'</small><br><br><button onclick="loadData()" style="padding:8px 18px;background:#0f3460;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600">다시 시도</button></div>';
      return;
    }
    var items=d.equipment||d||[];
    var sv=getS();
    items.forEach(function(it){
      if(!it.status)it.status='보유';
      var an=(it.assetNo||'').trim();
      it.assetNo=an;
      if(it.category==='청력기'&&HS[an]){it.headsetModel=HS[an].m;it.headsetSerial=HS[an].s;}
      else if(it.category==='청력기'&&it.headsetInfo){/* 시트 메모 사용 */}
      if(sv[an]){var s2=sv[an];it.status=s2.status||it.status;it.location=s2.location||it.location;it.lastUser=s2.lastUser||'';it.lastNote=s2.lastNote||'';it.lastAction=s2.lastAction||'';}
    });
    var byAsset={};items.forEach(function(it){byAsset[it.assetNo]=it;});
    Object.keys(HS).forEach(function(an){
      if(byAsset[an]){byAsset[an].headsetModel=HS[an].m;byAsset[an].headsetSerial=HS[an].s;byAsset[an].category='청력기';}
      else{var itN={name:'청력기',assetNo:an,category:'청력기',location:'-',status:'보유',headsetModel:HS[an].m,headsetSerial:HS[an].s};if(sv[an]){var s3=sv[an];itN.status=s3.status||itN.status;itN.location=s3.location||itN.location;itN.lastUser=s3.lastUser||'';itN.lastNote=s3.lastNote||'';itN.lastAction=s3.lastAction||'';}items.push(itN);}
    });
    all=items;loaded=true;
    renderCatSummary();
    toast(items.length+'개 장비 로드 완료');
  });
}

function filt(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase();
  return all.filter(function(it){
    return (!curCat||it.category===curCat)&&(!q||(it.name&&it.name.toLowerCase().indexOf(q)>=0)||(it.assetNo&&it.assetNo.toLowerCase().indexOf(q)>=0));
  });
}

/* ── 카드 ── */
function mkCard(it,cm){
  var card=document.createElement('div');
  var isSel=sel.indexOf(it.assetNo)>=0;
  card.className='card'+(isSel?' sel':'');
  var ac=cm==='team'?(TC[it.location]||'#0f3460'):(CC[it.category]||'#0f3460');
  card.style.borderLeftColor=ac;
  var sub='';
  if(it.headsetModel)sub='헤드셋: '+it.headsetModel+' / '+it.headsetSerial;
  else if(it.headsetInfo)sub='헤드셋: '+it.headsetInfo;
  if(it.notebookInfo)sub=(sub?sub+' | ':'')+'노트북: '+it.notebookInfo;
  card.innerHTML=
    '<div class="chk">'+(isSel?'✓':'')+'</div>'+
    '<div class="cinfo">'+
      '<div class="cname">'+x(it.name)+'</div>'+
      '<div class="casset">'+x(it.assetNo)+(it.location&&it.location!=='-'?' · '+x(it.location):'')+'</div>'+
      (it.lastAction?'<div class="csub" style="color:#475569">'+x(it.lastAction)+'</div>':'')+
      (sub?'<div class="csub">'+x(sub)+'</div>':'')+
    '</div>'+
    '<div class="cright"><span class="badge b-'+x(it.status||'보유')+'">'+x(it.status||'보유')+'</span></div>';
  card.onclick=function(){toggleSel(it.assetNo,card);};
  return card;
}
function toggleSel(assetNo,card){
  var i=sel.indexOf(assetNo);
  if(i>=0){sel.splice(i,1);card.classList.remove('sel');card.querySelector('.chk').textContent='';}
  else{sel.push(assetNo);card.classList.add('sel');card.querySelector('.chk').textContent='✓';}
  updateSelbar();
}
function updateSelbar(){
  var b=document.getElementById('selbar');
  if(sel.length>0){b.classList.add('on');document.getElementById('selCount').textContent=sel.length+'개 선택';}
  else b.classList.remove('on');
}
function clearSel(){
  sel=[];
  document.querySelectorAll('.card.sel').forEach(function(c){c.classList.remove('sel');var k=c.querySelector('.chk');if(k)k.textContent='';});
  updateSelbar();
}

function openAction(){
  if(!sel.length){toast('장비를 선택하세요');return;}
  atype='수령';rreason='팀해체';ntype='없음';
  document.querySelectorAll('#atypeGrp .rbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelector('#atypeGrp .rbtn[data-v="수령"]').classList.add('on');
  document.querySelectorAll('#rreasonGrp .rbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelector('#rreasonGrp .rbtn[data-v="팀해체"]').classList.add('on');
  document.querySelectorAll('#noteGrp .rbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelector('#noteGrp .rbtn[data-v="없음"]').classList.add('on');
  document.getElementById('returnSecM').style.display='none';
  document.getElementById('teamSecM').style.display='block';
  document.getElementById('returnCustom').style.display='none';
  document.getElementById('noteCustom').style.display='none';
  document.getElementById('returnCustom').value='';
  document.getElementById('noteCustom').value='';
  document.getElementById('actionTeam').value=me.team;
  var sl=document.getElementById('selList');sl.innerHTML='';
  sel.forEach(function(id){var it=all.filter(function(e){return e.assetNo===id;})[0];var d=document.createElement('div');d.className='it';d.textContent=it?(it.name+' ('+id+')'):id;sl.appendChild(d);});
  show('actionOverlay');
}
function submitAction(){
  var team=document.getElementById('actionTeam').value;
  var note=ntype==='없음'?'특이사항 없음':(document.getElementById('noteCustom').value||'특이사항 있음');
  var rr=rreason==='기타'?(document.getElementById('returnCustom').value||'기타'):rreason;
  var entries=[];
  var now=new Date();var mm=('0'+(now.getMonth()+1)).slice(-2);var dd=('0'+now.getDate()).slice(-2);var ds=mm+'/'+dd;
  sel.forEach(function(assetNo){
    var it=all.filter(function(e){return e.assetNo===assetNo;})[0];if(!it)return;
    var loc=atype==='반납'?(rr==='의공실'?'의공실':'사무실'):team;
    var cv=atype==='반납'?team+' 반납 (반납사유-'+rr+'/'+me.name+'-'+note+')':team+' '+atype+' ('+me.name+'-'+note+')';
    var as=loc+' '+atype+' ('+ds+') - '+me.name+' ('+note+')';
    it.status=atype;it.location=loc;it.lastUser=me.name;it.lastNote=note;it.lastAction=as;
    entries.push({category:it.category,assetNo:assetNo,action:atype,team:team,newLocation:loc,cellValue:cv,userName:me.name,note:note,returnReason:rr});
  });
  var sv=getS();
  entries.forEach(function(e){sv[e.assetNo]={status:e.action,location:e.newLocation,lastUser:e.userName,lastNote:e.note,lastAction:e.newLocation+' '+e.action+' ('+ds+') - '+e.userName+' ('+e.note+')'}; });
  setS(sv);hide('actionOverlay');clearSel();
  if(curCat!==null||document.getElementById('equipDetail').style.display==='block')renderEList();
  if(curTeam)showTeamDetail(curTeam);
  toast('처리 완료');
  api({action:'update',data:JSON.stringify(entries)},function(d){if(d&&d.status==='ok')toast('시트 기록 완료');});
}

function renderPending(){
  var c=document.getElementById('pendingList');

      '<button class="btn-sm btn-red" onclick="doApprove(\''+x(u.id)+'\',false)">거부</button></div>';

function doApprove(uid,ok){
  var users=getU();
  if(ok){for(var i=0;i<users.length;i++){if(users[i].id===uid){users[i].approved=true;break;}}}
  else users=users.filter(function(u){return u.id!==uid;});
  setU(users);toast(ok?'승인 완료':'거부 완료');renderPending();
}

}

/* ── 달력 ── */
function renderCal(){cY=new Date().getFullYear();cM=new Date().getMonth();drawCal();}
function drawCal(){
  var months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=cY+'년 '+months[cM];
  document.getElementById('calDetail').innerHTML='';
  var mm=('0'+(cM+1)).slice(-2);
  var evs={};
  all.forEach(function(it){
    if(!it.lastAction)return;
    var m=it.lastAction.match(/\((\d{2})\/(\d{2})\)/);
    if(!m||m[1]!==mm)return;
    var day=parseInt(m[2]);
    if(!evs[day])evs[day]=[];
    evs[day].push({it:it,c:CC[it.category]||'#888',hasNote:it.lastNote&&it.lastNote!=='특이사항 없음'});
  });
  var first=new Date(cY,cM,1).getDay();var total=new Date(cY,cM+1,0).getDate();var today=new Date();
  var dn=['일','월','화','수','목','금','토'];
  var h='<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>';
  dn.forEach(function(d,i){var c=i===0?'#e53e3e':(i===6?'#2563eb':'#94a3b8');h+='<th style="padding:8px 2px;text-align:center;color:'+c+';font-size:12px;font-weight:700">'+d+'</th>';});
  h+='</tr><tr>';
  for(var i=0;i<first;i++)h+='<td></td>';
  var col=first;
  for(var day=1;day<=total;day++){
    var isT=cY===today.getFullYear()&&cM===today.getMonth()&&day===today.getDate();
    var ev=evs[day]||[];var hasAny=ev.length>0;
    var hasNote=ev.some(function(e){return e.hasNote;});
    var dow=(first+day-1)%7;
    var nc=isT?'#fff':(dow===0?'#e53e3e':(dow===6?'#2563eb':'#1e293b'));
    var bg=isT?'#0f3460':'transparent';
    var dots='';
    if(hasNote){
      var sh={},dl=[];
      ev.filter(function(e){return e.hasNote;}).forEach(function(e){if(!sh[e.c]){sh[e.c]=true;dl.push(e.c);}});
      dots='<div style="display:flex;justify-content:center;gap:2px;margin-top:2px">';
      dl.slice(0,4).forEach(function(c){dots+='<div style="width:5px;height:5px;border-radius:50%;background:'+c+'"></div>';});
      dots+='</div>';
    } else if(hasAny){
      dots='<div style="display:flex;justify-content:center;margin-top:3px"><div style="width:5px;height:5px;border-radius:50%;background:#cbd5e1"></div></div>';
    }
    h+='<td style="padding:3px;text-align:center;vertical-align:top;cursor:'+(hasAny?'pointer':'default')+'" onclick="'+(hasAny?'showDay('+day+')':'')+'">'+
      '<div style="width:28px;height:28px;line-height:28px;border-radius:50%;background:'+bg+';color:'+nc+';margin:0 auto;font-size:13px;font-weight:'+(isT?'800':'400')+'">'+day+'</div>'+
      dots+'</td>';
    col++;if(col%7===0&&day<total)h+='</tr><tr>';
  }
  h+='</tr></table>';
  document.getElementById('calGrid').innerHTML=h;
  var leg=document.getElementById('calLegend');
  if(!leg.hasChildNodes()){
    var lh='<div style="font-size:11px;color:#64748b;width:100%;margin-bottom:4px">● 컬러 = 특이사항 있음 &nbsp; ● 회색 = 처리 내역만</div>';
    Object.keys(CC).forEach(function(cat){lh+='<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#475569"><div style="width:8px;height:8px;border-radius:50%;background:'+CC[cat]+';flex-shrink:0"></div>'+x(cat)+'</div>';});
    leg.innerHTML=lh;
  }
  document.getElementById('calPrev').onclick=function(){cM--;if(cM<0){cM=11;cY--;}drawCal();};
  document.getElementById('calNext').onclick=function(){cM++;if(cM>11){cM=0;cY++;}drawCal();};
}
function showDay(day){
  var mm=('0'+(cM+1)).slice(-2);var dd=('0'+day).slice(-2);var ds=mm+'/'+dd;
  var det=document.getElementById('calDetail');
  var items=all.filter(function(it){return it.lastAction&&it.lastAction.indexOf('('+ds+')')!==-1;});
  if(!items.length){det.innerHTML='<p style="color:#94a3b8;text-align:center;padding:16px;font-size:13px">처리 내역 없음</p>';return;}
  var h='<div style="font-weight:800;color:#0f3460;margin-bottom:12px;font-size:14px">'+(cM+1)+'/'+day+' 처리 내역 ('+items.length+'건)</div>';
  items.forEach(function(it){
    var c=CC[it.category]||'#888';
    var hasNote=it.lastNote&&it.lastNote!=='특이사항 없음';
    h+='<div style="background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid '+c+';box-shadow:0 2px 10px rgba(0,0,0,.07)">'+
      '<div style="font-weight:700;font-size:14px;margin-bottom:4px;color:#1e293b">'+x(it.name)+' <span style="font-weight:400;font-size:12px;color:#94a3b8">('+x(it.assetNo)+')</span></div>'+
      '<div style="font-size:12px;color:#64748b;margin-bottom:3px">'+x(it.category)+' · '+x(it.location||'-')+'</div>'+
      '<div style="font-size:12px;color:#475569">'+x(it.lastAction||'')+'</div>'+
      (hasNote?'<div style="font-size:13px;color:#dc2626;font-weight:700;margin-top:6px">⚠ '+x(it.lastNote)+'</div>':'')+
    '</div>';
  });
  det.innerHTML=h;
}

      document.getElementById('teamSummary').style.display='block';

      curTeam=null;
      renderTeamSummary();

    if(t==='equip'){
      // 장비별 - 항상 요약부터
      document.getElementById('equipSummary').style.display='block';
      document.getElementById('equipDetail').style.display='none';
      curCat=null;

});
