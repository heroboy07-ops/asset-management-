<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>장비 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f0f2f7;max-width:720px;margin:0 auto;min-height:100vh}
/* 로그인 */
#scLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f3460,#16213e)}
#scMain{display:none}
.lbox{background:#fff;border-radius:24px;padding:44px 32px 36px;width:calc(100%-40px);max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.ltitle{text-align:center;margin-bottom:28px}
.ltitle h1{font-size:22px;font-weight:800;color:#0f3460}
.ltitle p{font-size:13px;color:#94a3b8;margin-top:6px}
.lerr{display:none;background:#fff0f0;color:#dc2626;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:16px;text-align:center;border:1px solid #fecaca}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:#f8fafc;transition:border .2s,background .2s;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:#0f3460;background:#fff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;text-align:center}
.btn+.btn{margin-top:10px}
.btn-p{background:#0f3460;color:#fff}
.btn-p:active{background:#0a2540;transform:scale(.98)}
.btn-o{background:transparent;color:#0f3460;border:2px solid #0f3460}
/* 헤더 */
.hdr{background:#0f3460;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-title{font-size:17px;font-weight:800}
.hdr-r{display:flex;align-items:center;gap:5px}
.uinfo{font-size:11px;opacity:.8;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.ibtn:active{background:rgba(255,255,255,.25)}
/* 선택바 */
.selbar{background:#1e40af;color:#fff;padding:9px 16px;display:none;align-items:center;justify-content:space-between;position:sticky;top:50px;z-index:190}
.selbar.on{display:flex}
.sbtn{padding:6px 14px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;position:sticky;top:50px;z-index:180}
.selbar.on~.tabs{top:88px}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:14px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.on{color:#0f3460;border-bottom-color:#0f3460}
/* 요약 그리드 */
.sum-wrap{padding:12px 12px 4px}
.sum-label{font-size:12px;font-weight:800;color:#64748b;margin-bottom:10px;letter-spacing:.3px;text-transform:uppercase}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.sc{background:#fff;border-radius:13px;padding:12px 13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid #0f3460;display:flex;align-items:center;justify-content:space-between;transition:transform .1s}
.sc:active{transform:scale(.97)}
.sc-name{font-size:13px;font-weight:700;color:#1e293b}
.sc-cnt{font-size:22px;font-weight:800}
.sc-unit{font-size:11px;color:#94a3b8}
/* 섹션 헤더 */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f0f2f7;border-bottom:1px solid #e2e8f0;position:sticky;top:88px;z-index:170}
.sec-title{font-size:15px;font-weight:800;color:#0f3460}
.sec-back{font-size:13px;color:#64748b;cursor:pointer;padding:5px 12px;background:#fff;border-radius:8px;border:1px solid #e2e8f0}
/* 담당자 바 */
.cbar{background:#fff;border-bottom:1px solid #f1f5f9;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbar-name{font-size:13px;font-weight:700;color:#1e293b}
.cbar-ph{font-size:12px;color:#64748b}
.cbtn{padding:6px 13px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.cbtn-call{background:#16a34a;color:#fff}
.cbtn-mail{background:#0f3460;color:#fff}
/* 장소 필터 */
.loc-filter{padding:10px 12px;background:#fff;border-bottom:1px solid #f1f5f9;display:flex;flex-wrap:wrap;gap:6px}
.lbtn{padding:6px 12px;border:1.5px solid #e2e8f0;border-radius:20px;background:#f8fafc;font-size:12px;font-weight:600;color:#475569;cursor:pointer;font-family:inherit;transition:all .15s}
.lbtn.on{background:#0f3460;color:#fff;border-color:#0f3460}
/* 검색 */
.sbar{padding:9px 12px;background:#fff;border-bottom:1px solid #f1f5f9}
.sbar input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit}
.sbar input:focus{border-color:#0f3460;background:#fff}
/* 카드 */
.elist{padding:8px 12px 100px}
.loading{text-align:center;padding:48px 20px;color:#94a3b8;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#0f3460;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:13px;padding:12px 13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid #0f3460;transition:transform .1s}
.card:active{transform:scale(.99)}
.card.sel{background:#eff6ff;border-left-color:#2563eb}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;margin-top:1px}
.card.sel .chk{background:#2563eb;border-color:#2563eb;color:#fff}
.ci{flex:1;min-width:0}
.cname{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:2px}
.casset{font-size:12px;color:#94a3b8;margin-bottom:2px}
.clast{font-size:12px;color:#475569;margin-top:2px}
.csub{font-size:12px;color:#1e3a5f;margin-top:2px;word-break:break-all}
.cright{flex-shrink:0}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-수령{background:#dbeafe;color:#1d4ed8}
.b-반납{background:#fef9c3;color:#854d0e}
.b-보유{background:#dcfce7;color:#15803d}
.b-수령예정{background:#ede9fe;color:#6d28d9}
/* 오버레이/모달 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:26px 20px 36px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:17px;font-weight:800;color:#1e293b;margin-bottom:18px;padding-right:32px}
.mclose{position:absolute;top:18px;right:18px;background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;color:#64748b;line-height:30px;text-align:center}
.asec{margin-bottom:16px}
.asec>label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.rgrp{display:flex;flex-wrap:wrap;gap:7px}
.rbtn{padding:8px 14px;border:1.5px solid #e2e8f0;border-radius:9px;background:#f8fafc;font-size:13px;cursor:pointer;font-weight:600;color:#475569;font-family:inherit;transition:all .15s}
.rbtn.on{background:#0f3460;color:#fff;border-color:#0f3460}
.sel-list{background:#f8fafc;border-radius:11px;padding:10px;margin-bottom:16px;max-height:90px;overflow-y:auto;border:1px solid #e2e8f0}
.sel-item{font-size:12px;padding:3px 0;border-bottom:1px solid #f1f5f9;color:#475569}
.sel-item:last-child{border:none}
/* 처리결과 카드 */
.result-card{background:#f0f7ff;border:1.5px solid #bfdbfe;border-radius:13px;padding:14px 16px;margin-bottom:10px}
.rc-head{font-size:14px;font-weight:800;color:#1e40af;margin-bottom:4px}
.rc-info{font-size:12px;color:#1e3a5f;margin-bottom:8px;line-height:1.6}
.rc-line{border:none;border-top:1.5px dashed #93c5fd;margin:8px 0}
.rc-bot{font-size:13px;color:#0f3460;font-weight:600}
/* 수신자 */
.rcpt-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.rcpt-btn{padding:7px 13px;border:1.5px solid #e2e8f0;border-radius:9px;background:#f8fafc;font-size:12px;cursor:pointer;font-weight:600;color:#475569;font-family:inherit;transition:all .15s}
.rcpt-btn.on{background:#0f3460;color:#fff;border-color:#0f3460}
/* 달력 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #f1f5f9}
.cal-nav button{border:none;background:none;font-size:26px;cursor:pointer;color:#0f3460;line-height:1}
.cal-title{font-weight:800;font-size:15px;color:#0f3460}
/* 관리자 */
.pcard{background:#f8fafc;border-radius:11px;padding:13px;margin-bottom:9px;border:1px solid #e2e8f0}
.pcard-name{font-weight:700;font-size:14px;margin-bottom:3px;color:#1e293b}
.pcard-info{font-size:12px;color:#94a3b8;margin-bottom:9px}
.pbtns{display:flex;gap:7px}
.btn-sm{padding:7px 14px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-g{background:#16a34a;color:#fff}
.btn-r{background:#dc2626;color:#fff}
.btn-b{background:#0f3460;color:#fff}
/* 토스트 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:#1e293b;color:#fff;padding:11px 20px;border-radius:13px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="scLogin">
  <div class="lbox">
    <div class="ltitle"><h1>⚙️ 장비 관리</h1><p>사번과 비밀번호로 로그인</p></div>
    <div class="lerr" id="lerr"></div>
    <div class="fg"><label>사번</label><input type="text" id="lId" placeholder="사번 입력" autocomplete="off"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="lPw" placeholder="비밀번호 입력"></div>
    <button class="btn btn-p" id="btnLogin">로그인</button>
    <button class="btn btn-o" id="btnOpenReg" style="margin-top:10px">회원가입</button>
    <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:12px">첫 번째 가입자는 자동으로 관리자</p>
  </div>
</div>

<!-- 메인 화면 -->
<div id="scMain">
  <div class="hdr">
    <span class="hdr-title">장비 관리</span>
    <div class="hdr-r">
      <span class="uinfo" id="uinfo"></span>
      <button class="ibtn" id="btnEdit">수정</button>
      <button class="ibtn" id="btnAdmin" style="display:none">관리</button>
      <button class="ibtn" id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="selbar" id="selbar">
    <span id="selCount">0개 선택</span>
    <div style="display:flex;gap:7px">
      <button class="sbtn btn-g" id="btnProc">처리</button>
      <button class="sbtn btn-b" id="btnMail">메일</button>
      <button class="sbtn btn-r" id="btnCancelSel">취소</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-t="equip">장비별</div>
    <div class="tab" data-t="team">팀별</div>
    <div class="tab" data-t="date">날짜별</div>
  </div>

  <!-- ===== 장비별 탭 ===== -->
  <div id="tabEquip">
    <!-- 카테고리 요약 -->
    <div id="equipSum">
      <div class="sum-wrap">
        <div class="sum-label">카테고리별 현황</div>
        <div class="sum-grid" id="catGrid"></div>
      </div>
    </div>
    <!-- 카테고리 상세 -->
    <div id="equipDet" style="display:none">
      <div class="sec-hdr">
        <span class="sec-title" id="catTitle"></span>
        <span class="sec-back" id="btnCatBack">← 목록</span>
      </div>
      <div class="cbar" id="catCbar"></div>
      <div class="loc-filter" id="locFilter"></div>
      <div class="sbar"><input type="text" id="srch" placeholder="자산번호, 기기명 검색..."></div>
      <div class="elist" id="equipList"></div>
    </div>
  </div>

  <!-- ===== 팀별 탭 ===== -->
  <div id="tabTeam" style="display:none">
    <div id="teamSum">
      <div class="sum-wrap">
        <div class="sum-label">팀별 현황</div>
        <div class="sum-grid" id="teamGrid"></div>
      </div>
    </div>
    <div id="teamDet" style="display:none">
      <div class="sec-hdr">
        <span class="sec-title" id="teamTitle"></span>
        <span class="sec-back" id="btnTeamBack">← 목록</span>
      </div>
      <div class="cbar" id="teamCbar" style="display:none"></div>
      <div class="elist" id="teamList"></div>
    </div>
  </div>

  <!-- ===== 날짜별 탭 ===== -->
  <div id="tabDate" style="display:none;padding-bottom:80px">
    <div class="cal-nav">
      <button id="btnCalPrev">&#8249;</button>
      <span class="cal-title" id="calTitle"></span>
      <button id="btnCalNext">&#8250;</button>
    </div>
    <div style="padding:10px 12px" id="calGrid"></div>
    <div style="padding:0 12px 6px;display:flex;flex-wrap:wrap;gap:6px" id="calLegend"></div>
    <div style="padding:8px 12px" id="calDetail"></div>
  </div>
</div>

<!-- 회원가입 모달 -->
<div class="overlay" id="ovReg">
  <div class="modal">
    <button class="mclose" id="btnCloseReg">&times;</button>
    <h2>회원가입</h2>
    <div class="fg"><label>사번</label><input type="text" id="rId" placeholder="사번"></div>
    <div class="fg"><label>이름</label><input type="text" id="rName" placeholder="이름"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="rPw" placeholder="비밀번호"></div>
    <div class="fg"><label>소속팀</label>
      <select id="rTeam">
        <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
        <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
      </select>
    </div>
    <button class="btn btn-p" id="btnReg">가입 신청</button>
  </div>
</div>

<!-- 처리 모달 -->
<div class="overlay" id="ovAct">
  <div class="modal">
    <button class="mclose" id="btnCloseAct">&times;</button>
    <h2>장비 처리</h2>
    <div class="sel-list" id="actSelList"></div>
    <div class="asec">
      <label>처리 유형</label>
      <div class="rgrp" id="atypeGrp">
        <button class="rbtn on" data-v="수령">수령</button>
        <button class="rbtn" data-v="반납">반납</button>
        <button class="rbtn" data-v="보유">보유</button>
        <button class="rbtn" data-v="수령예정">수령예정</button>
      </div>
    </div>
    <div class="asec" id="secTeam">
      <label>팀 / 위치</label>
      <select id="actTeam" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
        <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
        <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
      </select>
    </div>
    <div class="asec" id="secReturn" style="display:none">
      <label>반납 사유</label>
      <div class="rgrp" id="rreasonGrp">
        <button class="rbtn on" data-v="팀해체">팀해체</button>
        <button class="rbtn" data-v="장비점검">장비점검</button>
        <button class="rbtn" data-v="의공실">의공실</button>
        <button class="rbtn" data-v="기타">기타</button>
      </div>
      <input type="text" id="retEtc" placeholder="기타 사유 직접 입력" style="display:none;margin-top:9px;width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;font-family:inherit">
    </div>
    <div id="secPre" style="display:none">
      <div class="asec">
        <label>수령 예정일</label>
        <input type="date" id="preDate" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
      </div>
      <div class="asec">
        <label>현재 장비 위치</label>
        <select id="preLoc" style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;background:#f8fafc;font-family:inherit">
          <option>1팀</option><option>2팀</option><option>3팀</option><option>4팀</option><option>5팀</option><option>6팀</option>
          <option>수원</option><option>평택</option><option>아산1</option><option>사무실</option><option>의공실</option><option>센터</option>
        </select>
      </div>
    </div>
    <div class="asec">
      <label>특이사항</label>
      <div class="rgrp" id="noteGrp">
        <button class="rbtn on" data-v="없음">특이사항 없음</button>
        <button class="rbtn" data-v="있음">특이사항 있음</button>
      </div>
      <input type="text" id="noteText" placeholder="특이사항 내용 입력" style="display:none;margin-top:9px;width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:14px;outline:none;font-family:inherit">
    </div>
    <button class="btn btn-p" id="btnSubmitAct">확인</button>
  </div>
</div>

<!-- 처리 결과 모달 -->
<div class="overlay" id="ovResult">
  <div class="modal">
    <button class="mclose" id="btnCloseResult">&times;</button>
    <h2>처리 완료</h2>
    <div id="resultList"></div>
    <button class="btn btn-p" id="btnResultOk" style="margin-top:8px">확인</button>
  </div>
</div>

<!-- 메일 모달 -->
<div class="overlay" id="ovMail">
  <div class="modal">
    <button class="mclose" id="btnCloseMail">&times;</button>
    <h2>메일 전송</h2>
    <div class="asec">
      <label>받는 사람 (복수 선택)</label>
      <div class="rcpt-grid" id="rcptGrid"></div>
    </div>
    <div class="asec">
      <label>제목</label>

// 메모 파싱 (폐활량/노트북 등)
function parseMemo(memo) {
  if (!memo) return {model:'',sn:''};
  var m = memo.match(/모델명\s*[-:]\s*([A-Za-z0-9\-\/]+)/i);
  var s = memo.match(/(?:S\/N|제조번호)\s*[-:]\s*([A-Za-z0-9]+)/i);
  return {model: m ? m[1] : '', sn: s ? s[1] : ''};
}

var NOTEBOOK_CATS = {폐활량:1,업무용노트북:1,포터블모니터:1,와이브로:1};

// 카드 서브라인 구성
function buildSubLine(it) {
  var an = it.assetNo;
  if (it.category === '청력기' && HS[an]) {
    return HS[an].m + ' / ' + HS[an].sn + ' / ' + HS[an].hs;
  }
  if (NOTEBOOK_CATS[it.category] && it.memo) {
    var p = parseMemo(it.memo);
    if (p.model || p.sn) return (p.model||'') + (p.model&&p.sn?' / ':'') + (p.sn||'');
  }
  if (it.model || it.serial) {
    return [it.model,it.serial].filter(Boolean).join(' / ');
  }
  return '';
}

// 처리결과 표출용 텍스트
function buildResultCard(it, action, team, note, ds) {
  var an = it.assetNo;
  var headLine = team + ' ' + action + ' / ' + it.category + ' (' + (it.name||'').replace(/[^0-9]/g,'') + ')/' + an;
  var infoLine = '';
  if (it.category === '청력기' && HS[an]) {
    infoLine = '(모델명 ' + HS[an].m + ', S/N - ' + HS[an].sn + ')  (헤드셋 - ' + HS[an].hs + ')';
  } else if (NOTEBOOK_CATS[it.category] && it.memo) {
    var p = parseMemo(it.memo);
    infoLine = (p.model ? '모델명 - ' + p.model : '') + (p.sn ? (p.model?', ':'') + 'S/N - ' + p.sn : '');
  } else if (it.model || it.serial) {
    if (it.model) infoLine += '모델명 ' + it.model;
    if (it.serial) infoLine += (infoLine?', ':'') + 'S/N - ' + it.serial;
  }
  var botLine = ds + ' ' + (me ? me.name : '') + ' - ' + note;
  return {headLine:headLine, infoLine:infoLine, botLine:botLine};
}

function loadData(){
  document.getElementById('catGrid').innerHTML='<div class="loading"><div class="spinner"></div>데이터 로딩 중...</div>';
  api({action:'generateAll'},function(d){
    if(!d||d.status==='error'){
      document.getElementById('catGrid').innerHTML='<div class="loading" style="color:#dc2626">연결 실패<br><small>'+(d&&d.msg||'URL 확인')+'</small><br><br><button onclick="loadData()" style="padding:8px 18px;background:#0f3460;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600">다시 시도</button></div>';
      return;
    }
    var items=Array.isArray(d)?d:(d.equipment||[]);
    var sv=getS();
    // 청력기 HS 주입
    var byAsset={};
    items.forEach(function(it){
      it.assetNo=String(it.assetNo||'').trim();
      var an=it.assetNo;
      if(it.category==='청력기'&&HS[an]){it.model=HS[an].m;it.serial=HS[an].sn;it.headset=HS[an].hs;}
      if(sv[an]){var s=sv[an];it.status=s.status||it.status||'보유';it.location=s.location||it.location;it.lastAction=s.lastAction||'';}
      else if(!it.status)it.status='보유';
      byAsset[an]=it;
    });
    // HS 12개 전부 보장
    Object.keys(HS).forEach(function(an){
      if(!byAsset[an]){
        var it={name:'청력기',assetNo:an,category:'청력기',location:'-',status:'보유',model:HS[an].m,serial:HS[an].sn,headset:HS[an].hs};
        if(sv[an]){var s=sv[an];it.status=s.status||it.status;it.location=s.location||it.location;it.lastAction=s.lastAction||'';}
        items.push(it);byAsset[an]=it;
      } else {
        byAsset[an].model=HS[an].m;byAsset[an].serial=HS[an].sn;byAsset[an].headset=HS[an].hs;
      }
    });
    allItems=items;loaded=true;
    renderCatSum();
    toast(items.length+'개 장비 로드 완료');
  });
}

  items.forEach(function(it){L.appendChild(mkCard(it));});
}

/* ─── 카드 ─── */
function mkCard(it){
  var card=document.createElement('div');
  var isSel=sel.indexOf(it.assetNo)>=0;
  card.className='card'+(isSel?' sel':'');
  var cc=CC[it.category]||'#0f3460';
  card.style.borderLeftColor=cc;
  var sub=buildSubLine(it);
  card.innerHTML=
    '<div class="chk">'+(isSel?'✓':'')+'</div>'+
    '<div class="ci">'+
      '<div class="cname">'+x(it.name)+'</div>'+
      '<div class="casset">'+x(it.assetNo)+' · '+x(it.location||'—')+'</div>'+
      (it.lastAction?'<div class="clast">'+x(it.lastAction)+'</div>':'')+
      (sub?'<div class="csub">'+x(sub)+'</div>':'')+
    '</div>'+
    '<div class="cright"><span class="badge b-'+x(it.status||'보유')+'">'+x(it.status||'보유')+'</span></div>';
  card.onclick=function(){toggleSel(it.assetNo,card);};
  return card;
}
function toggleSel(assetNo,card){
  var i=sel.indexOf(assetNo);
  if(i>=0){sel.splice(i,1);card.classList.remove('sel');card.querySelector('.chk').textContent='';}
  else{sel.push(assetNo);card.classList.add('sel');card.querySelector('.chk').textContent='✓';}
  updSelbar();
}
function updSelbar(){
  var b=document.getElementById('selbar');
  if(sel.length>0){b.classList.add('on');document.getElementById('selCount').textContent=sel.length+'개 선택';}
  else b.classList.remove('on');
}
function clearSel(){
  sel=[];
  document.querySelectorAll('.card.sel').forEach(function(c){c.classList.remove('sel');var k=c.querySelector('.chk');if(k)k.textContent='';});
  updSelbar();
}

  document.querySelectorAll('#rreasonGrp .rbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelector('#rreasonGrp .rbtn[data-v="팀해체"]').classList.add('on');
  document.querySelectorAll('#noteGrp .rbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelector('#noteGrp .rbtn[data-v="없음"]').classList.add('on');

  });

}

function submitAction(){
  var ds=todayStr();
  var note=ntype==='없음'?'특이사항 없음':(document.getElementById('noteText').value.trim()||'특이사항 있음');
  var rr=rreason==='기타'?(document.getElementById('retEtc').value.trim()||'기타'):rreason;
  var team=document.getElementById('actTeam').value;
  var entries=[];var resultItems=[];

  sel.forEach(function(assetNo){
    var it=allItems.filter(function(e){return e.assetNo===assetNo;})[0];if(!it)return;
    var loc,fVal,dateVal;
    if(atype==='수령'){
      loc=team;fVal=team+' ('+ds+')';
      dateVal=team+' 수령 ('+me.name+' - '+note+')';
    }else if(atype==='보유'){
      loc=team;fVal=team+' ('+ds+')';
      dateVal=team+' 보유 ('+me.name+' - '+note+')';
    }else if(atype==='반납'){
      loc=rr==='의공실'?'의공실':'사무실';
      fVal=loc+' ('+ds+')';
      dateVal=team+' 반납 - '+rr+' ('+me.name+' - '+note+')';
    }else if(atype==='수령예정'){
      var pdRaw=document.getElementById('preDate').value;
      var pd=new Date(pdRaw);
      var pdStr=('0'+(pd.getMonth()+1)).slice(-2)+'/'+('0'+pd.getDate()).slice(-2);
      var curL=document.getElementById('preLoc').value;
      loc=curL;fVal=curL+' ('+ds+')';
      dateVal=team+' 수령예정 ('+me.name+' - '+pdStr+' '+team+' 수령예정)';
    }
    it.status=atype;it.location=loc;
    it.lastAction=loc+' '+atype+' ('+ds+') - '+me.name+' ('+note+')';
    entries.push({category:it.category,assetNo:assetNo,newLocation:fVal,cellValue:dateVal,userName:me.name,note:note});
    resultItems.push({it:it,action:atype,team:team,note:note,ds:ds});
  });

  var sv=getS();
  entries.forEach(function(e){
    var it=allItems.filter(function(i){return i.assetNo===e.assetNo;})[0];
    sv[e.assetNo]={status:atype,location:it?it.location:'',lastAction:it?it.lastAction:''};
  });
  setS(sv);hideOv('ovAct');clearSel();

  // 결과 표시
  var rl=document.getElementById('resultList');rl.innerHTML='';
  resultItems.forEach(function(r){
    var rc=buildResultCard(r.it,r.action,r.team,r.note,r.ds);
    var d=document.createElement('div');d.className='result-card';
    d.innerHTML='<div class="rc-head">'+x(rc.headLine)+'</div>'+
      (rc.infoLine?'<div class="rc-info">'+x(rc.infoLine)+'</div>':'')+
      '<hr class="rc-line">'+
      '<div class="rc-bot">'+x(rc.botLine)+'</div>';
    rl.appendChild(d);
  });
  showOv('ovResult');

  if(document.getElementById('equipDet').style.display==='block')renderEList();
  if(curTeam)showTeamDet(curTeam);

  api({action:'update',data:JSON.stringify(entries)},function(d){
    if(d&&d.errors&&d.errors.length)toast('시트 오류: '+d.errors[0]);
    else if(d&&d.status==='ok')toast('시트 기록 완료 ('+d.updated+'건)');
  });
}

function csvRows(){
  var nb={폐활량:1,업무용노트북:1,포터블모니터:1,와이브로:1};
  var rows=[['순서','기기명','모델','S/N','자산번호','현재위치','상태']];
  sel.forEach(function(id,i){
    var it=allItems.filter(function(e){return e.assetNo===id;})[0];if(!it)return;
    var model='',sn='';
    if(nb[it.category]){var p=parseMemo(it.memo||'');model=p.model;sn=p.sn;}
    else{model=it.model||'';sn=it.serial||'';}
    rows.push([i+1,it.name,model,sn,it.assetNo,it.location||'-',it.status||'보유']);
  });
  return rows;
}

document.getElementById('btnSendMail').onclick=function(){
  var emails=[];document.querySelectorAll('#rcptGrid .rcpt-btn.on').forEach(function(b){emails.push(b.getAttribute('data-e'));});
  if(!emails.length){toast('수신자를 선택하세요');return;}
  var subj=encodeURIComponent(document.getElementById('mailSubj').value);
  var rows=csvRows();
  var body=encodeURIComponent(rows.map(function(r){return r.join('\t');}).join('\n'));

};
document.getElementById('btnDownloadCsv').onclick=function(){
  var rows=csvRows();
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='장비현황_'+todayStr().replace('/','_')+'.csv';a.click();
  hideOv('ovMail');
};

/* ─── 관리자 ─── */
function renderPending(){
  var c=document.getElementById('pendList');
  var pend=getU().filter(function(u){return !u.approved;});
  if(!pend.length){c.innerHTML='<p style="text-align:center;padding:24px;color:#94a3b8">승인 대기 없음</p>';return;}
  c.innerHTML='';
  pend.forEach(function(u){
    var d=document.createElement('div');d.className='pcard';
    d.innerHTML='<div class="pcard-name">'+x(u.name)+'</div><div class="pcard-info">사번: '+x(u.id)+' · 팀: '+x(u.team)+'</div>'+
      '<div class="pbtns"><button class="btn-sm btn-g" onclick="doApprove(\''+x(u.id)+'\',true)">승인</button> '+
      '<button class="btn-sm btn-r" onclick="doApprove(\''+x(u.id)+'\',false)">거부</button></div>';
    c.appendChild(d);
  });
}
function doApprove(uid,ok){
  var users=getU();
  if(ok){for(var i=0;i<users.length;i++){if(users[i].id===uid){users[i].approved=true;break;}}}
  else users=users.filter(function(u){return u.id!==uid;});
  setU(users);toast(ok?'승인 완료':'거부 완료');renderPending();
}

/* ─── 달력 ─── */
function drawCal(){
  var months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=calY+'년 '+months[calM];
  document.getElementById('calDetail').innerHTML='';
  var mm=('0'+(calM+1)).slice(-2);
  var evs={};
  allItems.forEach(function(it){
    if(!it.lastAction)return;
    var m=it.lastAction.match(/\((\d{2})\/(\d{2})\)/);
    if(!m||m[1]!==mm)return;
    var day=parseInt(m[2]);if(!evs[day])evs[day]=[];
    evs[day].push({it:it,c:CC[it.category]||'#888',note:it.lastAction&&it.lastAction.indexOf('특이사항 없음')<0&&it.lastAction.indexOf('(')>=0});
  });
  var first=new Date(calY,calM,1).getDay(),total=new Date(calY,calM+1,0).getDate();
  var today=new Date(),tY=today.getFullYear(),tM=today.getMonth(),tD=today.getDate();
  var h='<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>';
  ['일','월','화','수','목','금','토'].forEach(function(d,i){
    h+='<th style="padding:7px 2px;text-align:center;color:'+(i===0?'#e53e3e':i===6?'#2563eb':'#94a3b8')+';font-size:12px;font-weight:700">'+d+'</th>';
  });
  h+='</tr><tr>';
  for(var i=0;i<first;i++)h+='<td></td>';
  var col=first;
  for(var day=1;day<=total;day++){
    var isT=calY===tY&&calM===tM&&day===tD;
    var ev=evs[day]||[];var dow=(first+day-1)%7;
    var nc=isT?'#fff':(dow===0?'#e53e3e':dow===6?'#2563eb':'#1e293b');
    var dots='';
    if(ev.length>0){
      var sh={},dl=[];ev.filter(function(e){return e.note;}).forEach(function(e){if(!sh[e.c]){sh[e.c]=true;dl.push(e.c);}});
      if(dl.length>0){dots='<div style="display:flex;justify-content:center;gap:2px;margin-top:2px">';dl.slice(0,4).forEach(function(c){dots+='<div style="width:5px;height:5px;border-radius:50%;background:'+c+'"></div>';});dots+='</div>';}
      else dots='<div style="display:flex;justify-content:center;margin-top:2px"><div style="width:5px;height:5px;border-radius:50%;background:#cbd5e1"></div></div>';
    }
    h+='<td style="padding:3px;text-align:center;vertical-align:top;cursor:'+(ev.length?'pointer':'default')+'" onclick="'+(ev.length?'showDay('+day+')':'')+'">'+
      '<div style="width:27px;height:27px;line-height:27px;border-radius:50%;background:'+(isT?'#0f3460':'transparent')+';color:'+nc+';margin:0 auto;font-size:12px;font-weight:'+(isT?'800':'400')+'">'+day+'</div>'+dots+'</td>';
    col++;if(col%7===0&&day<total)h+='</tr><tr>';
  }
  h+='</tr></table>';
  document.getElementById('calGrid').innerHTML=h;
}
function showDay(day){
  var mm=('0'+(calM+1)).slice(-2),dd=('0'+day).slice(-2),ds=mm+'/'+dd;
  var items=allItems.filter(function(it){return it.lastAction&&it.lastAction.indexOf('('+ds+')')>=0;});
  var det=document.getElementById('calDetail');
  if(!items.length){det.innerHTML='<p style="color:#94a3b8;text-align:center;padding:16px;font-size:13px">처리 내역 없음</p>';return;}
  var h='<div style="font-weight:800;color:#0f3460;margin-bottom:10px;font-size:14px">'+(calM+1)+'/'+day+' 처리 내역 ('+items.length+'건)</div>';
  items.forEach(function(it){
    var c=CC[it.category]||'#888';
    var hasNote=it.lastAction&&it.lastAction.indexOf('특이사항 없음')<0;
    h+='<div style="background:#fff;border-radius:13px;padding:13px;margin-bottom:9px;border-left:4px solid '+c+';box-shadow:0 2px 10px rgba(0,0,0,.07)">'+
      '<div style="font-weight:700;font-size:14px;color:#1e293b">'+x(it.name)+' <span style="font-size:11px;color:#94a3b8;font-weight:400">('+x(it.assetNo)+')</span></div>'+
      '<div style="font-size:12px;color:#64748b;margin:3px 0">'+x(it.category)+' · '+x(it.location||'-')+'</div>'+
      '<div style="font-size:12px;color:#475569">'+x(it.lastAction||'')+'</div>'+
      (hasNote&&it.lastNote?'<div style="font-size:13px;color:#dc2626;font-weight:700;margin-top:5px">⚠ '+x(it.lastNote)+'</div>':'')+
    '</div>';
  });
  det.innerHTML=h;
}
