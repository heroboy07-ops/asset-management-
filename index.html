<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>장비관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5}.loading{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:9999;color:#fff}.loading.active{display:flex}.screen{display:none;min-height:100vh}.screen.active{display:block}.login-screen{display:flex!important;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}.login-box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:400px}.login-box h1{text-align:center;margin-bottom:30px;color:#667eea}.login-box input,.login-box select{width:100%;padding:15px;margin-bottom:15px;border:2px solid #ddd;border-radius:10px;font-size:16px}.login-box button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-bottom:10px}.login-box .link-btn{background:transparent;color:#667eea;text-decoration:underline}.hidden{display:none!important}.main-screen{padding-bottom:70px}.header{background:#667eea;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.header h1{font-size:18px}.header-right{display:flex;gap:10px;font-size:14px}.header button{padding:8px 15px;border:none;border-radius:5px;cursor:pointer;color:#fff}.btn-edit{background:#28a745}.btn-logout{background:#dc3545}.search-bar{padding:15px;background:#fff}.search-bar input,.search-bar select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px}.tabs{display:flex;background:#fff;border-bottom:2px solid #ddd}.tab{flex:1;padding:15px;text-align:center;border:none;background:transparent;font-size:16px;cursor:pointer}.tab.active{border-bottom:3px solid #667eea;font-weight:bold;color:#667eea}.category-tabs{display:flex;overflow-x:auto;background:#fff;padding:10px;gap:10px}.category-tab{padding:10px 20px;background:#f5f5f5;border:none;border-radius:20px;white-space:nowrap;font-size:14px;cursor:pointer}.category-tab.active{background:#667eea;color:#fff;font-weight:bold}.equipment-list{padding:15px}.equipment-item{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px;position:relative}.equipment-checkbox{position:absolute;top:15px;right:15px;width:24px;height:24px;cursor:pointer}.equipment-name{font-weight:bold;font-size:16px;margin-bottom:5px;padding-right:40px}.equipment-info{font-size:14px;color:#666;margin-bottom:3px}.equipment-location{display:inline-block;padding:4px 12px;background:#667eea;color:#fff;border-radius:12px;font-size:12px;margin-top:8px}.email-btn{margin-top:10px;padding:8px 16px;background:#28a745;color:#fff;border:none;border-radius:5px;font-size:14px;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:100}.nav-item{flex:1;padding:12px;text-align:center;border:none;background:transparent;font-size:14px;cursor:pointer;color:#666}.nav-item.active{color:#667eea;font-weight:bold}.action-bar{position:fixed;bottom:60px;left:0;width:100%;background:#667eea;padding:15px;display:none;justify-content:space-between;align-items:center;z-index:99}.action-bar.active{display:flex}.action-bar span{color:#fff;font-weight:bold}.action-bar button{padding:10px 20px;background:#fff;color:#667eea;border:none;border-radius:5px;font-weight:bold;cursor:pointer}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:flex-end;z-index:1000}.modal.active{display:flex}.modal-content{background:#fff;width:100%;max-height:90vh;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #eee}.modal-close{font-size:28px;cursor:pointer}.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:8px;font-weight:bold;font-size:14px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px}.form-group textarea{min-height:80px}.modal-buttons{display:flex;gap:10px;margin-top:20px}.modal-buttons button{flex:1;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}.btn-primary{background:#667eea;color:#fff}.btn-secondary{background:#6c757d;color:#fff}.selected-count{background:#28a745;color:#fff;padding:5px 10px;border-radius:15px}
</style>
</head>
<body>
<div class="loading" id="loading">처리중...</div>
<div class="screen login-screen active" id="loginScreen"><div class="login-box"><h1>장비관리</h1><input type="text" id="loginId" placeholder="사번"><input type="password" id="loginPw" placeholder="비밀번호"><button id="loginBtn">로그인</button><button class="link-btn" id="registerBtn">회원가입</button></div></div>
<div class="screen login-screen" id="registerScreen"><div class="login-box"><h1>회원가입</h1><input type="text" id="regId" placeholder="사번"><input type="text" id="regName" placeholder="이름"><input type="password" id="regPw" placeholder="비밀번호"><input type="password" id="regPwConf" placeholder="비밀번호 확인"><select id="regTeam"><option value="">팀 선택</option><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select><button id="regSubmitBtn">가입신청</button><button class="link-btn" id="regBackBtn">로그인으로</button></div></div>
<div class="screen main-screen" id="mainScreen"><div class="header"><h1>장비관리</h1><div class="header-right"><span id="userInfo"></span><button class="btn-edit" id="editBtn">정보수정</button><button class="btn-logout" id="logoutBtn">로그아웃</button></div></div><div class="tabs"><button class="tab active" id="equipTab">장비별</button><button class="tab" id="teamTab">팀별</button></div><div id="equipmentView"><div class="search-bar"><input type="text" id="searchInput" placeholder="검색"></div><div class="category-tabs" id="categoryTabs"></div><div class="equipment-list" id="equipmentList"></div></div><div id="teamView" class="hidden"><div class="search-bar"><select id="teamFilter"><option value="">팀 선택</option><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div><div class="equipment-list" id="teamList"></div></div><div class="action-bar" id="actionBar"><span><span class="selected-count" id="selectedCount">0</span> 선택</span><button id="bulkBtn">수령/반납</button></div><div class="bottom-nav"><button class="nav-item active">장비별</button><button class="nav-item">팀별</button></div></div>
<div class="modal" id="bulkModal"><div class="modal-content"><div class="modal-header"><h2>일괄처리</h2><span class="modal-close" id="bulkClose">×</span></div><div class="form-group"><label>상태</label><select id="bulkType"><option value="수령">수령</option><option value="반납">반납</option><option value="보유">보유</option><option value="수령예정">수령예정</option></select></div><div class="form-group"><label>팀/위치</label><select id="bulkTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div><div class="form-group hidden" id="returnGroup"><label>반납사유</label><select id="returnReason"><option value="팀해체">팀해체</option><option value="의공실">의공실</option><option value="장비점검">장비점검</option><option value="기타">기타</option></select></div><div class="form-group hidden" id="customGroup"><label>사유입력</label><input type="text" id="customReason"></div><div class="form-group"><label>관리자</label><input type="text" id="bulkManager"></div><div class="form-group"><label>특이사항</label><textarea id="bulkMemo">특이사항 없음</textarea></div><div class="form-group"><label>날짜</label><input type="date" id="bulkDate"></div><div class="modal-buttons"><button class="btn-primary" id="bulkSubmit">등록</button><button class="btn-secondary" id="bulkCancel">취소</button></div></div></div>
<div class="modal" id="emailModal"><div class="modal-content"><div class="modal-header"><h2>이메일</h2><span class="modal-close" id="emailClose">×</span></div><div class="form-group"><label>받는사람</label><input type="email" id="emailTo"></div><div class="form-group"><label>제목</label><input type="text" id="emailSubject" value="장비 정보"></div><div class="form-group"><label>내용</label><textarea id="emailBody" rows="10"></textarea></div><div class="modal-buttons"><button class="btn-primary" id="emailSend">전송</button><button class="btn-secondary" id="emailCancel">취소</button></div></div></div>
<div class="modal" id="editModal"><div class="modal-content"><div class="modal-header"><h2>정보수정</h2><span class="modal-close" id="editClose">×</span></div><div class="form-group"><label>사번</label><input type="text" id="editId" disabled></div><div class="form-group"><label>이름</label><input type="text" id="editName" disabled></div><div class="form-group"><label>팀</label><select id="editTeam"><option value="1팀">1팀</option><option value="2팀">2팀</option><option value="3팀">3팀</option><option value="4팀">4팀</option><option value="5팀">5팀</option><option value="6팀">6팀</option><option value="평택">평택</option><option value="수원">수원</option><option value="아산1">아산1</option><option value="사무실">사무실</option><option value="센터">센터</option><option value="의공실">의공실</option></select></div><div class="form-group"><label>새 비밀번호</label><input type="password" id="editPw" placeholder="변경시만"></div><div class="modal-buttons"><button class="btn-primary" id="editSave">저장</button><button class="btn-secondary" id="editCancel">취소</button></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyoQyPWpEhoVnizoYEXIaDIFWbUvVD2ftkA6xHi8H8VqN_SnEYOpVYjBqsjpDmtgT5B/exec';
const CAT=['청력기','청력부스','중이기기','소음계','원심분리기','HRV','EKG','폐활량','실린지','프린터기','업무용노트북','와이브로','포터블모니터'];
let user=null,all=[],filt=[],sel=[],cat='';
window.onload=function(){document.getElementById('bulkDate').valueAsDate=new Date();document.getElementById('loginBtn').onclick=login;document.getElementById('registerBtn').onclick=showRegister;document.getElementById('regBackBtn').onclick=showLogin;document.getElementById('regSubmitBtn').onclick=register;document.getElementById('logoutBtn').onclick=logout;document.getElementById('editBtn').onclick=showEditModal;document.getElementById('equipTab').onclick=()=>switchView('equipment');document.getElementById('teamTab').onclick=()=>switchView('team');document.getElementById('searchInput').oninput=filter;document.getElementById('teamFilter').onchange=filterTeam;document.getElementById('bulkBtn').onclick=showBulk;document.getElementById('bulkClose').onclick=closeBulk;document.getElementById('bulkCancel').onclick=closeBulk;document.getElementById('bulkType').onchange=toggleReturn;document.getElementById('returnReason').onchange=toggleCustom;document.getElementById('bulkSubmit').onclick=submitBulk;document.getElementById('emailClose').onclick=closeEmail;document.getElementById('emailCancel').onclick=closeEmail;document.getElementById('emailSend').onclick=sendEmail;document.getElementById('editClose').onclick=closeEdit;document.getElementById('editCancel').onclick=closeEdit;document.getElementById('editSave').onclick=saveEdit};
function showRegister(){document.getElementById('loginScreen').classList.remove('active');document.getElementById('registerScreen').classList.add('active')}
function showLogin(){document.getElementById('registerScreen').classList.remove('active');document.getElementById('loginScreen').classList.add('active')}
function login(){const id=document.getElementById('loginId').value.trim();const pw=document.getElementById('loginPw').value.trim();if(!id||!pw){alert('입력하세요');return}user={id,name:'사용자',team:'1팀'};document.getElementById('loginScreen').classList.remove('active');document.getElementById('mainScreen').classList.add('active');document.getElementById('userInfo').textContent=user.name;load()}
function register(){const id=document.getElementById('regId').value.trim();const name=document.getElementById('regName').value.trim();const pw=document.getElementById('regPw').value.trim();const conf=document.getElementById('regPwConf').value.trim();const team=document.getElementById('regTeam').value;if(!id||!name||!pw||!conf||!team){alert('모두 입력');return}if(pw!==conf){alert('비번 불일치');return}alert('가입신청 완료');showLogin()}
function logout(){user=null;document.getElementById('mainScreen').classList.remove('active');document.getElementById('loginScreen').classList.add('active')}
function load(){all=[{id:1,name:"AUDIOMETER",assetNo:"50604-00152",serial:"EF162183",category:"청력기",location:"1팀",headsetModel:"SA-203",headsetSerial:"WT109429"},{id:2,name:"AUDIOMETER",assetNo:"50604-00153",serial:"EF162190",category:"청력기",location:"미지정",headsetModel:"SA-203",headsetSerial:"WT109528"}];filt=[...all];renderCat();renderList()}
function renderCat(){const c=document.getElementById('categoryTabs');c.innerHTML='<button class="category-tab active" id="catAll">전체</button>';document.getElementById('catAll').onclick=()=>selectCat('');CAT.forEach(ca=>{const cnt=all.filter(e=>e.category===ca).length;if(cnt>0){const btn=document.createElement('button');btn.className='category-tab';btn.textContent=ca+'('+cnt+')';btn.onclick=()=>selectCat(ca);c.appendChild(btn)}})}
function selectCat(c){cat=c;document.querySelectorAll('.category-tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');filter()}
function filter(){const s=document.getElementById('searchInput').value.toLowerCase();filt=all.filter(i=>{const mc=!cat||i.category===cat;const ms=!s||i.name.toLowerCase().includes(s)||i.assetNo.toLowerCase().includes(s);return mc&&ms});renderList()}
function renderList(){const l=document.getElementById('equipmentList');if(filt.length===0){l.innerHTML='<div style="text-align:center;padding:40px;color:#999">없음</div>';return}l.innerHTML=filt.map(i=>{let html='<div class="equipment-item">';html+='<input type="checkbox" class="equipment-checkbox" data-id="'+i.id+'">';html+='<div class="equipment-name">'+i.name+'</div>';html+='<div class="equipment-info">자산: '+i.assetNo+'</div>';if(i.serial)html+='<div class="equipment-info">시리얼: '+i.serial+'</div>';if(i.notebookModel)html+='<div class="equipment-info">노트북: '+i.notebookModel+'</div>';if(i.headsetModel)html+='<div class="equipment-info">헤드셋: '+i.headsetModel+'</div>';html+='<span class="equipment-location">'+i.location+'</span>';html+='<button class="email-btn" data-id="'+i.id+'">이메일</button>';html+='</div>';return html}).join('');document.querySelectorAll('.equipment-checkbox').forEach(cb=>cb.onchange=function(){toggleSel(parseInt(this.dataset.id))});document.querySelectorAll('.email-btn').forEach(btn=>btn.onclick=function(){showEmailFor(parseInt(this.dataset.id))})}
function toggleSel(id){const idx=sel.indexOf(id);if(idx>-1)sel.splice(idx,1);else sel.push(id);document.getElementById('selectedCount').textContent=sel.length;document.getElementById('actionBar').classList.toggle('active',sel.length>0)}
function switchView(v){if(v==='equipment'){document.getElementById('equipmentView').classList.remove('hidden');document.getElementById('teamView').classList.add('hidden');document.getElementById('equipTab').classList.add('active');document.getElementById('teamTab').classList.remove('active')}else{document.getElementById('equipmentView').classList.add('hidden');document.getElementById('teamView').classList.remove('hidden');document.getElementById('equipTab').classList.remove('active');document.getElementById('teamTab').classList.add('active');filterTeam()}}
function filterTeam(){const t=document.getElementById('teamFilter').value;const tl=document.getElementById('teamList');const data=t?all.filter(e=>e.location===t):all;if(data.length===0){tl.innerHTML='<div style="text-align:center;padding:40px;color:#999">없음</div>';return}tl.innerHTML=data.map(i=>'<div class="equipment-item"><div class="equipment-name">'+i.name+'</div><div class="equipment-info">자산: '+i.assetNo+'</div><span class="equipment-location">'+i.location+'</span></div>').join('')}
function showBulk(){document.getElementById('bulkTeam').value=user.team;document.getElementById('bulkManager').value=user.name;document.getElementById('bulkModal').classList.add('active')}
function closeBulk(){document.getElementById('bulkModal').classList.remove('active')}
function toggleReturn(){const isRet=document.getElementById('bulkType').value==='반납';document.getElementById('returnGroup').classList.toggle('hidden',!isRet);if(!isRet)document.getElementById('customGroup').classList.add('hidden')}
function toggleCustom(){const isCustom=document.getElementById('returnReason').value==='기타';document.getElementById('customGroup').classList.toggle('hidden',!isCustom)}
function submitBulk(){alert('등록완료')}
function showEmailFor(id){document.getElementById('emailModal').classList.add('active')}
function closeEmail(){document.getElementById('emailModal').classList.remove('active')}
function sendEmail(){alert('전송완료');closeEmail()}
function showEditModal(){document.getElementById('editId').value=user.id;document.getElementById('editName').value=user.name;document.getElementById('editTeam').value=user.team;document.getElementById('editModal').classList.add('active')}
function closeEdit(){document.getElementById('editModal').classList.remove('active')}
function saveEdit(){user.team=document.getElementById('editTeam').value;alert('수정완료');closeEdit()}
</script>
</body>
</html>
